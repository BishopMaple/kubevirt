project_id: "cnv"
display_name: "OpenShift Virtualization (CNV)"
description: "KubeVirt-based virtualization for OpenShift"

feature_toggles:
  polarion: true
  tier1_tests: true
  tier2_tests: true

versioning:
  product_name: "OpenShift Virtualization"
  platform_name: "OCP"
  current_version: "4.22"

stp_document:
  header: "Openshift-virtualization-tests Test plan"

sig_mappings:
  sig-network: "network"
  sig-compute: "compute"
  sig-storage: "storage"
  sig-migration: "migration"

decorator_mappings:
  sig-network: "decorators.SigNetwork"
  sig-compute: "decorators.SigCompute"
  sig-storage: "decorators.SigStorage"

scope_boundaries:
  validation_gate: "Would removing KubeVirt make this test meaningless?"
  in_scope_resources:
    - "VirtualMachine"
    - "VirtualMachineInstance"
    - "DataVolume"
    - "VirtualMachineSnapshot"
    - "VirtualMachineInstanceMigration"
    - "VirtualMachineClusterInstancetype"
    - "HyperConverged"
    - "KubeVirt"
    - "CDI"
  out_of_scope_if_only:
    - "Pod"
    - "Deployment"
    - "StatefulSet"
    - "PersistentVolumeClaim"
    - "Node"
    - "Namespace"
    - "ConfigMap"
    - "Secret"
    - "Service"
    - "Ingress"
    - "Route"
  cli_tools:
    - "virtctl"
    - "oc"
    - "kubectl"
  domain_vocabulary:
    - "VMI"
    - "NAD"
    - "CDI"
    - "CUDN"
    - "virt-controller"
    - "virt-handler"
    - "virt-api"
    - "virt-launcher"
    - "virt-operator"
    - "HyperConverged"
