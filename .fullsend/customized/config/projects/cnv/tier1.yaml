enabled: true
language: "go"
framework: "ginkgo-v2"
default_package: "network"

import_base: "kubevirt.io/kubevirt"
imports:
  dot_imports:
    - "github.com/onsi/ginkgo/v2"
    - "github.com/onsi/gomega"
  standard:
    - "context"
    - "time"
  project_api:
    - { path: "kubevirt.io/api/core/v1", alias: "v1" }
  k8s_core:
    - { path: "k8s.io/api/core/v1", alias: "k8sv1" }
    - { path: "k8s.io/apimachinery/pkg/apis/meta/v1", alias: "metav1" }
  test_framework:
    - "kubevirt.io/kubevirt/tests/decorators"
    - "kubevirt.io/kubevirt/tests/framework/kubevirt"
    - "kubevirt.io/kubevirt/tests/testsuite"
    - "kubevirt.io/kubevirt/tests/libvmi"
  network:
    - { path: "github.com/k8snetworkplumbingwg/network-attachment-definition-client/pkg/apis/k8s.cni.cncf.io/v1", alias: "networkv1" }

helper_libraries:
  libvmifact: "kubevirt.io/kubevirt/tests/libvmifact"
  libnet: "kubevirt.io/kubevirt/tests/libnet"
  libwait: "kubevirt.io/kubevirt/tests/libwait"
  libpod: "kubevirt.io/kubevirt/tests/libpod"
  libvmops: "kubevirt.io/kubevirt/tests/libvmops"
  libmigration: "kubevirt.io/kubevirt/tests/libmigration"
  libstorage: "kubevirt.io/kubevirt/tests/libstorage"
  console: "kubevirt.io/kubevirt/tests/console"
  matcher: "kubevirt.io/kubevirt/tests/framework/matcher"

os_patterns:
  fedora:
    vm_creator: "libvmifact.NewFedora"
    login: "console.LoginToFedora"
  alpine:
    vm_creator: "libvmifact.NewAlpine"
    login: "console.LoginToAlpine"
  cirros:
    vm_creator: "libvmifact.NewCirros"
    login: "console.LoginToCirros"

timeout_constants:
  tiny: "StartupTimeoutSecondsTiny"
  small: "StartupTimeoutSecondsSmall"
  medium: "StartupTimeoutSecondsMedium"
  large: "StartupTimeoutSecondsLarge"
  xlarge: "StartupTimeoutSecondsXLarge"
  huge: "StartupTimeoutSecondsHuge"
  xhuge: "StartupTimeoutSecondsXHuge"
  migration: "MigrationWaitTime"

nad_patterns:
  localnet: "libnet.NewPasstNetAttachDef"
  bridge: "libnet.NewBridgeNetAttachDef"
  sriov: "libnet.NewSriovNetAttachDef"
  macvtap: "libnet.NewMacvtapNetAttachDef"

context_init:
  - statement: "ctx := context.Background()"
    variable: "ctx"
    type: "context.Context"
  - statement: "namespace := testsuite.GetTestNamespace(nil)"
    variable: "namespace"
    type: "string"
