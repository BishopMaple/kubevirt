# Python Test Configuration
# Required when feature_toggles.python_tests = true

enabled: true
language: "python"
framework: "pytest"

# Python packages used by the test framework
# python_packages:
#   wrapper: "my-python-wrapper"

# Import patterns for generated test files
import_patterns:
  standard:
    - "import logging"
    - "import pytest"

