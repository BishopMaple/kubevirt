#     description: "Coding standards and test design workflow"
#
#   stp_template:
#     repo: "design_docs_repo"
#     path: "docs/stp-template.md"
#     fallback: "templates/stp/stp-template.md"
#     description: "Official STP template structure"

pr_url_patterns:
  - "https://github.com/{org}/{repo}/pull/{number}"
