# Go Test Configuration
# Required when feature_toggles.go_tests = true

enabled: true
language: "go"
framework: "ginkgo-v2"
default_package: "tests"

# Go import paths for generated test files
import_base: "github.com/my-org/my-project"
imports:
  dot_imports:
    - "github.com/onsi/ginkgo/v2"
    - "github.com/onsi/gomega"
  standard:
    - "context"
    - "time"
