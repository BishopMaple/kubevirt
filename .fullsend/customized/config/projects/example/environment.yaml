# Platform and Environment Requirements
# Describes the runtime environment for generated tests.

platform:
  name: "Kubernetes"
  short_name: "K8s"
  cli_tools:
    - "kubectl"

cluster_requirements:
  topology: "Single-node"
  min_worker_nodes: 1

version_constraints:
  kubernetes: "1.28+"

