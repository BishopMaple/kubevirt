# QualityFlow Project Routing Map
# Maps Jira issue prefixes to project configurations
version: "1.0"

routes:
  - prefix: "MYPROJ"
    project: "example"
  # Add more routes for additional projects:
  # - prefix: "FEAT"
  #   project: "another-project"

# "example" = use example project for unknown prefixes
# null = error on unknown prefix (fail-fast)
default_project: "example"
