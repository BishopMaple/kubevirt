version: 1

# Network policy for the QualityFlow agent.
# Allows read access to Jira (issue data) and GitHub (PR diffs).
# Allows Vertex AI for Claude inference.
# Blocks all write operations to external services.

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  vertex_ai:
    name: vertex-ai
    endpoints:
      - host: "*.googleapis.com"
        port: 443
        protocol: tcp
        enforcement: enforce
        access: allow
    binaries:
      - path: "**/curl"
      - path: "**/claude"
      - path: "**/node"

  jira:
    name: jira
    endpoints:
      - host: "*.atlassian.net"
        port: 443
        protocol: tcp
        enforcement: enforce
        access: allow
      - host: "issues.redhat.com"
        port: 443
        protocol: tcp
        enforcement: enforce
        access: allow
    binaries:
      - path: "**/curl"
      - path: "**/acli"

  github:
    name: github
    endpoints:
      - host: "api.github.com"
        port: 443
        protocol: tcp
        enforcement: enforce
        access: allow
      - host: "github.com"
        port: 443
        protocol: tcp
        enforcement: enforce
        access: allow
    binaries:
      - path: "**/gh"
      - path: "**/curl"

  npm_registry:
    name: npm-registry
    endpoints:
      - host: "registry.npmjs.org"
        port: 443
        protocol: tcp
        enforcement: enforce
        access: allow
    binaries:
      - path: "**/npm"
      - path: "**/node"

  go_modules:
    name: go-modules
    endpoints:
      - host: "proxy.golang.org"
        port: 443
        protocol: tcp
        enforcement: enforce
        access: allow
      - host: "sum.golang.org"
        port: 443
        protocol: tcp
        enforcement: enforce
        access: allow
      - host: "storage.googleapis.com"
        port: 443
        protocol: tcp
        enforcement: enforce
        access: allow
    binaries:
      - path: "**/go"
      - path: "**/gopls"
