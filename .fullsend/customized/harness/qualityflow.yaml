# harness/qualityflow.yaml — Generate and commit e2e tests to a PR.
#
# Position in SDLC: after fix loop, before retro.
# Trigger: review bot approves PR, or /fs-qualityflow command on PR.
#
# Flow: pre-script → sandbox (agent) → validation → post-script
#   pre-script  : extracts PR number and Jira ticket, records PRE_AGENT_HEAD
#   agent       : reads PR diff, generates STP/STD internally, writes working tests
#   validation  : checks output files and test commits exist
#   post-script : protected-path check → gitleaks → push tests → PR comment
agent: agents/qualityflow.md
doc: docs/agents/qualityflow.md
model: opus
image: ghcr.io/fullsend-ai/fullsend-code:latest
policy: policies/qualityflow.yaml
agent_input: config

pre_script: scripts/pre-qualityflow.sh

host_files:
  - src: env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: env/qualityflow.env
    dest: /sandbox/workspace/.env.d/qualityflow.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true

plugins:
  - plugins/gopls-lsp

skills:
  - skills/project-resolver
  - skills/jira-parser
  - skills/link-resolver
  - skills/pr-analyzer
  - skills/feature-finder
  - skills/lsp-tracer
  - skills/requirement-mapper
  - skills/scenario-builder
  - skills/tier-classifier
  - skills/template-engine
  - skills/table-generator
  - skills/pii-sanitizer
  - skills/output-validator
  - skills/ticket-assessor
  - skills/pipeline-state
  - skills/review-rules-extractor
  - skills/stp-reviewer
  - skills/std-orchestrator
  - skills/std-generator
  - skills/std-reviewer
  - skills/go-stub-generator
  - skills/python-stub-generator
  - skills/go-test-generator
  - skills/python-test-generator

validation_loop:
  script: scripts/validate-qualityflow.sh
  max_iterations: 2

post_script: scripts/post-qualityflow.sh

runner_env:
  JIRA_TICKET: "${JIRA_TICKET}"
  GH_TOKEN: "${GH_TOKEN}"
  PUSH_TOKEN: "${PUSH_TOKEN}"
  REPO_FULL_NAME: "${REPO_FULL_NAME}"
  PR_NUMBER: "${PR_NUMBER}"
  TARGET_BRANCH: "${TARGET_BRANCH}"
  TRIGGER_SOURCE: "${TRIGGER_SOURCE}"
  PRE_AGENT_HEAD: "${PRE_AGENT_HEAD}"
  GIT_AUTHOR_NAME: "fullsend-qualityflow"
  GIT_AUTHOR_EMAIL: "qualityflow@fullsend.ai"
  GIT_COMMITTER_NAME: "fullsend-qualityflow"
  GIT_COMMITTER_EMAIL: "qualityflow@fullsend.ai"
  FULLSEND_OUTPUT_SCHEMA: "${FULLSEND_DIR}/schemas/qualityflow-result.schema.json"
  FULLSEND_OUTPUT_FILE: "summary.json"

timeout_minutes: 60
