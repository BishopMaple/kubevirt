# harness/stp-refiner.yaml — Iteratively review and fix an STP until APPROVED.
#
# Needs Jira (curl) and GitHub (gh CLI) for re-verification against source data.
agent: agents/stp-refiner.md
description: "Review-refine loop that iterates until the STP reaches APPROVED verdict"
model: opus
image: ghcr.io/fullsend-ai/fullsend-code:latest
policy: policies/qf-full.yaml
agent_input: config

pre_script: scripts/pre-stp-refiner.sh

host_files:
  - src: env/qf-credentials.env
    dest: /sandbox/workspace/.env.d/qf-credentials.env
    expand: true

skills:
  - skills/project-resolver
  - skills/review-rules-extractor
  - skills/stp-reviewer
  - skills/scenario-builder
  - skills/output-validator
  - skills/jira-parser
  - skills/pr-analyzer

validation_loop:
  script: scripts/validate-review.sh
  max_iterations: 3

post_script: scripts/post-stp-refiner.sh

runner_env:
  JIRA_TICKET: "${JIRA_TICKET}"
  FULLSEND_OUTPUT_SCHEMA: ${FULLSEND_DIR}/schemas/stp-refiner-result.schema.json

timeout_minutes: 25
