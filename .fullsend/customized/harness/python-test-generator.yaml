# harness/python-test-generator.yaml — Generate working Python/pytest tier 2 tests.
#
# Needs GitHub (gh CLI) for repo file fetches and Python registries for imports.
agent: agents/python-test-generator.md
description: "Generate working Python/pytest tier 2 tests from STD specifications"
model: opus
image: ghcr.io/fullsend-ai/fullsend-code:latest
policy: policies/qf-codegen.yaml
agent_input: config

pre_script: scripts/pre-python-test-generator.sh

host_files:
  - src: env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true
  - src: env/qf-credentials.env
    dest: /sandbox/workspace/.env.d/qf-credentials.env
    expand: true
skills:
  - skills/project-resolver
  - skills/python-test-generator
  - skills/pipeline-state
  - skills/lsp-tracer
  - skills/feature-finder

validation_loop:
  script: scripts/validate-python-tests.sh
  max_iterations: 2

post_script: scripts/post-python-test-generator.sh

plugins:
  - plugins/gopls-lsp

runner_env:
  JIRA_TICKET: "${JIRA_TICKET}"
  FULLSEND_OUTPUT_SCHEMA: ${FULLSEND_DIR}/schemas/python-test-result.schema.json

timeout_minutes: 20
