    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "CNV-89519"

    patterns:
      primary: "unit-phase-calculation"
      secondary:
        - "vmi-status-reason"
        - "launcher-client-check"
      helpers_required:
        - name: "mock launcher client"
          functions: ["Ping", "IsReady"]
          purpose: "Simulate responsive vs unresponsive launcher"
      decorators:
        - "decorators.SigCompute"

    variables:
      closure_scope:
        - name: "ctx"
          type: "context.Context"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It"]
          comment: "Test context"
        - name: "vmi"
          type: "*v1.VirtualMachineInstance"
          initialized_in: "BeforeEach"
          used_in: ["It"]
          comment: "VMI in Running phase"
        - name: "phase"
          type: "v1.VirtualMachineInstancePhase"
          initialized_in: "It"
          used_in: ["It"]
          comment: "Calculated phase result"
        - name: "err"
          type: "error"
          initialized_in: "It"
          used_in: ["It"]
          comment: "Error result"

    test_structure:
      type: "single"
      describe:
        wrapper: "SIG"
        description: "virt-handler domain reconciliation"
        decorators:
          - "decorators.SigCompute"
      context:
        description: "calculateVmPhaseForStatusReason with nil domain"
        decorators:
          - "Ordered"
      it:
        description: "should return correct phase based on launcher responsiveness when domain is nil"
        test_id_format: "[test_id:TS-CNV-89519-005]"

    code_structure: |
      Context("calculateVmPhaseForStatusReason with nil domain", Ordered, func() {
        var vmi *v1.VirtualMachineInstance

        BeforeEach(func() {
          vmi = &v1.VirtualMachineInstance{
            Status: v1.VirtualMachineInstanceStatus{
              Phase: v1.Running,
            },
          }
        })

        It("[test_id:TS-CNV-89519-005]should not transition to Failed when launcher is responsive and domain is nil", func() {
          phase := calculateVmPhaseForStatusReason(nil, vmi, responsiveLauncherClient)
          Expect(phase).ToNot(Equal(v1.Failed))
        })

        It("[test_id:TS-CNV-89519-005b]should transition to Failed when launcher is unresponsive and domain is nil", func() {
          phase := calculateVmPhaseForStatusReason(nil, vmi, unresponsiveLauncherClient)
          Expect(phase).To(Equal(v1.Failed))
        })
      })

    test_objective:
      title: "calculateVmPhaseForStatusReason with nil domain"
      what: |
        Tests the calculateVmPhaseForStatusReason function behavior when the domain
        is nil (not found during scan). Validates two sub-cases: (1) launcher is
        responsive — phase should NOT transition to Failed, and (2) launcher is
        unresponsive — phase should transition to Failed. This is the code path
        at vm.go:2196-2220 that caused the original bug.
      why: |
        The root cause of CNV-89519 was that a missed domain (nil) combined with
        a momentarily unresponsive launcher caused an incorrect Failed transition.
        This test validates the decision logic that determines VMI phase when the
        domain is nil, ensuring responsive launchers prevent false Failed transitions.
      acceptance_criteria:
        - "When domain is nil and launcher is responsive, phase is NOT Failed"
        - "When domain is nil and launcher is unresponsive, phase IS Failed"
        - "Phase transition logic correctly differentiates the two cases"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go/Ginkgo unit test with mock launcher client"

    specific_preconditions:
      - name: "VMI in Running phase"
        requirement: "VirtualMachineInstance with Status.Phase == Running"
        validation: "Unit test setup"

    test_data:
      resource_definitions:
        - name: "runningVMI"
          type: "v1.VirtualMachineInstance"
          yaml: |
            apiVersion: kubevirt.io/v1
            kind: VirtualMachineInstance
            metadata:
              name: "test-vmi"
              namespace: "test-namespace"
            status:
              phase: Running

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create VMI object in Running phase"
          command: "Construct VirtualMachineInstance with Status.Phase = Running"
          validation: "VMI object created"
          pattern_id: "vmi-status-reason"
          code_template: |
            vmi = &v1.VirtualMachineInstance{
              Status: v1.VirtualMachineInstanceStatus{
                Phase: v1.Running,
              },
            }
      test_execution:
        - step_id: "TEST-01"
          action: "Call calculateVmPhaseForStatusReason with nil domain and responsive launcher"
          command: "calculateVmPhaseForStatusReason(nil, vmi, responsiveLauncher)"
          validation: "Phase is NOT Failed"
          pattern_id: "unit-phase-calculation"
          code_template: |
            phase = calculateVmPhaseForStatusReason(nil, vmi, responsiveLauncherClient)
            Expect(phase).ToNot(Equal(v1.Failed))
        - step_id: "TEST-02"
          action: "Call calculateVmPhaseForStatusReason with nil domain and unresponsive launcher"
          command: "calculateVmPhaseForStatusReason(nil, vmi, unresponsiveLauncher)"
          validation: "Phase IS Failed"
          pattern_id: "unit-phase-calculation"
          code_template: |
            phase = calculateVmPhaseForStatusReason(nil, vmi, unresponsiveLauncherClient)
            Expect(phase).To(Equal(v1.Failed))
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Responsive launcher prevents Failed transition when domain is nil"
        condition: "phase != v1.Failed when launcher.Ping() succeeds"
        failure_impact: "False Failed transitions during virt-handler restart with running VMs"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Unresponsive launcher correctly triggers Failed transition"
        condition: "phase == v1.Failed when launcher.Ping() fails"
        failure_impact: "Truly failed VMs would not be detected"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

