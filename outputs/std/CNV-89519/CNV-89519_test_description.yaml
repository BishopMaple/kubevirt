          type: "VirtualMachineForTests"
          initialized_in: "fixture"
          used_in: ["test"]
          comment: "Running VM for virt-handler restart test"
        - name: "virt_handler_pod"
          type: "Pod"
          initialized_in: "fixture"
          used_in: ["test"]
          comment: "virt-handler pod on the VM's node"

    test_structure:
      type: "single"
      describe:
        description: "VMI domain reconciliation during virt-handler rolling update"
      context:
        description: "single VM survives virt-handler pod deletion"
        decorators: []
      it:
        description: "test that running VM survives virt-handler pod deletion and replacement"
        test_id_format: "test_running_vm_survives_virt_handler_pod_deletion"

    code_structure: |
      class TestVirtHandlerDomainReconciliation:
          """
          Tests for VMI domain reconciliation during virt-handler rolling update.

          STP Reference: outputs/stp/CNV-89519/CNV-89519_test_plan.md
          Jira: https://redhat.atlassian.net/browse/CNV-89519

          Markers:
              - gating

          Preconditions:
              - Running Fedora virtual machine
              - virt-handler DaemonSet healthy
          """
          __test__ = False

          def test_running_vm_survives_virt_handler_pod_deletion(self):
              """
              Test that a running VM survives virt-handler pod deletion and replacement.

              Preconditions:
                  - Running Fedora virtual machine
                  - virt-handler pod identified on the VM's node

              Steps:
                  1. Delete the virt-handler pod on the VM's node
                  2. Wait for the replacement virt-handler pod to become Ready
                  3. Verify the VMI remains in Running phase

              Expected:
                  - VMI is "Running"
              """

    test_objective:
      title: "Running VM survives virt-handler pod deletion"
      what: |
        Tests the end-to-end scenario where a running VM must survive a virt-handler
        pod deletion and replacement. The new virt-handler pod must discover the
        existing domain via ghost records and reconnect, keeping the VMI in Running phase.
      why: |
        This is the core customer scenario for CNV-89519. During a CNV upgrade, the
        virt-handler DaemonSet undergoes a rolling update. If the new virt-handler pod
        fails to discover running domains, VMs are incorrectly marked as Failed,
        causing customer workload disruption.
      acceptance_criteria:
        - "VMI remains in Running phase throughout virt-handler pod replacement"
        - "No Failed phase transition observed in VMI events"
        - "VM is accessible after virt-handler replacement"

    classification:
      test_type: "E2E"
      scope: "Multi-component"
      automation_approach: "pytest with python-wrapper"

    specific_preconditions:
      - name: "Running Fedora VM"
        requirement: "VirtualMachine with Fedora guest OS in Running phase"
        validation: "oc get vmi -o jsonpath='{.status.phase}' == Running"
      - name: "Healthy virt-handler DaemonSet"
        requirement: "virt-handler pods running on all worker nodes"
        validation: "oc get ds virt-handler -n openshift-cnv -o jsonpath='{.status.numberReady}'"

    test_data:
      resource_definitions:
        - name: "fedoraVM"
          type: "VirtualMachine"
          yaml: |
            apiVersion: kubevirt.io/v1
            kind: VirtualMachine
            metadata:
              name: "test-vm-virt-handler-restart"
            spec:
              running: true
              template:
                spec:
                  domain:
                    resources:
                      requests:
                        memory: "1Gi"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create and start a Fedora VirtualMachine"
          command: "VirtualMachineForTests with fedora_vm_body"
          validation: "VMI is in Running phase"
          pattern_id: "vm-lifecycle"
        - step_id: "SETUP-02"
          action: "Identify the virt-handler pod on the VM's node"
          command: "oc get pods -n openshift-cnv -l kubevirt.io=virt-handler -o wide"
          validation: "virt-handler pod name and node identified"
          pattern_id: "virt-handler-restart"
      test_execution:
        - step_id: "TEST-01"
          action: "Delete the virt-handler pod on the VM's node"
          command: "oc delete pod <virt-handler-pod> -n openshift-cnv"
          validation: "Pod is deleted"
          pattern_id: "virt-handler-restart"
        - step_id: "TEST-02"
          action: "Wait for the replacement virt-handler pod to become Ready"
          command: "oc wait pod -n openshift-cnv -l kubevirt.io=virt-handler --field-selector spec.nodeName=<node> --for=condition=Ready --timeout=120s"
          validation: "Replacement pod is Ready"
          pattern_id: "virt-handler-restart"
        - step_id: "TEST-03"
          action: "Verify the VMI remains in Running phase"
          command: "oc get vmi <name> -o jsonpath='{.status.phase}'"
          validation: "VMI phase is Running"
          pattern_id: "vmi-phase-monitoring"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete the VirtualMachine"
          command: "Context manager handles cleanup"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "VMI remains in Running phase after virt-handler replacement"
        condition: "vmi.status.phase == 'Running'"
        failure_impact: "VM workload disrupted during routine CNV update"

    dependencies:
      kubernetes_resources:
        - "VirtualMachine: test-vm-virt-handler-restart"
        - "DaemonSet: virt-handler (openshift-cnv)"
      external_tools:
        - "oc CLI"
        - "virtctl"
      scenario_specific_rbac:
        - "delete pods in openshift-cnv namespace"

