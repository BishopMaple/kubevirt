    code_structure: |
      def test_multiple_vms_survive_virt_handler_rolling_update(self):
          """
          Test that multiple running VMs (10+) on the same node survive virt-handler rolling update.

          Preconditions:
              - 10+ running Fedora virtual machines scheduled on the same worker node
              - virt-handler DaemonSet healthy

          Steps:
              1. Delete the virt-handler pod on the target node
              2. Wait for the replacement virt-handler pod to become Ready
              3. Verify all VMIs remain in Running phase
              4. Verify no VMI experienced a Failed phase transition via Kubernetes events

          Expected:
              - All VMIs are "Running"
          """

    test_objective:
      title: "Multiple VMs survive virt-handler rolling update on same node"
      what: |
        Tests that multiple running VMs (10+) co-located on a single worker node
        all survive a virt-handler pod restart. This validates the domain discovery
        retry mechanism under scale conditions, where the ghost record store contains
        many entries and socket iteration must handle all of them.
      why: |
        The original bug manifested at scale (252 VMs per node). While CI cannot
        reproduce full production scale, testing with 10+ VMs per node validates
        the retry mechanism handles concurrent domain discovery. A single missed
        domain at scale would cause customer workload disruption.
      acceptance_criteria:
        - "All 10+ VMIs remain in Running phase after virt-handler restart"
        - "No VMI experiences a Failed phase transition"
        - "Kubernetes events show no unexpected VMI state changes"

    classification:
      test_type: "E2E"
      scope: "Multi-component"
      automation_approach: "pytest with python-wrapper"

    specific_preconditions:
      - name: "10+ running VMs on same node"
        requirement: "At least 10 VirtualMachines scheduled to the same worker node"
        validation: "oc get vmi --field-selector status.nodeName=<node> | wc -l >= 10"
      - name: "Adequate compute resources"
        requirement: "Target node has sufficient CPU/memory for 10+ VMs"
        validation: "oc describe node <worker> | grep -A5 Allocatable"

    test_data:
      resource_definitions:
        - name: "fedoraVMs"
          type: "VirtualMachine"
          yaml: |
            apiVersion: kubevirt.io/v1
            kind: VirtualMachine
            metadata:
              name: "test-vm-scale-{N}"
            spec:
              running: true
              template:
                spec:
                  nodeSelector:
                    kubernetes.io/hostname: "<target-node>"
                  domain:
                    resources:
                      requests:
                        memory: "512Mi"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create and start 10+ Fedora VMs on same worker node"
          command: "Create VMs with nodeSelector targeting a specific worker"
          validation: "All VMIs in Running phase on target node"
          pattern_id: "vm-scale-lifecycle"
        - step_id: "SETUP-02"
          action: "Identify the virt-handler pod on the target node"
          command: "oc get pods -n openshift-cnv -l kubevirt.io=virt-handler --field-selector spec.nodeName=<node>"
          validation: "virt-handler pod identified"
          pattern_id: "virt-handler-restart"
      test_execution:
        - step_id: "TEST-01"
          action: "Delete the virt-handler pod on the target node"
          command: "oc delete pod <virt-handler-pod> -n openshift-cnv"
          validation: "Pod deleted"
          pattern_id: "virt-handler-restart"
        - step_id: "TEST-02"
          action: "Wait for replacement virt-handler pod to become Ready"
          command: "oc wait pod --for=condition=Ready --timeout=180s"
          validation: "Replacement pod Ready"
          pattern_id: "virt-handler-restart"
        - step_id: "TEST-03"
          action: "Verify all VMIs remain in Running phase"
          command: "oc get vmi --field-selector status.nodeName=<node> -o jsonpath='{.items[*].status.phase}'"
          validation: "All phases are Running"
          pattern_id: "vmi-phase-monitoring"
        - step_id: "TEST-04"
          action: "Check Kubernetes events for unexpected VMI phase transitions"
          command: "oc get events --field-selector reason=SuccessfulDelete,involvedObject.kind=VirtualMachineInstance"
          validation: "No Failed transitions in events"
          pattern_id: "vmi-phase-monitoring"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete all test VMs"
          command: "Context manager handles cleanup"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "All VMIs remain in Running phase after virt-handler restart"
        condition: "all(vmi.status.phase == 'Running' for vmi in vmis)"
        failure_impact: "Scale-dependent domain discovery failure causes workload disruption"

    dependencies:
      kubernetes_resources:
        - "VirtualMachine: test-vm-scale-{0..9} (10+ instances)"
        - "DaemonSet: virt-handler (openshift-cnv)"
      external_tools:
        - "oc CLI"
        - "virtctl"
      scenario_specific_rbac:
        - "delete pods in openshift-cnv namespace"

