  - scenario_id: "001"
    test_id: "TS-CNV-89519-001"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "CNV-89519"

    patterns:
      primary: "unit-retry-mechanism"
      secondary:
        - "mock-client-factory"
        - "domain-retrieval"
      helpers_required:
        - name: "mock cmdclient"
          functions: ["NewClient", "GetDomain"]
          purpose: "Mock virt-launcher cmd-client for transient failure simulation"
      decorators:
        - "decorators.SigCompute"

    variables:
      closure_scope:
        - name: "ctx"
          type: "context.Context"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It"]
          comment: "Test context"
        - name: "mockClientFactory"
          type: "func(string) (cmdclient.LauncherClient, error)"
          initialized_in: "BeforeEach"
          used_in: ["It"]
          comment: "Configurable mock client factory"
        - name: "domain"
          type: "*api.Domain"
          initialized_in: "It"
          used_in: ["It"]
          comment: "Retrieved domain result"
        - name: "err"
          type: "error"
          initialized_in: "It"
          used_in: ["It"]
          comment: "Error result"

    test_structure:
      type: "single"
      describe:
        wrapper: "SIG"
        description: "virt-handler domain reconciliation"
        decorators:
          - "decorators.SigCompute"
      context:
        description: "getDomainWithRetry succeeds after transient failure"
        decorators:
          - "Ordered"
      it:
        description: "should return domain after retry on transient socket failure"
        test_id_format: "[test_id:TS-CNV-89519-001]"

    code_structure: |
      Context("getDomainWithRetry succeeds after transient failure", Ordered, func() {
        var mockClientFactory func(string) (cmdclient.LauncherClient, error)
        var domain *api.Domain

        BeforeEach(func() {
          callCount := 0
          mockClientFactory = func(socketPath string) (cmdclient.LauncherClient, error) {
            callCount++
            if callCount == 1 {
              return nil, fmt.Errorf("transient socket error")
            }
            return &mockClient{domain: expectedDomain}, nil
          }
        })

        It("[test_id:TS-CNV-89519-001]should return domain after retry on transient socket failure", func() {
          domain, err := getDomainWithRetry(mockClientFactory, socketPath, 3, 100*time.Millisecond)
          ExpectWithOffset(1, err).ToNot(HaveOccurred())
          Expect(domain).ToNot(BeNil())
        })
      })

    test_objective:
      title: "getDomainWithRetry succeeds after transient failure"
      what: |
        Tests that the getDomainWithRetry function successfully retrieves a domain
        after encountering a transient socket connection failure on the first attempt.
        The mock client factory returns an error on the first call and a valid domain
        on the second call, verifying the retry mechanism works correctly.
      why: |
        This is the core fix for CNV-89519. When virt-handler restarts during a rolling
        update, transient socket failures to virt-launcher pods are expected. Without
        retry logic, a single failure causes the domain to be missed, leading to
        incorrect VMI Failed phase transitions. This test validates that the retry
        mechanism prevents such false negatives.
      acceptance_criteria:
        - "getDomainWithRetry returns a non-nil domain after transient failure"
        - "No error is returned after successful retry"
        - "Domain properties match the expected running domain"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go/Ginkgo unit test with mock client"

    specific_preconditions:
      - name: "Mock cmd-client"
        requirement: "Client factory that fails on first call, succeeds on retry"
        validation: "Unit test setup"

    test_data:
      resource_definitions:
        - name: "expectedDomain"
          type: "api.Domain"
          yaml: |
            metadata:
              name: "test-vmi"
              namespace: "test-namespace"
            status:
              status: "Running"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock client factory with transient failure behavior"
          command: "Configure mock to fail on first call, succeed on second"
          validation: "Mock factory created and configured"
          pattern_id: "mock-client-factory"
          code_template: |
            callCount := 0
            mockClientFactory = func(socketPath string) (cmdclient.LauncherClient, error) {
              callCount++
              if callCount == 1 {
                return nil, fmt.Errorf("transient socket error")
              }
              return &mockClient{domain: expectedDomain}, nil
            }
      test_execution:
        - step_id: "TEST-01"
          action: "Call getDomainWithRetry with mock factory"
          command: "getDomainWithRetry(mockClientFactory, socketPath, 3, 100*time.Millisecond)"
          validation: "Domain is returned, no error"
          pattern_id: "domain-retrieval"
          code_template: |
            domain, err = getDomainWithRetry(mockClientFactory, socketPath, 3, 100*time.Millisecond)
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            Expect(domain).ToNot(BeNil())
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Domain is returned successfully after retry"
        condition: "domain != nil && err == nil"
        failure_impact: "Retry mechanism does not recover from transient failures, VMIs will be incorrectly marked Failed"

