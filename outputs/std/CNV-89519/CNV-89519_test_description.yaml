    mvp: true
    requirement_id: "CNV-89519"

    patterns:
      primary: "unit-retry-exhaustion"
      secondary:
        - "mock-client-factory"
        - "domain-retrieval"
      helpers_required:
        - name: "mock cmdclient"
          functions: ["NewClient", "GetDomain"]
          purpose: "Mock virt-launcher cmd-client for persistent failure simulation"
      decorators:
        - "decorators.SigCompute"

    variables:
      closure_scope:
        - name: "ctx"
          type: "context.Context"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It"]
          comment: "Test context"
        - name: "mockClientFactory"
          type: "func(string) (cmdclient.LauncherClient, error)"
          initialized_in: "BeforeEach"
          used_in: ["It"]
          comment: "Mock factory that always fails"
        - name: "domain"
          type: "*api.Domain"
          initialized_in: "It"
          used_in: ["It"]
          comment: "Retrieved domain result (expected nil)"
        - name: "err"
          type: "error"
          initialized_in: "It"
          used_in: ["It"]
          comment: "Error result"

    test_structure:
      type: "single"
      describe:
        wrapper: "SIG"
        description: "virt-handler domain reconciliation"
        decorators:
          - "decorators.SigCompute"
      context:
        description: "getDomainWithRetry returns nil after exhausting retries"
        decorators:
          - "Ordered"
      it:
        description: "should return nil after all retry attempts are exhausted"
        test_id_format: "[test_id:TS-CNV-89519-002]"

    code_structure: |
      Context("getDomainWithRetry returns nil after exhausting retries", Ordered, func() {
        var mockClientFactory func(string) (cmdclient.LauncherClient, error)
        var domain *api.Domain
        var attemptCount int

        BeforeEach(func() {
          attemptCount = 0
          mockClientFactory = func(socketPath string) (cmdclient.LauncherClient, error) {
            attemptCount++
            return nil, fmt.Errorf("persistent socket error")
          }
        })

        It("[test_id:TS-CNV-89519-002]should return nil after all retry attempts are exhausted", func() {
          domain, _ := getDomainWithRetry(mockClientFactory, socketPath, 3, 100*time.Millisecond)
          Expect(domain).To(BeNil())
          Expect(attemptCount).To(Equal(4)) // initial + 3 retries
        })
      })

    test_objective:
      title: "getDomainWithRetry returns nil after exhausting retries"
      what: |
        Tests that getDomainWithRetry correctly returns nil when all retry attempts
        are exhausted due to a persistent socket connection failure. Verifies that
        exactly maxRetries+1 total attempts are made (1 initial + 3 retries).
      why: |
        When a virt-launcher socket is permanently unavailable (e.g., launcher pod
        crashed), the retry mechanism must eventually give up and return nil so the
        caller can take appropriate action. This prevents infinite retry loops and
        ensures the system can correctly identify truly failed domains.
      acceptance_criteria:
        - "getDomainWithRetry returns nil domain on persistent failure"
        - "Exactly maxRetries+1 total attempts are made"
        - "Function completes within expected time bounds"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go/Ginkgo unit test with mock client"

    specific_preconditions:
      - name: "Persistent-failure mock client"
        requirement: "Client factory that always returns error"
        validation: "Unit test setup"

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock client factory that always fails"
          command: "Configure mock to return error on every call"
          validation: "Mock factory created"
          pattern_id: "mock-client-factory"
          code_template: |
            attemptCount = 0
            mockClientFactory = func(socketPath string) (cmdclient.LauncherClient, error) {
              attemptCount++
              return nil, fmt.Errorf("persistent socket error")
            }
      test_execution:
        - step_id: "TEST-01"
          action: "Call getDomainWithRetry with persistently failing mock"
          command: "getDomainWithRetry(mockClientFactory, socketPath, 3, 100*time.Millisecond)"
          validation: "Returns nil domain; exactly 4 total attempts"
          pattern_id: "domain-retrieval"
          code_template: |
            domain, _ = getDomainWithRetry(mockClientFactory, socketPath, 3, 100*time.Millisecond)
            Expect(domain).To(BeNil())
            Expect(attemptCount).To(Equal(4))
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Domain is nil after exhausting retries"
        condition: "domain == nil"
        failure_impact: "Retry mechanism may loop indefinitely or return stale data"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Exactly maxRetries+1 attempts are made"
        condition: "attemptCount == 4"
        failure_impact: "Incorrect retry count could waste time or miss recovery windows"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

