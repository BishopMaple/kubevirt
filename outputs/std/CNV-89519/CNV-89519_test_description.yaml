        - "virt-handler-restart"
        - "vmi-phase-monitoring"
      helpers_required:
        - name: "utilities.virt"
          functions: ["VirtualMachineForTests", "fedora_vm_body", "running_vm"]
          purpose: "VM creation and lifecycle management"
      decorators:
