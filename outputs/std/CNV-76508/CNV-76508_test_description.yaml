          validation: "Both clusters configured correctly"
        - step_id: "SETUP-02"
          action: "Create a VM with a running workload on source cluster"
          command: "Create VirtualMachine, wait for Running"
          validation: "VM running with workload"
      test_execution:
        - step_id: "TEST-01"
          action: "Initiate cross-cluster live migration to target cluster"
          command: "Create cross-cluster VirtualMachineInstanceMigration"
          validation: "Migration initiated"
        - step_id: "TEST-02"
          action: "Wait for migration to complete"
          command: "Watch migration state until Succeeded"
          validation: "Migration completed successfully"
        - step_id: "TEST-03"
          action: "Verify VM is running on target cluster"
          command: "oc get vmi on target cluster"
          validation: "VMI phase is Running on target"
        - step_id: "TEST-04"
          action: "Verify workload is intact"
          command: "Check workload output/state on target"
          validation: "Workload continues without interruption"
        - step_id: "TEST-05"
