    cpu_features: "VT-x (Intel) or AMD-V (AMD) enabled"
    storage: "RWX-capable StorageClass (ODF/Ceph RBD)"
    network: "OVN-Kubernetes with Multus, bridge CNI for crosscluster NAD"

  network_configuration:
    migration_network:
      name: "migration0"
      type: "In-cluster migration network"
      description: "Standard KubeVirt migration network interface"

    crosscluster_network:
      name: "crosscluster0"
      type: "Cross-cluster migration network"
      description: "Bridge CNI NAD with whereabouts IPAM (e.g., 172.22.42.0/24)"
      nad_definition: |
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: crosscluster-migration
        spec:
          config: |
            {
              "cniVersion": "0.3.1",
              "type": "bridge",
              "bridge": "crosscluster-br",
