    test_objective:
      title: "Proxy Cleanup on Migration Failure"
      what: |
        Validates that when a cross-cluster migration fails, the proxy correctly cleans
        up all TCP listeners and connections on both the source and target sync controllers.
        Also verifies that the proxy error metrics counter is incremented to reflect the failure.
      why: |
        Resource cleanup on failure prevents port and goroutine leaks that would accumulate
        across multiple failed migrations. Without cleanup, the sync controller would
        eventually run out of resources and stop functioning.
      acceptance_criteria:
        - "Proxy ports cleaned up on source sync controller after failure"
        - "Proxy ports cleaned up on target sync controller after failure"
        - "kubevirt_decentralized_migration_proxy_errors_total incremented"

