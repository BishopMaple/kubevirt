          type: "[]net.Conn"
          initialized_in: "It"
          used_in: ["It", "AfterEach"]
          comment: "Accumulated TCP connections for cleanup"

    test_structure:
      type: "single"
      describe:
        wrapper: "SIG"
        description: "Cross-Cluster Migration Proxy"
        decorators:
          - "decorators.SigNetwork"
      context:
        description: "Connection concurrency limit"
        decorators: []
      it:
        description: "should enforce 64-connection limit per proxy mapping"
        test_id_format: "[test_id:TS-CNV-76508-004]"

    code_structure: |
      Context("Connection concurrency limit", func() {
        It("[test_id:TS-CNV-76508-004]should enforce 64-connection limit per proxy mapping", func() {
          // Open 64 concurrent connections - all should succeed
          for i := 0; i < 64; i++ {
            conn, err := net.Dial("tcp", proxyAddr)
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            connections = append(connections, conn)
          }
          // 65th connection should be rejected
          conn, err := net.DialTimeout("tcp", proxyAddr, time.Second)
          if err == nil {
            conn.Close()
          }
          Expect(err).To(HaveOccurred())
        })
      })

    test_objective:
      title: "Connection Concurrency Limit"
      what: |
        Validates that the proxy enforces the maxConnectionsPerProxy limit of 64
        connections per mapping. The connection semaphore should allow up to 64
        concurrent connections and reject the 65th connection immediately.
      why: |
        The concurrency limit prevents resource exhaustion on the sync controller.
        Without it, a burst of migration traffic or a misbehaving component could
        exhaust file descriptors and memory, destabilizing the entire sync controller.
      acceptance_criteria:
        - "First 64 connections succeed"
        - "65th connection is rejected (closed immediately)"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go unit test with concurrent connection management"

    specific_preconditions:
