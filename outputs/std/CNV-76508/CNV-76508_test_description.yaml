    test_objective:
      title: "Verify synchronizationPlacement API field controls node scheduling of sync controller pods"
      what: |
        This test validates the synchronizationPlacement field in KubeVirtSpec, which
        controls where synchronization controller pods are scheduled. By setting node
        selectors, tolerations, or affinity rules in this field, administrators can
        ensure sync controllers run on specific nodes (e.g., nodes with cross-cluster
        network connectivity).
      why: |
        In production environments, not all nodes may have cross-cluster network access.
        The synchronizationPlacement field allows administrators to schedule sync controllers
        only on nodes with the appropriate network configuration, preventing proxy failures
        due to missing network interfaces.
      acceptance_criteria:
        - "synchronizationPlacement field is accepted in KubeVirt spec"
        - "Sync controller pods respect nodeSelector from synchronizationPlacement"
        - "Changing synchronizationPlacement triggers pod rescheduling"

