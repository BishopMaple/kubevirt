    test_objective:
      title: "Verify crossClusterNetwork API field is accepted in MigrationConfiguration and propagated to sync controller deployment"
      what: |
        This test validates that the new crossClusterNetwork field in MigrationConfiguration
        is accepted by the KubeVirt API, persisted correctly, and propagated by the
        virt-operator to the synchronization controller deployment as a network annotation.
        This field is the configuration mechanism that tells the sync controller which
        network to attach to for cross-cluster communication.
      why: |
        The crossClusterNetwork field is the API surface that administrators use to
        enable the proxy feature. If this field is not accepted or not propagated,
        the entire cross-cluster migration proxy feature is unusable.
      acceptance_criteria:
        - "crossClusterNetwork field is accepted in MigrationConfiguration spec"
        - "Field value is persisted and retrievable via API"
        - "virt-operator propagates the field to sync controller deployment network annotations"

    classification:
      test_type: "Functional"
      scope: "Multi-component"
      automation_approach: "Ginkgo with kubevirt test framework"

