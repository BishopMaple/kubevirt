      Context("Bidirectional traffic forwarding", func() {
        It("[test_id:TS-CNV-76508-005]should forward data correctly in both directions through proxy", func() {
          conn, err := net.Dial("tcp", proxyAddr)
          ExpectWithOffset(1, err).ToNot(HaveOccurred())
          defer conn.Close()
          // Send data client → proxy → target
          _, err = conn.Write(testData)
          ExpectWithOffset(1, err).ToNot(HaveOccurred())
          // Read echo response target → proxy → client
          response := make([]byte, len(testData))
          _, err = conn.Read(response)
          ExpectWithOffset(1, err).ToNot(HaveOccurred())
          Expect(response).To(Equal(testData))
        })
      })

    test_objective:
      title: "Bidirectional Traffic Forwarding"
      what: |
        Validates that the proxy correctly forwards data in both directions using
        io.Copy-based bidirectional forwarding. Data sent from client to proxy is
        forwarded to the target, and the response from target flows back through
        the proxy to the client without corruption.
      why: |
        Bidirectional forwarding is the core function of the proxy. Migration traffic
        includes both libvirt state data and NBD block data that must flow correctly
        in both directions. Any data corruption would cause migration failure or
        data loss on the migrated VM.
      acceptance_criteria:
        - "Data sent from client reaches the target through proxy"
        - "Response from target reaches the client through proxy"
        - "Data is not corrupted during forwarding"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go unit test with echo server and data comparison"

    specific_preconditions:
      - name: "Proxy port with echo target"
        requirement: "Echo TCP server running, proxy port opened targeting it"
        validation: "Proxy port accepts connections"

    test_data:
      resource_definitions: []
      api_endpoints: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Start a target TCP echo server"
          command: "echoServer := startEchoServer()"
          validation: "Echo server listening"
        - step_id: "SETUP-02"
          action: "Open proxy port targeting echo server"
          command: "remappedPorts, _ := manager.OpenProxyPorts(migrationID, bindAddr, echoServer.Addr, portMap)"
          validation: "Proxy port opened"
      test_execution:
        - step_id: "TEST-01"
          action: "Connect to the proxy port"
          command: "conn, err := net.Dial('tcp', proxyAddr)"
          validation: "Connection established"
        - step_id: "TEST-02"
          action: "Send data from client through proxy to target"
          command: "conn.Write(testData)"
          validation: "Data sent without error"
        - step_id: "TEST-03"
          action: "Read response from target through proxy to client"
          command: "conn.Read(response)"
          validation: "Response received matches original data"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Close connection and proxy manager"
          command: "conn.Close(); manager.Close(migrationID)"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Data forwarded correctly in both directions"
        condition: "response == testData"
        failure_impact: "Migration data corruption - VM data loss"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

