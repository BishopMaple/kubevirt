    test_structure:
      type: "single"
      describe:
        wrapper: "class"
        description: "TestCrossClusterMigrationProxyMetrics"
      context:
        description: "Proxy active connections metric"
      it:
        description: "test_proxy_active_connections_increments_during_migration_and_decrements_after"

    code_structure: |
      class TestCrossClusterMigrationProxyMetrics:
          """Tests for cross-cluster migration proxy Prometheus metrics.

          STP Reference: outputs/stp/CNV-76508/CNV-76508_test_plan.md
          Jira: https://redhat.atlassian.net/browse/CNV-76508

          Markers:
              - tier2
          Preconditions:
              - CrossClusterMigrationProxy feature gate enabled
              - crossClusterNetwork configured
              - Prometheus accessible
          """

    test_objective:
      title: "Verify proxy metrics kubevirt_decentralized_migration_proxy_active_connections increments during migration and decrements after"
      what: |
        This test validates that the kubevirt_decentralized_migration_proxy_active_connections
        Prometheus metric correctly tracks the number of active proxy connections. During
        migration, the counter should increment (one connection per protocol port), and
        after migration completes, it should decrement back to zero.
      why: |
        Metrics are the primary observability mechanism for the proxy feature. Without
        correct active connection tracking, operators cannot monitor proxy utilization
        or detect connection leaks. This is critical for production monitoring and alerting.
      acceptance_criteria:
        - "active_connections metric increments when migration starts"
        - "active_connections metric decrements when migration completes"
        - "Metric value returns to 0 after all migrations complete"

    classification:
      test_type: "End-to-End"
      scope: "Multi-component"
      automation_approach: "pytest with openshift-python-wrapper"

    specific_preconditions:
      - name: "Prometheus access"
        requirement: "Prometheus API accessible from test pod"
        validation: "curl -s prometheus-k8s.openshift-monitoring:9090/api/v1/query"

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create VM with proxy-enabled configuration"
          validation: "VM is Running"
          code_template: |
            with VirtualMachineForTests(
                name="proxy-metrics-vm",
                namespace=namespace,
                body=fedora_vm_body(name="proxy-metrics-vm"),
            ) as vm:
                running_vm(vm=vm)

      test_execution:
        - step_id: "TEST-01"
          action: "Query active_connections metric before migration"
          validation: "Metric exists and is 0"
          code_template: |
            # Query Prometheus for baseline
            baseline = query_prometheus(
                metric="kubevirt_decentralized_migration_proxy_active_connections",
            )

        - step_id: "TEST-02"
          action: "Trigger migration and query metric during migration"
          validation: "active_connections > 0 during migration"
          code_template: |
            migrate_vm_and_verify(vm=vm)

        - step_id: "TEST-03"
          action: "Query active_connections metric after migration"
          validation: "Metric decrements to 0"
          code_template: |
            # Verify metric returns to 0
            post_migration = query_prometheus(
                metric="kubevirt_decentralized_migration_proxy_active_connections",
            )
            assert post_migration == 0

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "active_connections metric increments during migration"
        condition: "Metric value > 0 during active migration"
        failure_impact: "Cannot monitor proxy utilization"

      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "active_connections metric returns to 0 after migration"
        condition: "Metric value == 0 after migration completes"
        failure_impact: "False positive alerts for connection leaks"

    dependencies:
      kubernetes_resources:
        - "VirtualMachine: proxy-metrics-vm"
      external_tools:
        - "Prometheus API"

