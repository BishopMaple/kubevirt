        })
      }

    test_objective:
      title: "Verify source proxy creates listeners on migration0 IP with OS-allocated ports and forwards to target proxy on crosscluster0"
      what: |
        This test validates the source-side proxy architecture: the source sync controller
        creates TCP listeners on the migration0 IP address using OS-allocated ports. These
        listeners accept connections from the source virt-handler and forward traffic to
        the target sync proxy on the crosscluster0 network.
      why: |
        Source proxy listener creation is critical to the proxy chain. The OS-allocated ports
        must be correctly propagated to the VMI migration status so the source virt-handler
        connects to the proxy instead of directly to the target.
      acceptance_criteria:
        - "Source proxy listeners are created on migration0 IP"
        - "Proxy ports are OS-allocated (non-zero, non-standard)"
        - "Listeners forward to target proxy on crosscluster0"

    classification:
