        })
      }

    test_objective:
      title: "Verify disk source file paths are correctly updated with target domain namespace and name during migration"
      what: |
        This test validates the updateFilePathsToNewDomain function in virt-launcher,
        which updates disk source file paths during cross-cluster migration. The function
        must correctly replace the source domain's namespace and name with the target
        domain's namespace and name in all disk file paths.
      why: |
        During cross-cluster migration, the VMI may move to a different namespace on the
        target cluster. If disk paths are not updated, the target virt-launcher will fail
        to find the disk images, causing the migrated VM to fail to boot or lose data.
      acceptance_criteria:
        - "Disk source file paths contain target domain namespace after migration"
        - "Disk source file paths contain target domain name after migration"
        - "VM boots successfully with updated disk paths"

