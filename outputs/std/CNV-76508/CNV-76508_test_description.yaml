  - scenario_id: "001"
    test_id: "TS-CNV-76508-001"
    tier: "Tier 1"
    priority: "P0"
    mvp: true
    requirement_id: "CNV-76508"

    patterns:
      primary: "feature-gate-validation"
      secondary:
        - "deployment-inspection"
        - "network-interface-check"
      helpers_required:
        - name: "libvmi"
          functions: ["NewKubeVirt"]
