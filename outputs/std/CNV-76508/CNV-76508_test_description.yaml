          initialized_in: "It"
          used_in: ["It"]
          comment: "Synchronization controller pod"

    test_structure:
      type: "single"
      describe:
        wrapper: "SIG"
        description: "Cross-Cluster Live Migration Proxy"
        decorators:
          - "decorators.SigCompute"
          - "Serial"
      context:
        description: "Sync controller attaches to crosscluster0 network"
        decorators:
          - "Ordered"
          - "decorators.OncePerOrderedCleanup"
      it:
        description: "should attach sync controller to crosscluster0 network when feature gate and crossClusterNetwork are configured"
        test_id_format: "[test_id:TS-CNV-76508-001]"

    code_structure: |
      Context("Sync controller attaches to crosscluster0 network", Ordered, decorators.OncePerOrderedCleanup) {
        BeforeAll(func() {
          // Enable CrossClusterMigrationProxy feature gate
          // Configure crossClusterNetwork in MigrationConfiguration
        })
        It("[test_id:TS-CNV-76508-001]should attach sync controller to crosscluster0 network when feature gate and crossClusterNetwork are configured", func() {
          // Verify sync controller pod has crosscluster0 interface
        })
      }

    test_objective:
      title: "Verify sync controller attaches to crosscluster0 network when CrossClusterMigrationProxy feature gate and crossClusterNetwork are configured"
      what: |
        This test validates that when the CrossClusterMigrationProxy feature gate is enabled
        and the crossClusterNetwork field is configured in MigrationConfiguration, the
        synchronization controller pod attaches to the crosscluster0 network interface.
        This confirms the sync controller is correctly deployed with dual-network attachment.
      why: |
        The crosscluster0 network attachment is fundamental to the proxy architecture.
        Without it, the sync controller cannot bridge traffic between the in-cluster
        migration network and the cross-cluster network. This is the foundational
        prerequisite for all proxy functionality.
      acceptance_criteria:
        - "Sync controller pod has crosscluster0 network interface"
        - "Sync controller pod shows network-attachment annotation for crosscluster NAD"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Ginkgo with KubeVirt test framework"

    specific_preconditions:
      - name: "CrossClusterMigrationProxy feature gate"
        requirement: "Feature gate must be enabled in KubeVirt configuration"
        validation: "oc get kubevirt -n openshift-cnv -o jsonpath='{.items[0].spec.configuration.developerConfiguration.featureGates}' | grep CrossClusterMigrationProxy"
      - name: "crossClusterNetwork NAD"
        requirement: "NetworkAttachmentDefinition for crosscluster0 must exist"
        validation: "oc get net-attach-def crosscluster-nad"

    test_data:
      resource_definitions:
        - name: "crosscluster-nad"
          type: "NetworkAttachmentDefinition"
          yaml: |
            apiVersion: k8s.cni.cncf.io/v1
            kind: NetworkAttachmentDefinition
            metadata:
              name: crosscluster-nad
            spec:
              config: |
                {
                  "cniVersion": "0.3.1",
                  "name": "crosscluster",
                  "type": "bridge",
                  "bridge": "crosscluster-br",
                  "ipam": {
                    "type": "whereabouts",
                    "range": "172.22.42.0/24"
                  }
                }

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create crosscluster NetworkAttachmentDefinition"
          command: "oc apply -f crosscluster-nad.yaml"
          validation: "NAD created successfully"
          pattern_id: "nad-create"
          code_template: |
            By("Creating crosscluster NetworkAttachmentDefinition")
            crossclusterNAD = &networkv1.NetworkAttachmentDefinition{
              ObjectMeta: metav1.ObjectMeta{
                Name:      "crosscluster-nad",
                Namespace: namespace,
              },
            }
            crossclusterNAD, err = kubevirt.Client().NetworkClient().NetworkAttachmentDefinitions(namespace).Create(ctx, crossclusterNAD, metav1.CreateOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

        - step_id: "SETUP-02"
          action: "Enable CrossClusterMigrationProxy feature gate and set crossClusterNetwork"
          command: "Patch KubeVirt CR"
          validation: "Feature gate enabled, crossClusterNetwork configured"
          pattern_id: "feature-gate-enable"
          code_template: |
            By("Enabling CrossClusterMigrationProxy feature gate and configuring crossClusterNetwork")
            // Patch KubeVirt CR to enable feature gate and set crossClusterNetwork
            // Wait for sync controller rollout

      test_execution:
        - step_id: "TEST-01"
          action: "Get synchronization controller pod"
          command: "oc get pods -n openshift-cnv -l kubevirt.io=virt-synchronization-controller"
          validation: "Pod found and running"
          pattern_id: "pod-inspection"
          code_template: |
            By("Getting synchronization controller pod")
            syncControllerPod, err = kubevirt.Client().CoreV1().Pods("openshift-cnv").List(ctx, metav1.ListOptions{
              LabelSelector: "kubevirt.io=virt-synchronization-controller",
            })
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            ExpectWithOffset(1, syncControllerPod.Items).ToNot(BeEmpty())

        - step_id: "TEST-02"
          action: "Verify crosscluster0 network interface on sync controller pod"
          command: "Check pod network-status annotation for crosscluster0"
          validation: "crosscluster0 interface present in pod network status"
          pattern_id: "network-interface-verify"
          code_template: |
            By("Verifying crosscluster0 network interface on sync controller pod")
            annotations = syncControllerPod.Items[0].Annotations
            networkStatus, exists = annotations["k8s.v1.cni.cncf.io/network-status"]
            ExpectWithOffset(1, exists).To(BeTrue(), "network-status annotation should exist")
            ExpectWithOffset(1, networkStatus).To(ContainSubstring("crosscluster"))

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Restore KubeVirt configuration"
          command: "Remove feature gate and crossClusterNetwork"
          code_template: |
            By("Restoring KubeVirt configuration")
            // Remove CrossClusterMigrationProxy feature gate
            // Remove crossClusterNetwork configuration

        - step_id: "CLEANUP-02"
          action: "Delete crosscluster NAD"
          command: "oc delete net-attach-def crosscluster-nad"
          code_template: |
            By("Deleting crosscluster NAD")
            err = kubevirt.Client().NetworkClient().NetworkAttachmentDefinitions(namespace).Delete(ctx, crossclusterNAD.Name, metav1.DeleteOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Sync controller pod is running"
        condition: "Pod in Running phase with Ready condition"
        failure_impact: "Proxy feature completely non-functional"

      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "crosscluster0 interface is attached to sync controller"
        condition: "network-status annotation contains crosscluster network entry"
        failure_impact: "Proxy cannot bridge migration traffic to cross-cluster network"

    dependencies:
      kubernetes_resources:
        - "NetworkAttachmentDefinition: crosscluster-nad"
        - "KubeVirt CR: kubevirt"
      external_tools:
        - "oc 4.22+"
        - "kubectl 1.29+"

