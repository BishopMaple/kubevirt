          validation: "Ports opened successfully"
      test_execution:
        - step_id: "TEST-01"
          action: "Call Close() with the migration ID"
          command: "manager.Close(migrationID)"
          validation: "Close completes without error"
        - step_id: "TEST-02"
          action: "Verify HasMappings returns false"
          command: "Expect(manager.HasMappings(migrationID)).To(BeFalse())"
          validation: "No mappings remain"
        - step_id: "TEST-03"
          action: "Attempt to connect to previously opened ports"
          command: "net.DialTimeout('tcp', addr, time.Second)"
          validation: "Connection is refused for all ports"
      cleanup: []

