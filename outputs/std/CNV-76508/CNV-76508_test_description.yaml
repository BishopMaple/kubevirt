    code_structure: |
      class TestCrossClusterMigrationProxy:
          """Tests for cross-cluster live migration through TCP proxy.

          STP Reference: outputs/stp/CNV-76508/CNV-76508_test_plan.md
          Jira: CNV-76299

          Markers:
              - tier2
              - p0

          Preconditions:
              - Two clusters with crossClusterNetwork configured
              - DecentralizedLiveMigration feature gate enabled
              - Running VM on source cluster
          """

          def test_e2e_migration_through_proxy(self):
              """Verify end-to-end cross-cluster migration through proxy.

              Steps:
                  1. Create a VM with a running workload on source cluster
                  2. Initiate cross-cluster live migration to target cluster
                  3. Verify migration completes successfully
                  4. Verify VM is running on target cluster with workload intact
                  5. Verify proxy ports are cleaned up on both clusters

              Expected:
                  - VM migrates successfully through proxy
                  - Workload continues without interruption
                  - All proxy resources cleaned up after migration
              """
              pass

    test_objective:
      title: "End-to-End Cross-Cluster Migration Through Proxy"
      what: |
        Validates the complete end-to-end flow of a cross-cluster live migration
        through the TCP proxy layer. A VM with an active workload is migrated from
        a source cluster to a target cluster, with all migration traffic flowing
        through the sync controller proxy. After migration, the VM should be running
        on the target cluster with the workload intact, and all proxy resources should
        be cleaned up on both clusters.
      why: |
        This is the primary customer use case: migrating VMs across clusters without
        requiring every virt-handler pod to have direct access to the cross-cluster
        network. This test validates the entire feature works as designed, from
        configuration through execution to cleanup.
      acceptance_criteria:
        - "VM migrates successfully from source to target cluster"
        - "Workload continues without interruption during and after migration"
        - "All proxy ports cleaned up on both clusters after migration"
        - "Migration uses proxy path (not direct virt-handler connection)"

    classification:
      test_type: "E2E"
      scope: "Multi-component"
      automation_approach: "pytest with openshift-python-wrapper"

    specific_preconditions:
