      title: "Feature Gate Enablement"
      what: |
        Validates that the DecentralizedLiveMigration feature gate correctly controls
        the proxy functionality. The feature gate is registered at Alpha stage and
        should not be enabled by default. When enabled, proxy-related configuration
        fields become available. When disabled, proxy configuration should be rejected.
      why: |
        Feature gating is the primary safety mechanism for new features. It ensures
        the proxy functionality cannot be accidentally activated in production clusters
        until it has been explicitly opted into by the administrator.
      acceptance_criteria:
        - "DecentralizedLiveMigration is NOT enabled by default"
        - "Feature gate can be enabled via KubeVirt CR developer configuration"
