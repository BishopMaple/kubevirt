        wrapper: "SIG"
        description: "Cross-Cluster Live Migration Proxy"
        decorators:
          - "decorators.SigCompute"
          - "Serial"
      context:
        description: "VM live migration through proxy"
        decorators:
          - "Ordered"
          - "decorators.OncePerOrderedCleanup"
      it:
        description: "should complete VM live migration successfully through proxy with both libvirt and NBD channels"
        test_id_format: "[test_id:TS-CNV-76508-002]"

    code_structure: |
      Context("VM live migration through proxy", Ordered, decorators.OncePerOrderedCleanup) {
        BeforeAll(func() {
          // Enable feature gate, configure crossClusterNetwork
          // Create Fedora VMI with migration network
          // Wait for VMI to be ready
        })
        It("[test_id:TS-CNV-76508-002]should complete VM live migration successfully through proxy with both libvirt and NBD channels", func() {
          // Trigger migration
          // Verify migration completes through proxy
          // Verify both libvirt and NBD channels were proxied
        })
      }

    test_objective:
      title: "Verify VM live migration completes successfully through proxy with both libvirt and NBD channels proxied"
      what: |
        This test validates the core proxy functionality: a VM live migration is initiated
        and completes successfully with traffic flowing through the sync proxy path
        (source virt-handler → source sync proxy → target sync proxy → target virt-handler).
        Both the libvirt control channel and NBD data channels (ports 49152, 49153) must
        be successfully proxied.
      why: |
        This is the primary acceptance criterion for the proxy feature. If migration cannot
        complete through the proxy, the entire feature is non-functional. Validating both
        libvirt and NBD channels ensures complete migration data transfer.
      acceptance_criteria:
        - "Migration completes with Succeeded status"
        - "VMI is Running on target node after migration"
        - "Migration used proxy path (proxy ports in migration status)"

    classification:
      test_type: "Functional"
      scope: "Multi-component"
      automation_approach: "Ginkgo with KubeVirt test framework"

    specific_preconditions:
      - name: "CrossClusterMigrationProxy enabled"
        requirement: "Feature gate enabled with crossClusterNetwork configured"
        validation: "KubeVirt CR has feature gate and crossClusterNetwork set"
      - name: "Dual migration networks"
        requirement: "Both migration0 and crosscluster0 NADs exist"
        validation: "oc get net-attach-def migration-nad crosscluster-nad"

    test_data:
      resource_definitions:
        - name: "fedora-vmi"
          type: "VirtualMachineInstance"
          yaml: |
            apiVersion: kubevirt.io/v1
            kind: VirtualMachineInstance
            metadata:
              name: fedora-proxy-migration
            spec:
              domain:
                resources:
                  requests:
                    memory: "1Gi"
              volumes:
                - name: containerdisk
                  containerDisk:
                    image: quay.io/kubevirt/fedora-cloud-container-disk-demo

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Configure proxy feature (feature gate + crossClusterNetwork + NADs)"
          command: "Patch KubeVirt CR; create NADs"
          validation: "Feature gate enabled, NADs created, sync controller rolled out"
          pattern_id: "feature-gate-enable"
          code_template: |
            By("Configuring cross-cluster migration proxy feature")
            // Enable CrossClusterMigrationProxy feature gate
            // Set crossClusterNetwork in MigrationConfiguration
            // Create migration0 and crosscluster0 NADs

        - step_id: "SETUP-02"
          action: "Create Fedora VMI with migration network"
          command: "Create VMI with migration network interface"
          validation: "VMI created and running"
          pattern_id: "vmi-create"
          code_template: |
            By("Creating Fedora VMI")
            vmi = libvmifact.NewFedora(
              libvmi.WithInterface(libvmi.InterfaceDeviceWithMasqueradeBinding()),
              libvmi.WithNetwork(v1.DefaultPodNetwork()),
            )
            vmi, err = kubevirt.Client().VirtualMachineInstance(namespace).Create(ctx, vmi, metav1.CreateOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            vmi = libwait.WaitUntilVMIReady(vmi, console.LoginToFedora)

      test_execution:
        - step_id: "TEST-01"
          action: "Trigger live migration"
          command: "Create VirtualMachineInstanceMigration"
          validation: "Migration object created"
          pattern_id: "migration-trigger"
          code_template: |
            By("Triggering live migration through proxy")
            migration = libmigration.New(vmi.Name, vmi.Namespace)
            migration = libmigration.RunMigrationAndExpectToCompleteWithDefaultTimeout(kubevirt.Client(), migration)

        - step_id: "TEST-02"
          action: "Verify migration completed with proxy ports"
          command: "Check VMI migration state for proxy port values"
          validation: "Migration status shows proxy ports instead of direct virt-handler ports"
          pattern_id: "migration-verify"
          code_template: |
            By("Verifying migration completed through proxy")
            ExpectWithOffset(1, migration.Status.Phase).To(Equal(v1.MigrationSucceeded))
            // Verify VMI migrated to different node
            updatedVMI, err = kubevirt.Client().VirtualMachineInstance(namespace).Get(ctx, vmi.Name, metav1.GetOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            ExpectWithOffset(1, updatedVMI.Status.NodeName).ToNot(Equal(vmi.Status.NodeName))

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VMI"
          command: "oc delete vmi fedora-proxy-migration"
          code_template: |
            By("Deleting VMI")
            err = kubevirt.Client().VirtualMachineInstance(namespace).Delete(ctx, vmi.Name, metav1.DeleteOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Migration completes with Succeeded phase"
        condition: "migration.Status.Phase == MigrationSucceeded"
        failure_impact: "Core proxy functionality broken — migration cannot complete through proxy"

      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "VMI is running on target node"
        condition: "VMI status shows Running on different node than source"
        failure_impact: "Migration did not actually move the VM"

    dependencies:
      kubernetes_resources:
        - "VirtualMachineInstance: fedora-proxy-migration"
        - "VirtualMachineInstanceMigration: migration object"
        - "NetworkAttachmentDefinition: migration-nad, crosscluster-nad"
      external_tools:
        - "oc 4.22+"

