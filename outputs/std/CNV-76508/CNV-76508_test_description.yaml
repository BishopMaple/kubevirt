          action: "Open 64 concurrent connections to the proxy port"
          command: "for i := 0; i < 64; i++ { conn, _ := net.Dial('tcp', proxyAddr) }"
          validation: "All 64 connections succeed"
        - step_id: "TEST-02"
          action: "Attempt to open a 65th connection"
          command: "conn, err := net.DialTimeout('tcp', proxyAddr, time.Second)"
          validation: "Connection is rejected"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Close all connections and proxy manager"
          command: "for _, conn := range connections { conn.Close() }; manager.Close(migrationID)"

