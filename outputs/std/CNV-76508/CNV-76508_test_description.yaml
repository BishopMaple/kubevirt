        BeforeAll(func() {
          // Create Fedora VMI
          // Wait for VMI ready
        })
        It("[test_id:TS-CNV-76508-002]should complete VM live migration successfully through proxy with libvirt and NBD channels", func() {
          // Trigger migration
          // Verify migration completes
          // Verify both libvirt and NBD channels were proxied
        })
      }

    test_objective:
      title: "Verify VM live migration completes successfully through proxy with both libvirt and NBD channels proxied"
      what: |
        This test validates the end-to-end migration flow through the proxy:
        source virt-handler sends migration traffic to the source sync proxy on migration0,
        which forwards it to the target sync proxy on crosscluster0, which delivers it to
        the target virt-handler. Both libvirt (port 49152) and NBD (port 49153) channels
        must be successfully proxied for a complete migration.
      why: |
        This is the core functional validation of the proxy feature. A successful migration
        through the proxy proves that the bidirectional TCP copy, port mapping, and
        dual-network bridging all work correctly together. Without this test, there is no
        confidence that the proxy enables actual VM migration.
      acceptance_criteria:
        - "VMI migration completes with status Succeeded"
        - "Migration used proxy path (not direct virt-handler connectivity)"
        - "Both libvirt and NBD protocol channels were proxied (ports 49152, 49153)"

    classification:
      test_type: "Functional"
      scope: "Multi-component"
      automation_approach: "Ginkgo with kubevirt migration framework"

    specific_preconditions:
      - name: "Proxy-enabled environment"
        requirement: "CrossClusterMigrationProxy feature gate enabled with crossClusterNetwork configured"
        validation: "Sync controller pods have crosscluster0 interface"
      - name: "RWX storage"
        requirement: "RWX-capable StorageClass for VMI disk"
        validation: "oc get sc | grep ceph-rbd"

    test_data:
      resource_definitions:
        - name: "fedora-vmi"
          type: "VirtualMachineInstance"
          yaml: |
            apiVersion: kubevirt.io/v1
            kind: VirtualMachineInstance
            metadata:
              name: fedora-proxy-migration
            spec:
              domain:
                resources:
                  requests:
                    memory: 1Gi
              volumes:
                - name: containerdisk
                  containerDisk:
                    image: quay.io/kubevirt/fedora-cloud-container-disk-demo

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create Fedora VMI with migration-compatible configuration"
          validation: "VMI is created and Running"
          pattern_id: "vm-creation"
          code_template: |
            By("Creating Fedora VMI")
            vmi = libvmifact.NewFedora(
              libvmi.WithInterface(libvmi.InterfaceDeviceWithMasqueradeBinding()),
              libvmi.WithNetwork(v1.DefaultPodNetwork()),
            )
            vmi, err = kubevirt.Client().VirtualMachineInstance(namespace).Create(ctx, vmi, metav1.CreateOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

        - step_id: "SETUP-02"
          action: "Wait for VMI to be ready and login"
          validation: "VMI is in Running phase and console login succeeds"
          pattern_id: "vm-wait"
          code_template: |
            By("Waiting for VMI to be ready")
            vmi = libwait.WaitUntilVMIReady(vmi, console.LoginToFedora)

      test_execution:
        - step_id: "TEST-01"
          action: "Trigger live migration of VMI"
          validation: "Migration object is created"
          pattern_id: "migration-execution"
          code_template: |
            By("Triggering live migration")
            migration = libmigration.New(vmi.Name, vmi.Namespace)
            migration = libmigration.RunMigrationAndExpectToCompleteWithDefaultTimeout(kubevirt.Client(), migration)

        - step_id: "TEST-02"
          action: "Verify migration completed through proxy"
          validation: "Migration status shows proxy port mapping was used"
          pattern_id: "migration-completion-validation"
          code_template: |
            By("Verifying migration completed through proxy")
            ExpectWithOffset(1, migration.Status.Phase).To(Equal(v1.MigrationSucceeded))
            // Verify proxy was used by checking VMI migration state
            updatedVMI, err = kubevirt.Client().VirtualMachineInstance(namespace).Get(ctx, vmi.Name, metav1.GetOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VMI"
          code_template: |
            By("Deleting VMI")
            err = kubevirt.Client().VirtualMachineInstance(namespace).Delete(ctx, vmi.Name, metav1.DeleteOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Migration completes with Succeeded status"
        condition: "migration.Status.Phase == MigrationSucceeded"
        failure_impact: "Core proxy migration functionality is broken"

      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Migration used proxy path"
        condition: "VMI migration state indicates proxy port mapping was used"
        failure_impact: "Migration may have bypassed the proxy"

    dependencies:
      kubernetes_resources:
        - "VirtualMachineInstance: fedora-proxy-migration"
        - "VirtualMachineInstanceMigration: migration object"
      external_tools:
        - "virtctl 4.22+"

