          - "Ordered"
          - "decorators.OncePerOrderedCleanup"
      it:
        description: "should NOT create proxy when CrossClusterMigrationProxy feature gate is disabled even with crossClusterNetwork set"
        test_id_format: "[test_id:TS-CNV-76508-013]"

    code_structure: |
      Context("Feature gate guarding proxy behavior", Ordered, decorators.OncePerOrderedCleanup) {
        It("[test_id:TS-CNV-76508-013]should NOT create proxy when CrossClusterMigrationProxy feature gate is disabled even with crossClusterNetwork set", func() {
          // Disable CrossClusterMigrationProxy feature gate
          // Set crossClusterNetwork
          // Verify sync controller does NOT have crosscluster0 interface
        })
      }

    test_objective:
      title: "Verify that disabling CrossClusterMigrationProxy feature gate while crossClusterNetwork is set does NOT create proxy"
      what: |
        This test validates that the CrossClusterMigrationProxy feature gate is the
        authoritative guard for proxy behavior. Even if crossClusterNetwork is configured,
        the proxy should not be created if the feature gate is disabled. The sync
        controller should not attach to the crosscluster0 network.
      why: |
        Feature gates are the standard mechanism for enabling/disabling Alpha features.
        If the proxy activates based solely on the crossClusterNetwork field without
        checking the feature gate, it could unexpectedly impact clusters that set the
        field but expect it to be a no-op until the feature is explicitly enabled.
      acceptance_criteria:
        - "Sync controller does NOT have crosscluster0 interface when feature gate is disabled"
        - "No proxy listeners are created during migration"
        - "Migration falls back to direct virt-handler connectivity"

    classification:
      test_type: "Functional"
      scope: "Multi-component"
      automation_approach: "Ginkgo with kubevirt test framework"

    specific_preconditions: []
    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Disable CrossClusterMigrationProxy feature gate but set crossClusterNetwork"
          validation: "Feature gate is disabled, crossClusterNetwork is set"
          pattern_id: "kubevirt-config-update"
          code_template: |
            By("Disabling CrossClusterMigrationProxy but setting crossClusterNetwork")
            kubevirt.UpdateKubeVirtConfigValue(func(kv *v1.KubeVirt) {
              // Remove CrossClusterMigrationProxy from feature gates
              if kv.Spec.Configuration.DeveloperConfiguration != nil {
                gates := []string{}
                for _, gate := range kv.Spec.Configuration.DeveloperConfiguration.FeatureGates {
                  if gate != "CrossClusterMigrationProxy" {
                    gates = append(gates, gate)
                  }
                }
                kv.Spec.Configuration.DeveloperConfiguration.FeatureGates = gates
              }
              // Set crossClusterNetwork anyway
              if kv.Spec.Configuration.MigrationConfiguration == nil {
                kv.Spec.Configuration.MigrationConfiguration = &v1.MigrationConfiguration{}
              }
              crossClusterNet = "openshift-cnv/crosscluster-migration"
              kv.Spec.Configuration.MigrationConfiguration.CrossClusterNetwork = &crossClusterNet
            })

      test_execution:
        - step_id: "TEST-01"
          action: "Verify sync controller does NOT have crosscluster0 interface"
          validation: "No crosscluster0 network attachment on sync controller pod"
          pattern_id: "negative-validation"
          code_template: |
            By("Verifying sync controller does NOT have crosscluster0")
            Eventually(func() bool {
              syncPods, err = kubevirt.Client().CoreV1().Pods("openshift-cnv").List(ctx, metav1.ListOptions{
                LabelSelector: "kubevirt.io=virt-synchronization-controller",
              })
              if err != nil || len(syncPods.Items) == 0 {
                return true // No sync pods means no proxy
              }
              for _, pod := range syncPods.Items {
                annotations := pod.Annotations
                if networks, ok := annotations["k8s.v1.cni.cncf.io/networks"]; ok {
                  if strings.Contains(networks, "crosscluster") {
                    return false
                  }
                }
              }
              return true
            }, 60*time.Second, 5*time.Second).Should(BeTrue(), "Sync controller should NOT have crosscluster0 when feature gate is disabled")

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove crossClusterNetwork"
          code_template: |
            By("Removing crossClusterNetwork")
            kubevirt.UpdateKubeVirtConfigValue(func(kv *v1.KubeVirt) {
              if kv.Spec.Configuration.MigrationConfiguration != nil {
                kv.Spec.Configuration.MigrationConfiguration.CrossClusterNetwork = nil
              }
            })

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Sync controller does not attach to crosscluster0 when feature gate is disabled"
        condition: "No crosscluster network annotation on sync controller pods"
        failure_impact: "Proxy activates unexpectedly when feature gate is off"

    dependencies:
      kubernetes_resources:
        - "KubeVirt: kubevirt"
        - "Pod: virt-synchronization-controller"

