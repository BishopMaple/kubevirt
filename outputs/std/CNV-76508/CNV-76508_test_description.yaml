        - name: "remappedPorts"
          type: "map[int]int"
          initialized_in: "BeforeEach"
          used_in: ["It"]
          comment: "Ports opened in setup for cleanup testing"

    test_structure:
      type: "single"
      describe:
        wrapper: "SIG"
        description: "Cross-Cluster Migration Proxy"
        decorators:
          - "decorators.SigNetwork"
      context:
        description: "Proxy port cleanup on close"
        decorators: []
      it:
        description: "should close all listeners and remove mappings on Close()"
        test_id_format: "[test_id:TS-CNV-76508-002]"

    code_structure: |
      Context("Proxy port cleanup on close", func() {
        BeforeEach(func() {
          manager = NewProxyMappingManager()
          remappedPorts, _ = manager.OpenProxyPorts(migrationID, bindAddr, targetAddr, portMap)
        })
        It("[test_id:TS-CNV-76508-002]should close all listeners and remove mappings on Close()", func() {
          manager.Close(migrationID)
          Expect(manager.HasMappings(migrationID)).To(BeFalse())
          for _, port := range remappedPorts {
            _, err = net.DialTimeout("tcp", fmt.Sprintf("127.0.0.1:%d", port), time.Second)
            Expect(err).To(HaveOccurred())
          }
        })
      })

    test_objective:
      title: "Proxy Port Cleanup on Close"
      what: |
        Validates that calling Close() on the ProxyMappingManager properly tears down
        all TCP listeners for a given migration ID, removes the mappings from internal
        state, and ensures connections to previously opened ports are refused.
      why: |
        Proper cleanup prevents resource leaks (file descriptors, goroutines) and ensures
        proxy ports are released for reuse by subsequent migrations. Without cleanup,
        the sync controller would eventually exhaust available ports.
      acceptance_criteria:
        - "HasMappings returns false after Close()"
        - "All previously opened ports refuse connections"
        - "No resource leaks (listeners closed)"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go unit test with connection refused verification"

    specific_preconditions:
