      validation: "oc get pods -n openshift-multus | grep multus"

    - name: "Multi-node cluster"
      requirement: "Minimum 2 worker nodes for migration testing"
      validation: "oc get nodes --selector=node-role.kubernetes.io/worker | wc -l"

    - name: "DecentralizedLiveMigration feature gate"
      requirement: "DecentralizedLiveMigration feature gate must be enabled (prerequisite)"
      validation: "oc get kubevirt -n openshift-cnv -o jsonpath='{.items[0].spec.configuration.developerConfiguration.featureGates}'"

  operators:
