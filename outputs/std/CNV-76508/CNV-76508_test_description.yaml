        requirement: "2 clusters with in-cluster and cross-cluster LM networks"
        validation: "Both clusters accessible and configured"
      - name: "DecentralizedLiveMigration enabled on both clusters"
        requirement: "Feature gate enabled"
        validation: "Feature gate active on both clusters"
      - name: "crossClusterNetwork configured on both clusters"
        requirement: "NAD for CCLM network"
        validation: "crossClusterNetwork set in both KubeVirt CRs"

    test_data:
      resource_definitions:
