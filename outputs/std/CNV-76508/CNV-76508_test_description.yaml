        records the total bytes transferred through the proxy in both directions
        (source→target and target→source). The metric should increase after each
        migration proportional to the data transferred.
      why: |
        Bytes transferred is a key capacity planning metric. It allows operators to
        understand proxy throughput and detect potential bottlenecks. Without accurate
        byte counting, capacity planning for the cross-cluster network is guesswork.
      acceptance_criteria:
