            _, err := manager.OpenProxyPorts(migrationID, "127.0.0.1", targetAddr, portMap)
            Expect(err).To(HaveOccurred())
            Expect(err.Error()).To(ContainSubstring("not allowed"))
            Expect(manager.HasMappings(migrationID)).To(BeFalse())
          },
          Entry("cloud metadata IPv4", "169.254.169.254:8080"),
          Entry("link-local IPv4", "169.254.1.1:443"),
          Entry("link-local IPv6", "[fe80::1]:8080"),
        )
      })

    test_objective:
      title: "SSRF Protection - Link-Local Addresses Blocked"
      what: |
        Validates that the proxy's validateTargetAddress() function correctly blocks
        connections to link-local IPv4 addresses (169.254.0.0/16), cloud metadata
        endpoints (169.254.169.254), and link-local IPv6 addresses (fe80::/10).
      why: |
        SSRF protection is critical for security. Without it, a malicious actor could
        use the proxy to access cloud metadata services or other internal network
        resources, potentially leaking credentials or sensitive configuration data.
      acceptance_criteria:
        - "OpenProxyPorts returns error for 169.254.169.254:8080"
        - "OpenProxyPorts returns error for 169.254.1.1:443"
        - "OpenProxyPorts returns error for [fe80::1]:8080"
        - "Error message contains 'not allowed'"
        - "No listeners are opened for blocked addresses"

