      what: |
        Validates that when the sync controller pod is restarted during an active proxy
        session, the graceful shutdown properly closes all proxy connections and listeners,
        and upon restart, rebuildConnectionsAndUpdateSyncAddress() reconstructs the
        connections. The migration should either recover or fail gracefully (not hang).
      why: |
        Pod restarts are a normal occurrence in Kubernetes (OOMKill, node drain, rolling
        updates). The proxy must handle restarts without leaving dangling connections or
        causing migrations to hang indefinitely.
      acceptance_criteria:
        - "Graceful shutdown closes all proxy connections"
        - "Migration either recovers or fails gracefully (not hung)"
        - "No resource leaks after restart"

    classification:
      test_type: "Functional"
      scope: "Multi-component"
      automation_approach: "Ginkgo test with pod deletion and recovery verification"

    specific_preconditions:
      - name: "Active proxy connections during migration"
        requirement: "Cross-cluster migration in progress through proxy"
        validation: "Proxy ports active on sync controller"

    test_data:
      resource_definitions: []
      api_endpoints: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Start cross-cluster migration with active proxy"
          command: "Create VM and migration with crossClusterNetwork"
          validation: "Proxy active"
      test_execution:
        - step_id: "TEST-01"
          action: "Restart the sync controller pod during active proxy session"
          command: "oc delete pod -l app=virt-synchronization-controller"
          validation: "Pod deleted and restarts"
        - step_id: "TEST-02"
          action: "Verify graceful shutdown closes all proxy connections"
          command: "Check deleted pod logs for closeConnections() messages"
          validation: "All connections closed during shutdown"
        - step_id: "TEST-03"
          action: "Verify migration either recovers or fails gracefully"
          command: "oc get vmi -o jsonpath='{.status.migrationState.phase}'"
          validation: "Migration is Succeeded or Failed (not hung in Running)"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM and migration resources"
          command: "Delete resources"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Graceful shutdown closes proxy connections"
        condition: "closeConnections() called, all listeners and connections closed"
        failure_impact: "Dangling connections and goroutine leaks"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Migration does not hang"
        condition: "Migration reaches terminal state (Succeeded or Failed) within timeout"
        failure_impact: "Migration stuck indefinitely - requires manual intervention"

    dependencies:
      kubernetes_resources:
        - "Pod: virt-synchronization-controller"
        - "VirtualMachineInstance: test-proxy-vm"
      external_tools:
        - "oc CLI"
      scenario_specific_rbac: []

