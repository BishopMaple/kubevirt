        description: "Proxy port opening and mapping"
        decorators: []
      it:
        description: "should open proxy ports and return valid remapped port map"
        test_id_format: "[test_id:TS-CNV-76508-001]"

    code_structure: |
      Context("Proxy port opening and mapping", func() {
        BeforeEach(func() {
          manager = NewProxyMappingManager()
          migrationID = "test-migration-001"
        })
        It("[test_id:TS-CNV-76508-001]should open proxy ports and return valid remapped port map", func() {
          portMap := map[int]int{49152: 49152, 49153: 49153}
          remappedPorts, err = manager.OpenProxyPorts(migrationID, "127.0.0.1", "10.0.0.1:8080", portMap)
          ExpectWithOffset(1, err).ToNot(HaveOccurred())
          Expect(remappedPorts).To(HaveLen(2))
          Expect(manager.HasMappings(migrationID)).To(BeTrue())
        })
        AfterEach(func() {
          manager.Close(migrationID)
        })
      })

    test_objective:
      title: "Proxy Port Opening and Mapping"
      what: |
        Validates that the ProxyMappingManager correctly opens TCP proxy ports when
        OpenProxyPorts() is called with a migration ID, bind address, target address,
        and port map. Verifies the returned remapped ports map has the correct number
        of entries and each port is a valid listening TCP port.
      why: |
        Port opening is the fundamental operation of the proxy layer. If proxy ports
        cannot be opened correctly, no cross-cluster migration traffic can flow through
        the sync controller, completely breaking the CCLM feature.
      acceptance_criteria:
        - "OpenProxyPorts returns a remapped port map with same number of entries as input"
        - "Each remapped port is a valid, listening TCP port"
        - "HasMappings returns true for the migration ID after port opening"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go unit test with net.Dial verification"

    specific_preconditions:
      - name: "No preconditions"
        requirement: "Unit test - no cluster required"
        validation: "N/A"

    test_data:
      resource_definitions: []
      api_endpoints: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create a ProxyMappingManager instance"
          command: "manager := NewProxyMappingManager()"
          validation: "Manager is not nil"
      test_execution:
        - step_id: "TEST-01"
          action: "Call OpenProxyPorts with migration ID, bind address, target address, and 2-port map"
          command: "remappedPorts, err := manager.OpenProxyPorts(migrationID, bindAddr, targetAddr, portMap)"
          validation: "No error returned"
        - step_id: "TEST-02"
          action: "Verify remapped ports map has 2 entries"
          command: "Expect(remappedPorts).To(HaveLen(2))"
          validation: "Exactly 2 remapped ports returned"
        - step_id: "TEST-03"
          action: "Verify each remapped port is a valid listening TCP port"
          command: "net.Dial('tcp', fmt.Sprintf('127.0.0.1:%d', port))"
          validation: "Connection succeeds for each remapped port"
        - step_id: "TEST-04"
          action: "Verify HasMappings returns true for the migration ID"
          command: "Expect(manager.HasMappings(migrationID)).To(BeTrue())"
          validation: "HasMappings returns true"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Close proxy mappings for the migration ID"
          command: "manager.Close(migrationID)"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
