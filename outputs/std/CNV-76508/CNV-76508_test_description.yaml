    test_objective:
      title: "Operator Deployment of Sync Controller with CCLM Network"
      what: |
        Validates that virt-operator correctly creates the sync controller Deployment
        with proper Multus network annotations when crossClusterNetwork is configured.
        The sync controller pod must have network interfaces on both the in-cluster LM
        network and the cross-cluster LM network.
      why: |
        The operator is responsible for translating the KubeVirt CR configuration into
        actual deployment resources. If the network annotations are wrong, the sync
        controller will not have access to the CCLM network and proxy cannot function.
      acceptance_criteria:
        - "Sync controller Deployment has correct network annotations"
        - "Sync controller pod has interfaces on both LM networks"
        - "Updating crossClusterNetwork updates deployment"

