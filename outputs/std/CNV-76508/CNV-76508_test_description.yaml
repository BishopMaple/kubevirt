          comment: "Synchronization controller pod with crosscluster0 interface"

    test_structure:
      type: "single"
      describe:
        wrapper: "SIG"
        description: "Cross-cluster migration proxy"
        decorators:
          - "decorators.SigCompute"
          - "Serial"
      context:
        description: "Sync controller crosscluster0 network attachment"
        decorators:
          - "Ordered"
          - "decorators.OncePerOrderedCleanup"
      it:
        description: "should attach sync controller to crosscluster0 network when feature gate and crossClusterNetwork are configured"
        test_id_format: "[test_id:TS-CNV-76508-001]"

    code_structure: |
      Context("Sync controller crosscluster0 network attachment", Ordered, decorators.OncePerOrderedCleanup) {
        BeforeAll(func() {
          // Enable CrossClusterMigrationProxy feature gate
          // Configure crossClusterNetwork in MigrationConfiguration
        })
        It("[test_id:TS-CNV-76508-001]should attach sync controller to crosscluster0 network when feature gate and crossClusterNetwork are configured", func() {
          // Get sync controller pods
          // Verify crosscluster0 interface exists on sync controller pod
          // Verify IP address is assigned from crosscluster NAD IPAM range
        })
      }

    test_objective:
      title: "Verify sync controller attaches to crosscluster0 network when CrossClusterMigrationProxy feature gate and crossClusterNetwork are configured"
      what: |
        This test validates that when the CrossClusterMigrationProxy feature gate is enabled
        and the crossClusterNetwork field is configured in MigrationConfiguration, the
        synchronization controller pods attach to the crosscluster0 network interface.
        This is the foundational prerequisite for all proxy-based migration functionality.
      why: |
        The crosscluster0 network attachment is the critical path for proxy operation.
        Without it, the synchronization controller cannot bridge migration traffic
        between the in-cluster migration network and the cross-cluster network.
        This is a P0 gate — all other proxy tests depend on this working correctly.
      acceptance_criteria:
        - "Sync controller pod has crosscluster0 network interface after configuration"
        - "crosscluster0 interface has an IP address from the configured IPAM range"
        - "Pod network status annotation shows crosscluster-migration NAD attached"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Ginkgo with kubevirt test framework"

    specific_preconditions:
      - name: "CrossCluster NAD"
        requirement: "NetworkAttachmentDefinition for crosscluster network must exist in the KubeVirt namespace"
        validation: "oc get net-attach-def -n openshift-cnv crosscluster-migration"

    test_data:
      resource_definitions:
        - name: "crosscluster-nad"
          type: "NetworkAttachmentDefinition"
          yaml: |
            apiVersion: k8s.cni.cncf.io/v1
            kind: NetworkAttachmentDefinition
            metadata:
              name: crosscluster-migration
              namespace: openshift-cnv
            spec:
              config: |
                {
                  "cniVersion": "0.3.1",
                  "type": "bridge",
                  "bridge": "crosscluster-br",
                  "ipam": {
                    "type": "whereabouts",
                    "range": "172.22.42.0/24"
                  }
                }

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Enable CrossClusterMigrationProxy feature gate on KubeVirt CR"
          command: "oc patch kubevirt kubevirt -n openshift-cnv --type merge -p '{\"spec\":{\"configuration\":{\"developerConfiguration\":{\"featureGates\":[\"CrossClusterMigrationProxy\"]}}}}'"
          validation: "Feature gate is listed in KubeVirt CR spec"
          pattern_id: "feature-gate-enablement"
          code_template: |
            By("Enabling CrossClusterMigrationProxy feature gate")
            kvConfig = kubevirt.UpdateKubeVirtConfigValue(func(kv *v1.KubeVirt) {
              if kv.Spec.Configuration.DeveloperConfiguration == nil {
                kv.Spec.Configuration.DeveloperConfiguration = &v1.DeveloperConfiguration{}
              }
              kv.Spec.Configuration.DeveloperConfiguration.FeatureGates = append(
                kv.Spec.Configuration.DeveloperConfiguration.FeatureGates,
                "CrossClusterMigrationProxy",
              )
            })

        - step_id: "SETUP-02"
          action: "Configure crossClusterNetwork in MigrationConfiguration"
          command: "oc patch kubevirt kubevirt -n openshift-cnv --type merge -p '{\"spec\":{\"configuration\":{\"migrationConfiguration\":{\"crossClusterNetwork\":\"openshift-cnv/crosscluster-migration\"}}}}'"
          validation: "crossClusterNetwork field is set in MigrationConfiguration"
          pattern_id: "migration-config"
          code_template: |
            By("Setting crossClusterNetwork in MigrationConfiguration")
            kvConfig = kubevirt.UpdateKubeVirtConfigValue(func(kv *v1.KubeVirt) {
              if kv.Spec.Configuration.MigrationConfiguration == nil {
                kv.Spec.Configuration.MigrationConfiguration = &v1.MigrationConfiguration{}
              }
              crossClusterNet = "openshift-cnv/crosscluster-migration"
              kv.Spec.Configuration.MigrationConfiguration.CrossClusterNetwork = &crossClusterNet
            })

      test_execution:
        - step_id: "TEST-01"
          action: "Get synchronization controller pods"
          command: "oc get pods -n openshift-cnv -l kubevirt.io=virt-synchronization-controller"
          validation: "At least one sync controller pod is found"
          pattern_id: "pod-inspection"
          code_template: |
            By("Getting synchronization controller pods")
            syncPods, err = kubevirt.Client().CoreV1().Pods("openshift-cnv").List(ctx, metav1.ListOptions{
              LabelSelector: "kubevirt.io=virt-synchronization-controller",
            })
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            ExpectWithOffset(1, syncPods.Items).ToNot(BeEmpty(), "No sync controller pods found")

        - step_id: "TEST-02"
          action: "Verify crosscluster0 interface exists on sync controller pod"
          command: "oc exec <sync-pod> -- ip addr show crosscluster0"
          validation: "crosscluster0 interface exists and has an IP address"
          pattern_id: "network-attachment-validation"
          code_template: |
            By("Verifying crosscluster0 interface on sync controller pod")
            syncControllerPod = &syncPods.Items[0]
            networkStatus, err = libnet.GetPodNetworkStatus(syncControllerPod)
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            var crossclusterAttachment *networkv1.NetworkStatus
            for i, status := range networkStatus {
              if status.Interface == "crosscluster0" {
                crossclusterAttachment = &networkStatus[i]
                break
              }
            }
            ExpectWithOffset(1, crossclusterAttachment).ToNot(BeNil(), "crosscluster0 interface not found on sync controller pod")
            ExpectWithOffset(1, crossclusterAttachment.IPs).ToNot(BeEmpty(), "crosscluster0 has no IP assigned")

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Restore KubeVirt configuration"
          command: "Remove CrossClusterMigrationProxy feature gate and crossClusterNetwork"
          code_template: |
            By("Restoring KubeVirt configuration")
            kubevirt.UpdateKubeVirtConfigValue(func(kv *v1.KubeVirt) {
              // Remove CrossClusterMigrationProxy from feature gates
              // Reset crossClusterNetwork
            })

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Sync controller pod has crosscluster0 network interface"
        condition: "crosscluster0 interface found in pod network status"
        failure_impact: "Proxy cannot function — no cross-cluster network path available"

      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "crosscluster0 interface has IP address from IPAM range"
        condition: "IP address is within 172.22.42.0/24 range"
        failure_impact: "Proxy cannot communicate on cross-cluster network"

    dependencies:
      kubernetes_resources:
        - "NetworkAttachmentDefinition: crosscluster-migration"
        - "KubeVirt: kubevirt"
        - "Pod: virt-synchronization-controller"
      external_tools:
        - "oc 4.22+"
        - "bridge CNI plugin"
        - "whereabouts IPAM"

  - scenario_id: "002"
