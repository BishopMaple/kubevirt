        requirement: "Proxy ports must be opened via TS-001 flow before cleanup"
        validation: "HasMappings returns true before Close()"

    test_data:
      resource_definitions: []
      api_endpoints: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
