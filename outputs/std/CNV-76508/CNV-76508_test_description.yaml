            kind: VirtualMachine
            metadata:
              name: cclm-proxy-test-vm
            spec:
              running: true
              template:
                spec:
                  domain:
                    resources:
                      requests:
                        memory: "1Gi"
                    devices:
                      disks:
                        - name: containerdisk
                          disk:
                            bus: virtio
                  volumes:
                    - name: containerdisk
                      containerDisk:
                        image: "quay.io/kubevirt/fedora-cloud-container-disk-demo"
      api_endpoints: []

