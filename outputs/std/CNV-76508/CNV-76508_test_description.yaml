    cpu_features: "Standard (VT-x/AMD-V)"
    storage: "RWX-capable StorageClass (ODF/Ceph RBD)"
    network: "OVN-Kubernetes + Multus + bridge CNI + whereabouts IPAM"

  network_configuration:
