    test_steps:
      setup: []
      test_execution:
        - step_id: "TEST-01"
          action: "Set crossClusterNetwork field in MigrationConfiguration"
          validation: "Field is accepted without error"
          pattern_id: "kubevirt-config-update"
          code_template: |
            By("Setting crossClusterNetwork in MigrationConfiguration")
            kubevirt.UpdateKubeVirtConfigValue(func(kv *v1.KubeVirt) {
              if kv.Spec.Configuration.MigrationConfiguration == nil {
                kv.Spec.Configuration.MigrationConfiguration = &v1.MigrationConfiguration{}
              }
              crossClusterNet = "openshift-cnv/crosscluster-migration"
              kv.Spec.Configuration.MigrationConfiguration.CrossClusterNetwork = &crossClusterNet
            })

        - step_id: "TEST-02"
          action: "Verify field is persisted in KubeVirt CR"
          validation: "crossClusterNetwork value matches what was set"
          code_template: |
            By("Verifying crossClusterNetwork field persisted")
            kv, err = kubevirt.Client().KubeVirt("openshift-cnv").Get(ctx, "kubevirt", metav1.GetOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            ExpectWithOffset(1, kv.Spec.Configuration.MigrationConfiguration.CrossClusterNetwork).ToNot(BeNil())
            ExpectWithOffset(1, *kv.Spec.Configuration.MigrationConfiguration.CrossClusterNetwork).To(Equal("openshift-cnv/crosscluster-migration"))

        - step_id: "TEST-03"
          action: "Verify sync controller deployment has crosscluster network annotation"
          validation: "Deployment pod template has network annotation for crosscluster NAD"
          pattern_id: "deployment-validation"
          code_template: |
            By("Verifying sync controller deployment network annotation")
            deployment, err = kubevirt.Client().AppsV1().Deployments("openshift-cnv").Get(ctx, "virt-synchronization-controller", metav1.GetOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            annotations = deployment.Spec.Template.Annotations
            ExpectWithOffset(1, annotations).To(HaveKey("k8s.v1.cni.cncf.io/networks"))
            ExpectWithOffset(1, annotations["k8s.v1.cni.cncf.io/networks"]).To(ContainSubstring("crosscluster-migration"))

      cleanup:
