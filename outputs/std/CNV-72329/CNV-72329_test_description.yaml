      it:
        description: "should require VM restart when NAD reference is changed"
        test_id_format: "[test_id:TS-CNV-72329-003]"

    code_structure: |
      Context("with LiveUpdateNADRef feature gate disabled", Ordered, func() {
        It("[test_id:TS-CNV-72329-003]should require VM restart when NAD reference is changed", func() {
          // Disable LiveUpdateNADRef FG
          // Create VM with secondary network
          // Update NAD reference
          // Verify RestartRequired condition appears (no migration)
          // Verify VM requires manual restart
        })
      })

    test_objective:
      title: "Verify with LiveUpdateNADRef FG disabled, changing NAD reference requires VM restart (not live migration)"
      what: |
        This test validates the feature gate behavior: when LiveUpdateNADRef is disabled,
        changing the NAD reference on a running VM should NOT trigger automatic live migration.
        Instead, the system should indicate that a VM restart is required to apply the change.
      why: |
        Feature gate validation ensures the feature can be safely disabled. When the FG is off,
        the old behavior (restart required) must be preserved. This is critical for customers
        who haven't opted into the feature or need to disable it due to issues.
      acceptance_criteria:
        - "With FG disabled, NAD ref change does not trigger migration"
        - "RestartRequired condition appears on the VM"
