    test_objective:
      title: "Verify VM connectivity on new network after NAD swap"
      what: |
        This end-to-end test validates that after a NAD reference swap and the resulting
        migration, the VM establishes network connectivity on the new network. It also
        verifies the VM is no longer reachable on the old network, confirming a clean
        network transition.
      why: |
        Connectivity is the ultimate validation of the NAD swap feature. Without verifying
        actual network reachability, the feature cannot be considered functional. This test
        represents the customer experience of seamlessly moving a VM between networks.
      acceptance_criteria:
        - "VM can communicate on the new network after NAD swap and migration"
        - "VM is unreachable on the old network after NAD swap"

    classification:
      test_type: "E2E"
      scope: "Multi-component"
      automation_approach: "pytest with openshift-python-wrapper"

