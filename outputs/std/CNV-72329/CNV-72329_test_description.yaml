      title: "Verify guest interface name and MAC address preserved after NAD swap"
      what: |
        This test validates that after a NAD reference live update, the guest-visible
        interface name (e.g., eth1) and MAC address remain unchanged. The test captures
        the interface name and MAC before the NAD swap, performs the swap with migration,
        and then verifies both properties are identical after migration.
