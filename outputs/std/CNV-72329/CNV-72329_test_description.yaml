        journey: starting with a VM on VLAN-A, performing the NAD swap to VLAN-B, and verifying
        both positive connectivity (can reach VLAN-B peers) and negative connectivity (isolated
        from VLAN-A peers).
      why: |
        VLAN migration is the primary customer use case for this feature. This test validates
        the complete workflow including network isolation verification, which is critical for
        security-sensitive environments where VLAN changes are used for isolation.
      acceptance_criteria:
