            ExpectWithOffset(1, err).ToNot(HaveOccurred())
        - step_id: "TEST-02"
          action: "Verify MigrationRequired condition does NOT appear"
          command: "Consistently HaveConditionMissingOrFalse(MigrationRequired)"
          validation: "No migration triggered"
          pattern_id: "negative-condition-check"
          code_template: |
            By("Verifying no migration is triggered")
            Consistently(matcher.ThisVMI(vmi), 30*time.Second, pollingInterval).
                Should(matcher.HaveConditionMissingOrFalse(v1.VirtualMachineInstanceMigrationRequired))

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM and NAD"
          code_template: |
            err = kubevirt.Client().VirtualMachine(testNamespace).Delete(ctx, vmName, metav1.DeleteOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

