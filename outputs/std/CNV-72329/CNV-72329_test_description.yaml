    code_structure: |
      class TestNADSwapConnectivity:
          """
          Tests for NAD swap with end-to-end network connectivity validation.

          Preconditions:
              - Source bridge NAD created
              - Target bridge NAD created
              - Running VM with secondary interface on source NAD
              - Peer VM on target network for connectivity validation
          """
          __test__ = False

          def test_nad_swap_connectivity_end_to_end(self):
              """
              Test that NAD swap results in working connectivity on the target network.

              Steps:
                  1. Patch VM NAD reference from source to target network
                  2. Wait for live migration to complete
                  3. Verify VM has IP on target network
                  4. Ping peer VM on target network

              Expected:
                  - Ping succeeds with 0% packet loss on target network
              """

    test_objective:
      title: "Verify NAD swap with network connectivity end-to-end"
      what: |
        End-to-end validation that a NAD swap results in fully functional network
        connectivity on the target network. Includes creating VMs on both source
        and target networks, performing the swap, and validating ping connectivity
        between the swapped VM and a peer on the target network.
      why: |
        This test validates the complete user workflow: admin changes NAD reference,
        migration occurs automatically, and the VM can communicate on the new network.
        This is the primary customer use case for the feature.
      acceptance_criteria:
        - "NAD swap triggers migration"
        - "VM obtains IP on target network after migration"
        - "Ping between swapped VM and peer VM on target network succeeds"

    classification:
      test_type: "E2E"
