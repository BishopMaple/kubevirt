          command: "Create NADs via fixtures"
          validation: "NADs exist"
        - step_id: "SETUP-02"
          action: "Create VM with secondary interface on source NAD"
          command: "VirtualMachineForTests with bridge interface"
          validation: "VM Running"
        - step_id: "SETUP-03"
          action: "Create peer VM on target NAD"
          command: "VirtualMachineForTests on target-net"
          validation: "Peer VM Running with IP"
      test_execution:
        - step_id: "TEST-01"
          action: "Patch VM NAD reference from source to target"
          command: "Patch VM spec networks"
          validation: "Patch accepted"
        - step_id: "TEST-02"
          action: "Wait for live migration to complete"
          command: "Wait for migration status"
          validation: "Migration succeeded"
        - step_id: "TEST-03"
          action: "Verify VM has IP on target network"
          command: "Check VMI interfaces for target network IP"
          validation: "IP assigned"
        - step_id: "TEST-04"
          action: "Ping peer VM on target network"
          command: "assert_ping_successful from VM to peer"
          validation: "Ping succeeds with 0% packet loss"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VMs and NADs"
          command: "Fixtures handle cleanup"

    assertions:
