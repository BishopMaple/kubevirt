          command: "oc cordon for each non-host node"
          validation: "Only 1 schedulable node"
      test_execution:
        - step_id: "TEST-01"
          action: "Patch NAD reference"
          command: "Patch VM spec"
          validation: "Patch accepted"
        - step_id: "TEST-02"
          action: "Verify migration fails or is pending"
          command: "Check migration status"
          validation: "Migration not completed"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Uncordon nodes, delete resources"
          command: "Restore cluster state"

    assertions:
