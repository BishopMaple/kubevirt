          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It"]
          comment: "VM under test"

    test_structure:
      type: "single"
      describe:
        wrapper: "SIG"
        description: "NAD name live update extended"
        decorators:
          - "decorators.SigNetwork"
          - "decorators.RequiresTwoSchedulableNodes"
          - "Serial"
      context:
        description: "with LiveUpdateNADRef feature gate disabled"
        decorators:
          - "Ordered"
      it:
        description: "should require restart when NAD reference changes with feature gate disabled"
        test_id_format: "[test_id:TS-CNV-72329-014]"

    code_structure: |
      Context("with LiveUpdateNADRef feature gate disabled", Ordered, func() {
        BeforeAll(func() {
          // Disable FG, create NADs, create VM
        })
        It("[test_id:TS-CNV-72329-014]should require restart when NAD reference changes with feature gate disabled", func() {
          // Patch NAD reference
          // Verify RestartRequired condition set on VM
          // Verify VMI spec still references old NAD
        })
      })

    test_objective:
      title: "Verify RestartRequired condition when feature gate disabled"
      what: |
        This test validates that when the LiveUpdateNADRef feature gate is disabled,
        changing the NAD reference on a VM sets the RestartRequired condition instead of
        triggering a live migration. The VMI spec should still reference the old NAD.
      why: |
        Feature gate control is essential for safe rollout. When disabled, NAD changes
        must follow the existing restart-based workflow. This ensures backward compatibility
        and gives operators a fallback if the live update feature causes issues.
      acceptance_criteria:
        - "RestartRequired condition set to True on VM"
        - "No MigrationRequired condition (no auto-migration)"
        - "VMI spec still references the old/source NAD"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "ginkgo with gomega"

    specific_preconditions:
      - name: "LiveUpdateNADRef feature gate DISABLED"
        requirement: "Feature gate explicitly disabled"
        validation: "config.DisableFeatureGate('LiveUpdateNADRef')"

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Disable LiveUpdateNADRef feature gate"
          command: "config.DisableFeatureGate('LiveUpdateNADRef')"
          validation: "Feature gate disabled"
          pattern_id: "config-disable-feature-gate"
          code_template: |
            config.DisableFeatureGate("LiveUpdateNADRef")
            updateStrategy = &v1.KubeVirtWorkloadUpdateStrategy{
                WorkloadUpdateMethods: []v1.WorkloadUpdateMethod{v1.WorkloadUpdateMethodLiveMigrate},
            }
            rolloutStrategy = pointer.P(v1.VMRolloutStrategyLiveUpdate)
            err = config.RegisterKubevirtConfigChange(
                config.WithWorkloadUpdateStrategy(updateStrategy),
                config.WithVMRolloutStrategy(rolloutStrategy),
            )
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
        - step_id: "SETUP-02"
          action: "Create NADs and VM"
          command: "Standard NAD + VM creation"
          validation: "VM running"
          pattern_id: "bridge-nad-setup"

      test_execution:
        - step_id: "TEST-01"
          action: "Patch VM to change NAD reference"
          command: "patch.WithReplace networkName"
          validation: "Patch succeeds"
          pattern_id: "patch-nad-reference"
        - step_id: "TEST-02"
          action: "Verify RestartRequired condition IS set"
          command: "Eventually matcher.ThisVM should HaveConditionTrue(RestartRequired)"
          validation: "RestartRequired is True"
          pattern_id: "verify-restart-required"
          code_template: |
            By("Verifying RestartRequired condition IS set")
            Eventually(matcher.ThisVM(vm), timeoutInterval, pollingInterval).
                Should(matcher.HaveConditionTrue(v1.VirtualMachineRestartRequired))
        - step_id: "TEST-03"
          action: "Verify VMI spec still references old NAD"
          command: "Get VMI, check networks[0].multus.networkName"
          validation: "Old NAD reference preserved in VMI"
          pattern_id: "verify-vmi-spec"
          code_template: |
            By("Verifying VMI spec still references old NAD")
            vmiObj, err = kubevirt.Client().VirtualMachineInstance(testNamespace).Get(
                ctx, vmName, metav1.GetOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            for _, net := range vmiObj.Spec.Networks {
                if net.Multus != nil {
                    ExpectWithOffset(1, net.Multus.NetworkName).To(Equal(sourceNAD),
                        "VMI should still reference the original NAD when feature gate is disabled")
                }
            }

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM and NADs, re-enable feature gate"
          code_template: |
            err = kubevirt.Client().VirtualMachine(testNamespace).Delete(ctx, vmName, metav1.DeleteOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "RestartRequired condition set"
        condition: "VM has condition RestartRequired=True"
        failure_impact: "Feature gate bypass — NAD changes still trigger migration when FG off"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "VMI spec unchanged (old NAD)"
        condition: "VMI networks reference source NAD, not target"
        failure_impact: "NAD change applied to VMI despite FG being disabled"

    dependencies:
      kubernetes_resources:
        - "VirtualMachine: test-vm"
        - "NetworkAttachmentDefinition: source-nad, target-nad"
      external_tools:
        - "Bridge CNI plugin"
      scenario_specific_rbac:
        - "patch on virtualmachines"

