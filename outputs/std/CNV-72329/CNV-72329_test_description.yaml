    code_structure: |
      It("[test_id:TS-CNV-72329-002]should establish connectivity on the new network after NAD swap", func() {
        // After NAD swap and successful migration
        // Verify VM can communicate on the new network
      })

    test_objective:
      title: "Verify VM connectivity on new network after NAD swap"
      what: |
        After a NAD reference change triggers a migration, validates that the VM
        has network connectivity on the new target network. The VM should be able
        to send and receive traffic through the new bridge attachment.
      why: |
        Connectivity validation is essential because the migration must result in a
        functional network attachment. Without this, the feature is incomplete — the
        VM moved but cannot communicate on the new network.
      acceptance_criteria:
        - "VM is Running on the new network after migration"
        - "VM has an IP address on the target network interface"
        - "Network traffic can flow through the new attachment"

    classification:
