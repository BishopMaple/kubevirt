                ExpectWithOffset(1, err).ToNot(HaveOccurred())
                for _, condition := range vm.Status.Conditions {
                    if condition.Type == v1.VirtualMachineRestartRequired && condition.Status == k8sv1.ConditionTrue {
                        return true
                    }
