        test_id_format: "[test_id:TS-CNV-72329-012]"

    code_structure: |
      Context("Integration with hotplug/unplug operations", Ordered, decorators.OncePerOrderedCleanup, func() {
        It("[test_id:TS-CNV-72329-012]should swap NAD after hotplug and hotplug after swap", func() {
          // Hotplug a secondary interface
          // Swap NAD on the hotplugged interface
          // Verify swap works on hotplugged interface
          // Swap NAD, then hotplug another interface
          // Verify hotplug works after swap
        })
      })

    test_objective:
      title: "Verify NAD swap integrates with hotplug/unplug operations"
      what: |
        This integration test validates that NAD reference live update works correctly
        in combination with interface hotplug and unplug operations. It tests two
        scenarios: (1) performing a NAD swap on a hotplugged interface, and (2) hotplugging
        a new interface after a NAD swap has been performed.
      why: |
        Hotplug and NAD swap both modify the VM's network configuration at runtime. They
        must work together without conflicts. Customers may use both features on the same
        VM as they adjust network topology dynamically.
      acceptance_criteria:
        - "NAD swap works on a hotplugged secondary interface"
        - "Interface hotplug works correctly after a NAD swap"
        - "VM remains stable through both operations"

    classification:
      test_type: "E2E"
      scope: "Multi-component"
      automation_approach: "pytest with openshift-python-wrapper"

    specific_preconditions:
      - name: "Hotplug support"
        requirement: "VM configured to support interface hotplug"
        validation: "VM spec allows hotplug"

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create NADs and VM (started with no secondary interfaces)"
          command: "Create VM without secondary interfaces"
          validation: "VM running with only pod network"

      test_execution:
        - step_id: "TEST-01"
          action: "Hotplug a secondary interface attached to source NAD"
          command: "virtctl addinterface"
          validation: "Interface hotplugged successfully"
        - step_id: "TEST-02"
          action: "Swap NAD reference on the hotplugged interface"
          command: "VM patch NAD reference"
          validation: "NAD swap triggers migration"
        - step_id: "TEST-03"
          action: "Verify NAD swap worked on hotplugged interface"
          command: "Check VMI network status"
          validation: "Hotplugged interface on target NAD"
        - step_id: "TEST-04"
          action: "Hotplug another interface after NAD swap"
          command: "virtctl addinterface with new NAD"
          validation: "Second hotplug succeeds"

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM and NADs"
          command: "Delete resources"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "NAD swap works on hotplugged interface"
        condition: "Hotplugged interface NAD reference updated and migration completed"
        failure_impact: "NAD swap incompatible with hotplugged interfaces"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Hotplug works after NAD swap"
        condition: "New interface hotplugged successfully after NAD swap"
        failure_impact: "NAD swap breaks subsequent hotplug operations"

