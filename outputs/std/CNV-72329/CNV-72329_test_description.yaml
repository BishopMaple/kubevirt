scenarios:
  # ============================================================
  # TIER 1 (Functional) - Scenarios 001-006
  # ============================================================
  - scenario_id: "001"
    test_id: "TS-CNV-72329-001"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "CNV-72329"

    patterns:
      primary: "migration_connectivity"
      secondary:
        - "bridge-nad-setup"
        - "vm-create-with-secondary-net"
        - "nad-ref-update"
        - "migration-wait"
        - "ping-connectivity"
      helpers_required:
        - name: "libnet"
          functions: ["NewBridgeNetAttachDef", "CreateNAD"]
          purpose: "Create bridge NADs for secondary networks"
        - name: "libvmifact"
          functions: ["NewFedora"]
          purpose: "Create Fedora VMI with secondary network"
        - name: "libwait"
          functions: ["WaitUntilVMIReady"]
          purpose: "Wait for VMI to reach Running state"
        - name: "libmigration"
          functions: ["WaitForSuccessfulMigration"]
          purpose: "Wait for migration triggered by NAD swap"
        - name: "console"
          functions: ["LoginToFedora"]
          purpose: "Login to Fedora VMI for connectivity checks"
      decorators:
        - "decorators.SigNetwork"
        - "Serial"

    variables:
      closure_scope:
        - name: "ctx"
          type: "context.Context"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It"]
          comment: "Background context for API calls"
        - name: "namespace"
          type: "string"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It"]
          comment: "Test namespace"
        - name: "err"
          type: "error"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It"]
          comment: "Error variable for assertions"
        - name: "vm"
          type: "*v1.VirtualMachine"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It"]
          comment: "VM under test with secondary network"
        - name: "nadA"
          type: "*networkv1.NetworkAttachmentDefinition"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll"]
          comment: "Original bridge NAD"
        - name: "nadB"
          type: "*networkv1.NetworkAttachmentDefinition"
          initialized_in: "BeforeAll"
          used_in: ["It"]
          comment: "Target bridge NAD for swap"

    test_structure:
      type: "single"
      describe:
        wrapper: "SIG"
        description: "NAD Reference Live Update"
        decorators:
          - "decorators.SigNetwork"
          - "Serial"
      context:
        description: "NAD reference update triggers migration with connectivity"
        decorators:
          - "Ordered"
      it:
        description: "should trigger live migration and maintain network connectivity after NAD swap"
        test_id_format: "[test_id:TS-CNV-72329-001]"

    code_structure: |
      SIG("NAD Reference Live Update", decorators.SigNetwork, Serial, func() {
        Context("NAD reference update triggers migration with connectivity", Ordered, func() {
          var ctx context.Context
          var namespace string
          var vm *v1.VirtualMachine
          var nadA, nadB *networkv1.NetworkAttachmentDefinition

          BeforeAll(func() {
            ctx = context.Background()
            namespace = testsuite.GetTestNamespace(nil)
            // Create two bridge NADs (nadA and nadB)
            // Create VM with secondary network attached to nadA
            // Wait for VM to be Running
          })
          It("[test_id:TS-CNV-72329-001]should trigger live migration and maintain network connectivity after NAD swap", func() {
            // Update VM spec to reference nadB instead of nadA
            // Wait for migration to complete
            // Verify ping connectivity on new NAD
          })
        })
      })

    test_objective:
      title: "Verify VM NAD reference update triggers live migration and VM connects to new network post-migration with network connectivity validated via ping"
      what: |
        This test validates the core feature behavior: when a user updates the NAD reference
        on a running VM's secondary network from NAD-A to NAD-B, the system automatically triggers
        a live migration. After the migration completes successfully, the VM should be connected
        to the new network (NAD-B) and network connectivity should be verified via ICMP ping.
      why: |
        This is the primary use case for the LiveUpdateNADRef feature gate. Customers need to
        move VMs between VLANs or network segments for maintenance, security isolation, or network
        topology changes. Verifying that migration triggers automatically and connectivity works
        on the new network ensures the zero-downtime network change promise is delivered.
      acceptance_criteria:
        - "NAD reference update on VM spec triggers automatic live migration"
        - "Migration completes successfully without VM restart"
        - "VM has network connectivity on the new NAD post-migration (ping succeeds)"

    classification:
      test_type: "Functional"
      scope: "Multi-component"
      automation_approach: "Ginkgo with kubevirt test framework"

    specific_preconditions:
      - name: "Two bridge NADs"
        requirement: "Two distinct bridge-type NetworkAttachmentDefinitions (nadA, nadB) in the test namespace"
        validation: "oc get net-attach-def -n <namespace>"
      - name: "VM with secondary network"
        requirement: "Running VM with one secondary network interface attached to nadA"
        validation: "oc get vmi -n <namespace> -o jsonpath='{.spec.networks}'"
      - name: "Peer VM for connectivity"
        requirement: "A second VM on nadB network to validate ping connectivity"
        validation: "oc get vmi -n <namespace>"

    test_data:
      resource_definitions:
        - name: "nadA"
          type: "NetworkAttachmentDefinition"
          yaml: |
            apiVersion: k8s.cni.cncf.io/v1
            kind: NetworkAttachmentDefinition
            metadata:
              name: nad-bridge-a
            spec:
              config: '{"cniVersion":"0.3.1","name":"nad-bridge-a","type":"bridge","bridge":"br-a","ipam":{}}'
        - name: "nadB"
          type: "NetworkAttachmentDefinition"
          yaml: |
            apiVersion: k8s.cni.cncf.io/v1
            kind: NetworkAttachmentDefinition
            metadata:
              name: nad-bridge-b
            spec:
              config: '{"cniVersion":"0.3.1","name":"nad-bridge-b","type":"bridge","bridge":"br-b","ipam":{}}'

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create bridge NAD-A in test namespace"
          command: "libnet.NewBridgeNetAttachDef(namespace, 'nad-bridge-a', 'br-a')"
          validation: "NAD created successfully"
          pattern_id: "bridge-nad-setup"
          code_template: |
            nadA, err = libnet.CreateNAD(namespace, libnet.NewBridgeNetAttachDef("nad-bridge-a", "br-a"))
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
        - step_id: "SETUP-02"
          action: "Create bridge NAD-B in test namespace"
          command: "libnet.NewBridgeNetAttachDef(namespace, 'nad-bridge-b', 'br-b')"
          validation: "NAD created successfully"
          pattern_id: "bridge-nad-setup"
          code_template: |
            nadB, err = libnet.CreateNAD(namespace, libnet.NewBridgeNetAttachDef("nad-bridge-b", "br-b"))
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
        - step_id: "SETUP-03"
          action: "Create Fedora VM with secondary network attached to NAD-A"
          command: "libvmifact.NewFedora with bridge interface on nadA"
          validation: "VM created and Running"
          pattern_id: "vm-create-with-secondary-net"
          code_template: |
            vmi = libvmifact.NewFedora(
              libvmi.WithInterface(libvmi.InterfaceDeviceWithBridgeBinding("secondary")),
              libvmi.WithNetwork(libvmi.MultusNetwork("secondary", "nad-bridge-a")),
            )
            vm, err = kubevirt.Client().VirtualMachine(namespace).Create(ctx, vmi)
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
        - step_id: "SETUP-04"
          action: "Wait for VM to reach Running state"
          command: "libwait.WaitUntilVMIReady"
          validation: "VMI phase is Running"
          pattern_id: "vm-wait-ready"
          code_template: |
            vmi = libwait.WaitUntilVMIReady(vmi, console.LoginToFedora)
      test_execution:
        - step_id: "TEST-01"
          action: "Update VM spec to change NAD reference from nadA to nadB"
          command: "Patch VM spec.template.spec.networks[].multus.networkName"
          validation: "VM spec updated successfully"
          pattern_id: "nad-ref-update"
          code_template: |
            patchData := fmt.Sprintf(`[{"op":"replace","path":"/spec/template/spec/networks/1/multus/networkName","value":"%s/%s"}]`, namespace, "nad-bridge-b")
            vm, err = kubevirt.Client().VirtualMachine(namespace).Patch(ctx, vm.Name, types.JSONPatchType, []byte(patchData), metav1.PatchOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
        - step_id: "TEST-02"
          action: "Wait for automatic migration to trigger and complete"
          command: "libmigration.WaitForSuccessfulMigration"
          validation: "Migration completed successfully"
          pattern_id: "migration-wait"
          code_template: |
            Eventually(func() bool {
              vmi, err = kubevirt.Client().VirtualMachineInstance(namespace).Get(ctx, vm.Name, metav1.GetOptions{})
              ExpectWithOffset(1, err).ToNot(HaveOccurred())
              return vmi.Status.MigrationState != nil && vmi.Status.MigrationState.Completed
            }, MigrationWaitTime, time.Second).Should(BeTrue(), "migration should complete after NAD ref update")
        - step_id: "TEST-03"
          action: "Verify network connectivity on new NAD via ping"
          command: "Ping from VM to peer on nadB network"
          validation: "Ping succeeds with 0% packet loss"
          pattern_id: "ping-connectivity"
          code_template: |
            Expect(console.RunCommand(vmi, fmt.Sprintf("ping -c 3 %s", peerIP), 30*time.Second)).To(Succeed())
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM and NADs"
          command: "Kubernetes garbage collection via owner references"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Live migration triggers automatically after NAD reference update"
        condition: "vmi.Status.MigrationState != nil && vmi.Status.MigrationState.Completed == true"
        failure_impact: "Core feature broken - NAD swap does not trigger migration"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Network connectivity works on new NAD post-migration"
        condition: "ping to peer VM on nadB succeeds with 0% packet loss"
        failure_impact: "VM not connected to new network after migration"

    dependencies:
      kubernetes_resources:
        - "NetworkAttachmentDefinition: nad-bridge-a"
        - "NetworkAttachmentDefinition: nad-bridge-b"
        - "VirtualMachine: test VM with secondary network"
      external_tools:
        - "oc 4.22+"
        - "virtctl"
      scenario_specific_rbac:
        - "update on virtualmachines (to change NAD ref)"

  # ============================================================
  - scenario_id: "002"
    test_id: "TS-CNV-72329-002"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "CNV-72329"

    patterns:
