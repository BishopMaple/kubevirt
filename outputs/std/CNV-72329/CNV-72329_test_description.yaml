        requirement: "Feature gate must be enabled on KubeVirt CR"
        validation: "Feature gate is in active feature gates list"

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Verify LiveUpdateNADRef feature gate is enabled"
          command: "Check KubeVirt CR feature gates"
          validation: "Feature gate present"
        - step_id: "SETUP-02"
          action: "Create NADs and VM with secondary interface"
          command: "Standard setup"
          validation: "VM Running"
      test_execution:
        - step_id: "TEST-01"
          action: "Patch VM NAD reference to target NAD"
          command: "Patch VM spec"
          validation: "Patch accepted"
        - step_id: "TEST-02"
          action: "Verify RestartRequired condition is NOT set"
          command: "Check VM conditions for RestartRequired"
          validation: "RestartRequired is not present or is False"
          code_template: |
            Consistently(func() bool {
                vm, err = kubevirt.Client().VirtualMachine(namespace).Get(ctx, vm.Name, metav1.GetOptions{})
                ExpectWithOffset(1, err).ToNot(HaveOccurred())
                for _, condition := range vm.Status.Conditions {
                    if condition.Type == v1.VirtualMachineRestartRequired {
                        return condition.Status == k8sv1.ConditionTrue
                    }
                }
                return false
            }, 30*time.Second, 5*time.Second).Should(BeFalse(), "RestartRequired should NOT be set")
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM and NADs"
          command: "Delete created resources"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "RestartRequired condition is NOT set after NAD change"
        condition: "VM has no RestartRequired=True condition"
        failure_impact: "Feature gate not effective — users still see restart-required for NAD changes"

    dependencies:
      kubernetes_resources:
        - "KubeVirt CR with LiveUpdateNADRef enabled"
        - "VirtualMachine with secondary interface"

