scenarios:
  # =====================================================================
  # GROUP 1: Core NAD Live Update (5 scenarios)
  # Requirement: NAD reference can be live-updated on a running VM
  # =====================================================================

  - scenario_id: "001"
    test_id: "TS-CNV-72329-001"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "CNV-72329"

    patterns:
      primary: "migration_connectivity"
      secondary:
        - "bridge_nad_setup"
        - "vm_creation_with_secondary_network"
        - "nad_patch_operation"
        - "migration_wait"
      helpers_required:
        - name: "libnet"
          functions: ["NewBridgeNetAttachDef", "CreateNAD"]
          purpose: "Create bridge-based NADs for source and target networks"
        - name: "libvmifact"
          functions: ["NewFedora"]
          purpose: "Create Fedora VMI with secondary interface"
        - name: "libwait"
          functions: ["WaitUntilVMIReady"]
          purpose: "Wait for VMI to reach Running state"
        - name: "libmigration"
          functions: ["WaitForSuccessfulMigration"]
          purpose: "Wait for migration triggered by NAD swap"
        - name: "console"
          functions: ["LoginToFedora"]
          purpose: "Console login for VMI readiness"
      decorators:
