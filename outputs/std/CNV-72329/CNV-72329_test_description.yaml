            originalIfaceName = vmi.Status.Interfaces[1].Name
            originalMAC = vmi.Status.Interfaces[1].MAC
      test_execution:
        - step_id: "TEST-01"
          action: "Update NAD reference from nadA to nadB"
          command: "Patch VM spec"
          validation: "Patch applied"
          pattern_id: "nad-ref-update"
        - step_id: "TEST-02"
          action: "Wait for migration to complete"
          command: "Wait for migration state completed"
          validation: "Migration completed"
          pattern_id: "migration-wait"
        - step_id: "TEST-03"
          action: "Verify interface name and MAC address are preserved"
          command: "Get VMI status.interfaces and compare"
          validation: "Interface name and MAC match originals"
          pattern_id: "interface-identity-check"
          code_template: |
            vmi, err = kubevirt.Client().VirtualMachineInstance(namespace).Get(ctx, vm.Name, metav1.GetOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            Expect(vmi.Status.Interfaces[1].Name).To(Equal(originalIfaceName), "interface name should be preserved after NAD swap")
            Expect(vmi.Status.Interfaces[1].MAC).To(Equal(originalMAC), "MAC address should be preserved after NAD swap")
      cleanup:
        - step_id: "CLEANUP-01"
