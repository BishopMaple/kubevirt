        description: "Pod network preservation with LiveUpdateNADRef FG enabled"
        decorators:
          - "Ordered"
      it:
        description: "should preserve auto-injected pod network when VM has no explicit interfaces"
        test_id_format: "[test_id:TS-CNV-72329-006]"

    code_structure: |
      Context("Pod network preservation with LiveUpdateNADRef FG enabled", Ordered, func() {
        It("[test_id:TS-CNV-72329-006]should preserve auto-injected pod network when VM has no explicit interfaces", func() {
          // Create VM with NO explicit interfaces/networks (auto-injected pod network only)
          // Verify VMI has pod network (masquerade)
          // Verify VMI is Running and accessible via pod network
          // Verify no networks were dropped by syncNetworks
        })
      })

    test_objective:
      title: "Verify auto-injected pod network (masquerade) is preserved when LiveUpdateNADRef FG is enabled and VM has no explicit interfaces/networks defined"
      what: |
        This is a regression test for the bug fixed in PR #17315/#17373. When the LiveUpdateNADRef
        feature gate is enabled and a VM has no explicitly defined interfaces or networks (relying
        on auto-injected pod network with masquerade binding), the syncNetworks function must not
        drop the auto-injected pod network.
      why: |
        The original syncNetworks implementation dropped networks not found in the VM spec,
        including the auto-injected pod network. This broke VMs that relied on default pod
        networking. This regression test ensures the fix is not regressed in future refactors.
      acceptance_criteria:
        - "VM with no explicit interfaces/networks starts successfully"
        - "Auto-injected pod network (masquerade) is present on VMI"
        - "VM is accessible via pod network"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Ginkgo with kubevirt test framework"

    specific_preconditions:
      - name: "LiveUpdateNADRef FG enabled"
        requirement: "LiveUpdateNADRef feature gate is enabled (default in Beta)"
        validation: "Check KubeVirt CR feature gates"
      - name: "No explicit interfaces/networks on VM"
        requirement: "VM spec does not define interfaces or networks arrays"
        validation: "VM spec check"

    test_data:
      resource_definitions:
        - name: "minimal-vm"
          type: "VirtualMachine"
          yaml: |
            apiVersion: kubevirt.io/v1
            kind: VirtualMachine
            metadata:
              name: test-vm-minimal
            spec:
              runStrategy: Always
              template:
                spec:
                  domain:
                    resources:
                      requests:
                        memory: 1Gi

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Ensure LiveUpdateNADRef FG is enabled"
          command: "Verify KubeVirt CR"
          validation: "FG is enabled"
      test_execution:
        - step_id: "TEST-01"
          action: "Create VM with no explicit interfaces or networks"
          command: "libvmifact.NewFedora() without interface/network options"
          validation: "VM created"
          code_template: |
            vmi = libvmifact.NewFedora()
            vm, err = kubevirt.Client().VirtualMachine(namespace).Create(ctx, vmi)
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
        - step_id: "TEST-02"
          action: "Wait for VM to be Running"
          command: "libwait.WaitUntilVMIReady"
          validation: "VMI is Running"
        - step_id: "TEST-03"
          action: "Verify VMI has auto-injected pod network with masquerade binding"
          command: "Check VMI spec.networks and spec.domain.devices.interfaces"
          validation: "Pod network present with masquerade binding"
          code_template: |
            vmi, err = kubevirt.Client().VirtualMachineInstance(namespace).Get(ctx, vm.Name, metav1.GetOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            Expect(vmi.Spec.Networks).To(ContainElement(
              gstruct.MatchFields(gstruct.IgnoreExtras, gstruct.Fields{
                "Name": Equal("default"),
                "NetworkSource": gstruct.MatchFields(gstruct.IgnoreExtras, gstruct.Fields{
                  "Pod": Not(BeNil()),
                }),
              }),
            ))
        - step_id: "TEST-04"
          action: "Verify VM is accessible via pod network (login via console)"
          command: "console.LoginToFedora"
          validation: "Console login succeeds"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM"
          command: "Kubernetes garbage collection"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Auto-injected pod network is present on VMI"
        condition: "VMI spec.networks contains 'default' pod network"
        failure_impact: "Regression of PR #17315 - pod network dropped by syncNetworks"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "VM is accessible via pod network"
        condition: "Console login to VM succeeds"
        failure_impact: "VM has no network connectivity despite pod network being listed"

    dependencies:
      kubernetes_resources:
        - "VirtualMachine: minimal VM without explicit networks"
      external_tools:
        - "oc 4.22+"

