    code_structure: |
      Context("[NEGATIVE] LiveUpdateNADRef FG disabled requires VM restart for NAD change", Ordered, decorators.OncePerOrderedCleanup) {
        BeforeAll(func() {
          // Ensure LiveUpdateNADRef FG is disabled
          // Create NADs and VM with secondary network
        })
        It("[test_id:TS-CNV-72329-003]should require VM restart for NAD change when LiveUpdateNADRef FG is disabled", func() {
          // Change NAD reference on VM
          // Verify VM enters RestartRequired condition
        })
      }

    test_objective:
      title: "[NEGATIVE] Verify LiveUpdateNADRef FG disabled requires VM restart for NAD change"

      what: |
        This negative test validates that when the LiveUpdateNADRef feature gate is disabled,
        changing the NAD reference on a running VM results in a RestartRequired condition.
        The change is not automatically applied via migration.

      why: |
        This verifies the feature gate correctly gates the behavior. Without the FG enabled,
        the traditional behavior must be preserved: NAD changes require VM restart. This
        ensures backward compatibility and safe rollout.

      acceptance_criteria:
        - "LiveUpdateNADRef feature gate is confirmed disabled"
        - "NAD reference change sets RestartRequired condition on VM"
        - "No automatic migration is triggered"

    classification:
