    code_structure: |
      class TestNADLiveUpdateRBAC:
          """
          Tests for RBAC validation on NAD reference changes.

          STP Reference: https://redhat.atlassian.net/browse/CNV-72329

          Preconditions:
              - Bridge NAD-A and NAD-B created in the test namespace
              - Running VM with secondary network attached to NAD-A
              - Unprivileged user without VM update permissions
          """
          __test__ = False

          def test_non_admin_cannot_change_nad_reference(self):
              """
              [NEGATIVE] Test that non-admin users without VM update permissions cannot change NAD references.

              Preconditions:
                  - Unprivileged user client

              Steps:
                  1. Attempt to patch VM spec NAD reference using unprivileged user client

              Expected:
                  - API returns 403 Forbidden error
              """

    test_objective:
      title: "Verify that non-admin users without VM update permissions cannot change NAD references"
      what: |
        This test validates RBAC enforcement for NAD reference changes. A user without VM update
        permissions should not be able to modify the NAD reference on a VM spec, as this would
        trigger a migration and change the VM's network configuration.
      why: |
        Network configuration changes have security implications. Unauthorized users should not
        be able to move VMs between networks, which could bypass network isolation policies.
        RBAC enforcement ensures only authorized administrators can perform NAD swaps.
      acceptance_criteria:
        - "Unprivileged user receives 403 Forbidden when attempting NAD ref update"
        - "VM remains unchanged (no NAD reference modification)"
        - "No migration triggered"

    classification:
      test_type: "E2E"
      scope: "Single-component"
      automation_approach: "pytest with openshift-python-wrapper"

    specific_preconditions:
      - name: "Unprivileged user"
        requirement: "User without VM update permissions"
        validation: "oc auth can-i update virtualmachines --as=<user>"
      - name: "Running VM with secondary network"
        requirement: "VM running with NAD-A attached"
        validation: "oc get vmi"

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create NADs, VM, and configure unprivileged user"
          command: "Tier 2 helpers"
          validation: "VM running, unprivileged user configured"
      test_execution:
        - step_id: "TEST-01"
          action: "Attempt to patch VM NAD reference using unprivileged user"
          command: "Patch VM spec as unprivileged user"
          validation: "403 Forbidden returned"
        - step_id: "TEST-02"
          action: "Verify VM NAD reference unchanged"
          command: "Get VM spec as admin"
          validation: "NAD reference still points to NAD-A"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM, NADs, and unprivileged user resources"
          command: "Cleanup"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Unprivileged user cannot modify NAD reference"
        condition: "API returns 403 Forbidden"
        failure_impact: "RBAC bypass - unauthorized users can change VM networks"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "VM remains unchanged after failed RBAC attempt"
        condition: "VM spec NAD reference still points to original NAD"
        failure_impact: "Partial modification despite RBAC rejection"

    dependencies:
      kubernetes_resources:
        - "NetworkAttachmentDefinition: NAD-A, NAD-B"
        - "VirtualMachine: test VM"
        - "ServiceAccount/Role/RoleBinding: unprivileged user"
      external_tools:
        - "oc 4.22+"
      scenario_specific_rbac:
        - "Unprivileged user without update on virtualmachines"
---
