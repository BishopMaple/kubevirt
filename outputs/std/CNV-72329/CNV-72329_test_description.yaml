      validation: "oc get nodes --selector=node-role.kubernetes.io/worker -o name | wc -l"
    - name: "Multus CNI"
      requirement: "Multus enabled for secondary network attachment"
      validation: "oc get pods -n openshift-multus -l app=multus"
    - name: "LiveUpdateNADRef feature gate"
      requirement: "Beta feature gate enabled (default in 4.22+)"
      validation: "oc get kubevirt -n openshift-cnv -o jsonpath='{.items[0].spec.configuration.developerConfiguration.featureGates}'"

