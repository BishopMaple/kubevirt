          - "Ordered"
          - "decorators.OncePerOrderedCleanup"
      it:
        description: "should allow NAD reference change without requiring VM restart when FG is enabled"
        test_id_format: "[test_id:TS-CNV-72329-002]"

    code_structure: |
      Context("LiveUpdateNADRef FG enabled allows NAD change without restart", Ordered, decorators.OncePerOrderedCleanup) {
        BeforeAll(func() {
          // Verify LiveUpdateNADRef FG is enabled
          // Create NADs and VM with secondary network
        })
        It("[test_id:TS-CNV-72329-002]should allow NAD reference change without requiring VM restart when FG is enabled", func() {
          // Change NAD reference on VM
          // Verify VM does not enter RestartRequired condition
          // Verify change is applied via migration
        })
      }

    test_objective:
      title: "Verify LiveUpdateNADRef FG enabled allows NAD change without restart"

      what: |
        This test validates that when the LiveUpdateNADRef feature gate is enabled,
        changing the NAD reference on a running VM does not trigger a restart-required
        condition. Instead, the change is applied transparently via live migration.

      why: |
        The feature gate is the control mechanism for this feature. Users must be
        confident that enabling the FG allows seamless NAD reference changes without
        requiring manual VM restarts, which would defeat the purpose of the feature.

      acceptance_criteria:
        - "LiveUpdateNADRef feature gate is confirmed enabled"
        - "NAD reference change does not set RestartRequired condition on VM"
        - "NAD change is applied via automatic migration, not restart"

    classification:
      test_type: "Functional"
      scope: "Multi-component"
      automation_approach: "Ginkgo with KubeVirt test framework"

    specific_preconditions:
      - name: "LiveUpdateNADRef feature gate enabled"
        requirement: "FG must be enabled in KubeVirt configuration"
        validation: "oc get kubevirt -o jsonpath='{.items[0].spec.configuration.developerConfiguration.featureGates}'"

    test_data:
      resource_definitions: []
      api_endpoints: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Verify LiveUpdateNADRef FG is enabled"
          command: "Check KubeVirt feature gates"
          validation: "FG is listed and enabled"
          pattern_id: "fg-verify"
          code_template: |
            By("Verifying LiveUpdateNADRef feature gate is enabled")
            kv, err := kubevirt.Client().KubeVirt(testsuite.GetTestNamespace(nil)).List(ctx, metav1.ListOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

        - step_id: "SETUP-02"
          action: "Create NADs and VM with secondary interface"
          command: "Create resources"
          validation: "VM is Running with secondary network"
          pattern_id: "vm-create-secondary-net"

      test_execution:
        - step_id: "TEST-01"
          action: "Change NAD reference on running VM"
          command: "Patch VM spec"
          validation: "Patch accepted"
          pattern_id: "vm-update-nad-ref"

        - step_id: "TEST-02"
          action: "Verify VM does not have RestartRequired condition"
          command: "Check VM conditions"
          validation: "No RestartRequired condition present"
          pattern_id: "vm-condition-check"
          code_template: |
            By("Verifying VM does not require restart")
            Consistently(func() bool {
                vm, err = kubevirt.Client().VirtualMachine(namespace).Get(ctx, vm.Name, metav1.GetOptions{})
                ExpectWithOffset(1, err).ToNot(HaveOccurred())
                for _, cond := range vm.Status.Conditions {
                    if cond.Type == v1.VirtualMachineRestartRequired && cond.Status == k8sv1.ConditionTrue {
                        return true
                    }
                }
                return false
            }, 30*time.Second, 5*time.Second).Should(BeFalse())

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM and NADs"
          command: "oc delete vm, net-attach-def resources"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "VM does not enter RestartRequired condition after NAD change"
        condition: "No RestartRequired condition with status True"
        failure_impact: "FG not properly preventing restart requirement - feature broken"

    dependencies:
      kubernetes_resources:
        - "KubeVirt: feature gate configuration"
        - "VirtualMachine: test VM"
      external_tools:
        - "oc 4.22+"
      scenario_specific_rbac:
        - "get on kubevirt"

