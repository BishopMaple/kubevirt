        priority: "P0"
        description: "VM enters RestartRequired condition after NAD change with FG disabled"
        condition: "RestartRequired condition status is True"
        failure_impact: "FG gating broken - NAD changes may apply without explicit enablement"

      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "No automatic migration triggered"
        condition: "Zero migrations found for VM"
        failure_impact: "Migration triggered without FG - unsafe behavior"

