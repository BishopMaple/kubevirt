      setup:
        - step_id: "SETUP-01"
          action: "Create source and target NADs with IPAM"
          command: "Create NADs with host-local IPAM"
          validation: "NADs created with IP assignment capability"
        - step_id: "SETUP-02"
          action: "Create VM with secondary interface on source NAD"
          command: "Create and start VM"
          validation: "VM running with IP on source network"
        - step_id: "SETUP-03"
          action: "Create peer VM on target network"
          command: "Create peer VM on target NAD"
          validation: "Peer VM running with IP on target network"

      test_execution:
        - step_id: "TEST-01"
          action: "Patch VM NAD reference from source to target"
          command: "Patch VM spec.template.spec.networks"
          validation: "Patch applied and migration triggered"
        - step_id: "TEST-02"
          action: "Wait for migration to complete"
          command: "Watch VMI migration state"
          validation: "Migration completes successfully"
        - step_id: "TEST-03"
          action: "Verify VM connectivity on new (target) network"
          command: "Ping from VM to peer VM on target network"
          validation: "Ping succeeds with 0% packet loss"
        - step_id: "TEST-04"
          action: "Verify VM unreachable on old (source) network"
          command: "Ping from source network to VM's old IP"
          validation: "Ping fails — VM no longer on source network"

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VMs and NADs"
          command: "Delete all test resources"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "VM can ping peer on new network after NAD swap"
        condition: "Ping from VM to peer on target network succeeds"
        failure_impact: "Feature non-functional — VM cannot communicate on new network"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "VM is unreachable on old network"
        condition: "Ping to VM's old IP on source network fails"
        failure_impact: "VM may be dual-homed, network transition incomplete"

    dependencies:
      kubernetes_resources:
