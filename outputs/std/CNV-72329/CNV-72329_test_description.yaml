          type: "NetworkAttachmentDefinition"
          yaml: |
            apiVersion: k8s.cni.cncf.io/v1
            kind: NetworkAttachmentDefinition
            metadata:
              name: source-nad
            spec:
              config: |
                {
                  "cniVersion": "0.3.1",
                  "name": "source-bridge",
                  "type": "bridge",
                  "bridge": "br-source",
                  "ipam": {"type": "host-local", "subnet": "10.100.0.0/24"}
                }
        - name: "target-nad-with-ipam"
          type: "NetworkAttachmentDefinition"
          yaml: |
            apiVersion: k8s.cni.cncf.io/v1
            kind: NetworkAttachmentDefinition
            metadata:
              name: target-nad
            spec:
              config: |
                {
                  "cniVersion": "0.3.1",
                  "name": "target-bridge",
                  "type": "bridge",
                  "bridge": "br-target",
                  "ipam": {"type": "host-local", "subnet": "10.200.0.0/24"}
                }

