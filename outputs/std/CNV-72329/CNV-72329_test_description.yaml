        condition: "post-migration MAC == original MAC"
        failure_impact: "Applications or licensing tied to MAC addresses break after NAD swap"

    dependencies:
      kubernetes_resources:
        - "NetworkAttachmentDefinition: nadA, nadB"
        - "VirtualMachine: test VM"
      external_tools:
