            ExpectWithOffset(1, err).ToNot(HaveOccurred())
        - step_id: "TEST-02"
          action: "Verify VM phase remains Running"
          validation: "VM phase is Running"
          code_template: |
            By("Verifying VM remains in Running phase")
            Consistently(func() v1.VirtualMachinePrintableStatus {
              vm, err = kubevirt.Client().VirtualMachine(namespace).Get(ctx, vm.Name, metav1.GetOptions{})
              ExpectWithOffset(1, err).ToNot(HaveOccurred())
              return vm.Status.PrintableStatus
            }, 30*time.Second, 5*time.Second).Should(Equal(v1.VirtualMachineStatusRunning))

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM and NADs"
          code_template: |
            By("Cleaning up VM and NADs")

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "VM phase stays Running during NAD change"
        condition: "VM status.printableStatus equals Running consistently"
        failure_impact: "VM downtime during NAD change — zero-downtime promise broken"

