        // Capture interface name and MAC before NAD swap
        // Perform NAD swap and wait for migration
        // Verify interface name and MAC are unchanged
      })

    test_objective:
      title: "Verify interface name and MAC preserved after NAD swap"
      what: |
        Validates that after a NAD reference live update and the resulting migration,
        the VM's secondary interface retains its original name and MAC address. This
        ensures the guest OS sees no interface identity change.
      why: |
        Interface name and MAC preservation is critical for guest OS stability. Many
        applications and network configurations rely on consistent interface naming
        and MAC addresses. If these change, guest networking can break.
      acceptance_criteria:
        - "Interface name is identical before and after NAD swap"
        - "MAC address is identical before and after NAD swap"
        - "Guest OS sees no interface change"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Ginkgo with kubevirt test framework"

    specific_preconditions:
      - name: "Running VM with known interface state"
        requirement: "VM with secondary interface whose name and MAC are recorded before test"
        validation: "VMI status.interfaces shows secondary interface"

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create source and target NADs, create VM with secondary interface"
          command: "Setup same as scenario 001"
          validation: "VM Running"
        - step_id: "SETUP-02"
          action: "Record interface name and MAC of secondary interface"
          command: "Read VMI status.interfaces[1].name and status.interfaces[1].mac"
          validation: "Values captured"
          code_template: |
            originalIfaceName = vmi.Status.Interfaces[1].Name
            originalMAC = vmi.Status.Interfaces[1].MAC
      test_execution:
        - step_id: "TEST-01"
          action: "Patch NAD reference and wait for migration"
          command: "Patch VM, wait for migration completion"
          validation: "Migration succeeded"
        - step_id: "TEST-02"
          action: "Verify interface name is preserved"
          command: "Compare current VMI status.interfaces[1].name with original"
          validation: "Names match"
          code_template: |
            updatedVMI, err = kubevirt.Client().VirtualMachineInstance(namespace).Get(ctx, vmi.Name, metav1.GetOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            Expect(updatedVMI.Status.Interfaces[1].Name).To(Equal(originalIfaceName))
        - step_id: "TEST-03"
          action: "Verify MAC address is preserved"
