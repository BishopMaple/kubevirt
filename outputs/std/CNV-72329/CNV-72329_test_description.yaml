---
scenarios:
  # ============================================================================
  # Requirement: CNV-72329 — NAD reference can be changed on a running VM
  # ============================================================================

  - scenario_id: "1"
    test_id: "TS-CNV-72329-001"
    tier: "Tier 2"
    priority: "P0"
    mvp: true
    requirement_id: "CNV-72329"

    patterns:
      primary: "migration-connectivity"
      secondary:
        - "bridge-nad-setup"
        - "vm-create-with-multus"
        - "patch-nad-reference"
        - "wait-migration-condition"
        - "verify-connectivity"
      helpers_required:
        - name: "libnet"
          functions: ["NewBridgeNetAttachDef", "CreateNetAttachDef", "PingFromVMConsole"]
          purpose: "NAD creation and network connectivity verification"
        - name: "libvmifact"
          functions: ["NewAlpineWithTestTooling"]
          purpose: "VM creation with test tooling"
        - name: "libvmi"
          functions: ["NewVirtualMachine", "WithRunStrategy", "InterfaceDeviceWithBridgeBinding", "MultusNetwork", "WithCloudInitNoCloud", "WithName", "WithNodeAffinityFor"]
          purpose: "VM/VMI spec construction"
        - name: "console"
          functions: ["LoginToAlpine"]
          purpose: "Guest console access"
        - name: "config"
          functions: ["EnableFeatureGate", "RegisterKubevirtConfigChange", "WithWorkloadUpdateStrategy", "WithVMRolloutStrategy", "WaitForConfigToBePropagatedToComponent"]
          purpose: "Feature gate and cluster config management"
        - name: "patch"
          functions: ["New", "WithReplace", "WithRemove"]
          purpose: "JSON patch generation for VM spec updates"
      decorators:
        - "decorators.SigNetwork"
        - "decorators.RequiresTwoSchedulableNodes"
        - "Serial"

    variables:
      closure_scope:
        - name: "ctx"
          type: "context.Context"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It", "AfterEach"]
          comment: "Context for K8s API calls"
        - name: "testNamespace"
          type: "string"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It", "AfterEach"]
          comment: "Test namespace"
        - name: "err"
          type: "error"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It", "AfterEach"]
          comment: "Error variable for API calls"
        - name: "vm"
          type: "*v1.VirtualMachine"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It"]
          comment: "VM under test with secondary NAD"
        - name: "sourceNAD"
          type: "string"
          initialized_in: "const"
          used_in: ["BeforeAll"]
          comment: "Source bridge NAD name"
        - name: "targetNAD"
          type: "string"
          initialized_in: "const"
          used_in: ["It"]
          comment: "Target bridge NAD name"

    test_structure:
      type: "single"
      describe:
        wrapper: "SIG"
        description: "NAD name live update"
        decorators:
          - "decorators.SigNetwork"
          - "decorators.RequiresTwoSchedulableNodes"
          - "Serial"
      context:
        description: "NAD reference change on running VM triggers live migration"
        decorators:
          - "Ordered"
      it:
        description: "should trigger live migration and establish connectivity on the target network"
        test_id_format: "[test_id:TS-CNV-72329-001]"

    code_structure: |
      Context("NAD reference change on running VM triggers live migration", Ordered, func() {
        BeforeAll(func() {
          // Enable LiveUpdateNADRef FG, set LiveUpdate rollout + LiveMigrate workload update
          // Create source NAD (br-1) and target NAD (br-2)
          // Create static VMI on source NAD for pre-swap connectivity
          // Create VM with secondary interface on source NAD, start it
          // Verify pre-swap connectivity via ping
        })
        It("[test_id:TS-CNV-72329-001]should trigger live migration and establish connectivity on the target network", func() {
          // Patch VM spec to change NAD reference from source to target
          // Wait for MigrationRequired condition to appear
          // Wait for migration to complete (condition clears)
          // Create static VMI on target NAD on the post-migration node
          // Configure IP in guest on new network
          // Verify ping from static VMI to migrated VM on target network
        })
      })

    test_objective:
      title: "Verify NAD reference change on running VM triggers live migration"
      what: |
        This test validates that changing the NAD reference on a running VM's secondary
        network interface triggers an automatic live migration. After the migration completes,
        the VM establishes connectivity on the new target network. The test creates two
        bridge-based NADs with distinct subnets, starts a VM on the source NAD, patches
        the VM spec to reference the target NAD, and verifies the complete migration-to-connectivity
        workflow.
      why: |
        This is the core use case for the NAD reference live update feature. Customers need
        to switch VM network attachments (e.g., VLAN changes) without VM downtime. Failure
        means VMs cannot dynamically change networks, requiring manual restart—negating the
        feature's primary value proposition.
      acceptance_criteria:
        - "VM spec patch to change NAD reference succeeds without error"
        - "MigrationRequired condition appears on VMI after NAD reference change"
        - "Live migration completes automatically and MigrationRequired condition clears"
        - "VM can ping a peer on the target network after migration"

    classification:
      test_type: "E2E"
      scope: "Multi-component"
      automation_approach: "pytest with python-wrapper"

    specific_preconditions:
      - name: "LiveUpdateNADRef feature gate"
        requirement: "Feature gate enabled in KubeVirt config"
        validation: "oc get kubevirt -n openshift-cnv -o jsonpath='{.items[0].spec.configuration.developerConfiguration.featureGates}'"
      - name: "LiveUpdate rollout strategy"
        requirement: "VM rollout strategy set to LiveUpdate with LiveMigrate workload update"
        validation: "oc get kubevirt -n openshift-cnv -o jsonpath='{.items[0].spec.configuration.vmRolloutStrategy}'"
      - name: "Two bridge-based NADs"
        requirement: "Source NAD (br-1, subnet 10.1.1.0/24) and target NAD (br-2, subnet 10.1.2.0/24)"
        validation: "oc get net-attach-def -n test-namespace"

    test_data:
      resource_definitions:
        - name: "source-nad"
          type: "NetworkAttachmentDefinition"
          yaml: |
            apiVersion: k8s.cni.cncf.io/v1
            kind: NetworkAttachmentDefinition
            metadata:
              name: nad-1
            spec:
              config: '{"cniVersion":"0.3.1","name":"br-1","type":"bridge","bridge":"br-1","ipam":{}}'

        - name: "target-nad"
          type: "NetworkAttachmentDefinition"
          yaml: |
            apiVersion: k8s.cni.cncf.io/v1
            kind: NetworkAttachmentDefinition
            metadata:
              name: nad-2
            spec:
              config: '{"cniVersion":"0.3.1","name":"br-2","type":"bridge","bridge":"br-2","ipam":{}}'

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Enable LiveUpdateNADRef feature gate and configure cluster"
          command: "config.EnableFeatureGate('LiveUpdateNADRef'); config.RegisterKubevirtConfigChange(...)"
          validation: "Feature gate enabled, rollout strategy set to LiveUpdate"
          pattern_id: "config-feature-gate"
          code_template: |
            config.EnableFeatureGate("LiveUpdateNADRef")
            updateStrategy = &v1.KubeVirtWorkloadUpdateStrategy{
                WorkloadUpdateMethods: []v1.WorkloadUpdateMethod{v1.WorkloadUpdateMethodLiveMigrate},
            }
            rolloutStrategy = pointer.P(v1.VMRolloutStrategyLiveUpdate)
            err = config.RegisterKubevirtConfigChange(
                config.WithWorkloadUpdateStrategy(updateStrategy),
                config.WithVMRolloutStrategy(rolloutStrategy),
            )
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

        - step_id: "SETUP-02"
          action: "Create source and target bridge-based NADs"
          command: "libnet.NewBridgeNetAttachDef + libnet.CreateNetAttachDef"
          validation: "Both NADs created successfully"
          pattern_id: "bridge-nad-setup"
          code_template: |
            netAttachDef1 = libnet.NewBridgeNetAttachDef(sourceNAD, "br-1")
            _, err = libnet.CreateNetAttachDef(ctx, testNamespace, netAttachDef1)
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            netAttachDef2 = libnet.NewBridgeNetAttachDef(targetNAD, "br-2")
            _, err = libnet.CreateNetAttachDef(ctx, testNamespace, netAttachDef2)
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

        - step_id: "SETUP-03"
          action: "Create and start VM with secondary interface on source NAD"
          command: "libvmifact.NewAlpineWithTestTooling + libvmi.NewVirtualMachine + Create"
          validation: "VM running and guest agent connected"
          pattern_id: "vm-create-with-multus"
          code_template: |
            vmi = libvmifact.NewAlpineWithTestTooling(
                libvmi.WithName(vmName),
                libvmi.WithInterface(libvmi.InterfaceDeviceWithBridgeBinding("net1")),
                libvmi.WithNetwork(libvmi.MultusNetwork("net1", sourceNAD)),
                libvmi.WithCloudInitNoCloud(libvmici.WithNoCloudNetworkData(networkData)),
            )
            vm = libvmi.NewVirtualMachine(vmi, libvmi.WithRunStrategy(v1.RunStrategyAlways))
            vm, err = kubevirt.Client().VirtualMachine(testNamespace).Create(ctx, vm, metav1.CreateOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            Eventually(matcher.ThisVM(vm)).WithTimeout(timeoutInterval).WithPolling(pollingInterval).
                Should(matcher.HaveConditionTrue(v1.VirtualMachineInstanceAgentConnected))

      test_execution:
        - step_id: "TEST-01"
          action: "Patch VM spec to change NAD reference from source to target"
          command: "patch.WithReplace('/spec/template/spec/networks/0/multus/networkName', targetNAD)"
          validation: "Patch applied successfully"
          pattern_id: "patch-nad-reference"
          code_template: |
            patchData, err = patch.New(
                patch.WithReplace("/spec/template/spec/networks/0/multus/networkName", targetNAD),
            ).GeneratePayload()
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            _, err = kubevirt.Client().VirtualMachine(testNamespace).Patch(
                ctx, vmName, types.JSONPatchType, patchData, metav1.PatchOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

        - step_id: "TEST-02"
          action: "Wait for MigrationRequired condition to appear then clear"
          command: "Eventually(matcher.ThisVMI).Should(matcher.HaveConditionTrue(MigrationRequired))"
          validation: "Migration triggered and completed"
          pattern_id: "wait-migration-condition"
          code_template: |
            By("Waiting for migration condition to appear")
            Eventually(matcher.ThisVMI(vmi), timeoutInterval, pollingInterval).
                Should(matcher.HaveConditionTrue(v1.VirtualMachineInstanceMigrationRequired))
            By("Waiting for migration to complete")
            Eventually(matcher.ThisVMI(vmi), timeoutInterval, pollingInterval).
                Should(matcher.HaveConditionMissingOrFalse(v1.VirtualMachineInstanceMigrationRequired))

        - step_id: "TEST-03"
          action: "Verify connectivity to peer VM on target network"
          command: "libnet.PingFromVMConsole(staticVMI2, ipAfterChange)"
          validation: "Ping succeeds with 0% packet loss"
          pattern_id: "verify-connectivity"
          code_template: |
            By("Verifying connectivity on target network")
            ExpectWithOffset(1, libnet.PingFromVMConsole(staticVMI2, ipAfterChange)).To(Succeed())

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM and NADs"
          code_template: |
            By("Deleting VM")
            err = kubevirt.Client().VirtualMachine(testNamespace).Delete(ctx, vmName, metav1.DeleteOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "NAD reference patch succeeds"
        condition: "VM spec patch returns no error"
        failure_impact: "Feature fundamentally broken — cannot change NAD reference"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Live migration triggered automatically"
        condition: "MigrationRequired condition appears on VMI"
        failure_impact: "NAD change not detected by migration evaluator"
      - assertion_id: "ASSERT-03"
        priority: "P0"
        description: "Migration completes and condition clears"
        condition: "MigrationRequired condition is missing or false after migration"
        failure_impact: "Migration stuck or never completes"
      - assertion_id: "ASSERT-04"
        priority: "P0"
        description: "Connectivity established on target network"
        condition: "Ping from peer VMI on target network succeeds"
        failure_impact: "VM migrated but not connected to new network"

    dependencies:
      kubernetes_resources:
        - "NetworkAttachmentDefinition: nad-1 (source)"
        - "NetworkAttachmentDefinition: nad-2 (target)"
        - "VirtualMachine: migrating-vm"
        - "VirtualMachineInstance: static-vmi-1 (pre-swap peer)"
        - "VirtualMachineInstance: static-vmi-2 (post-swap peer)"
      external_tools:
        - "Bridge CNI plugin"
      scenario_specific_rbac:
        - "patch on virtualmachines"

  # --------------------------------------------------------------------------

  - scenario_id: "2"
    test_id: "TS-CNV-72329-002"
    tier: "Tier 2"
    priority: "P0"
    mvp: true
    requirement_id: "CNV-72329"

    patterns:
      primary: "migration-connectivity"
      secondary:
        - "bridge-nad-setup"
        - "vm-create-with-multus"
        - "patch-nad-reference"
        - "verify-connectivity"
      helpers_required:
        - name: "libnet"
          functions: ["NewBridgeNetAttachDef", "CreateNetAttachDef", "PingFromVMConsole"]
          purpose: "NAD creation and connectivity verification"
        - name: "libvmifact"
          functions: ["NewAlpineWithTestTooling"]
          purpose: "VM creation"
        - name: "console"
          functions: ["LoginToAlpine"]
          purpose: "Guest console access"
      decorators:
        - "decorators.SigNetwork"
        - "decorators.RequiresTwoSchedulableNodes"
        - "Serial"

    variables:
      closure_scope:
        - name: "ctx"
          type: "context.Context"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It"]
          comment: "Context for K8s API calls"
        - name: "testNamespace"
          type: "string"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It"]
          comment: "Test namespace"
        - name: "err"
          type: "error"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It"]
          comment: "Error variable"
        - name: "vm"
          type: "*v1.VirtualMachine"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It"]
          comment: "VM under test"

    test_structure:
      type: "single"
      describe:
        wrapper: "SIG"
        description: "NAD name live update"
        decorators:
          - "decorators.SigNetwork"
          - "decorators.RequiresTwoSchedulableNodes"
          - "Serial"
      context:
        description: "VM connectivity on new network after NAD swap"
        decorators:
          - "Ordered"
      it:
        description: "should establish network connectivity on the new network after NAD swap and migration"
        test_id_format: "[test_id:TS-CNV-72329-002]"

    code_structure: |
      Context("VM connectivity on new network after NAD swap", Ordered, func() {
        BeforeAll(func() {
          // Setup cluster config, NADs, VM with source NAD
        })
        It("[test_id:TS-CNV-72329-002]should establish network connectivity on the new network after NAD swap and migration", func() {
          // Patch NAD reference, wait for migration, verify connectivity on new network
        })
      })

    test_objective:
      title: "Verify VM connectivity on new network after NAD swap"
      what: |
        This test validates that after a NAD reference change and subsequent live migration,
        the VM can communicate with peers on the new target network. It verifies end-to-end
        network connectivity by creating a peer VMI on the target network and performing
        ICMP ping validation.
      why: |
        Connectivity is the ultimate validation of a successful NAD swap. Without verifying
        that the VM can actually communicate on the new network, a "successful" migration
        could still leave the VM in a broken network state.
      acceptance_criteria:
        - "VM successfully migrates to target network"
        - "Ping from VM to peer on target network succeeds"
        - "Guest networking is functional on the new bridge"

    classification:
      test_type: "E2E"
      scope: "Multi-component"
      automation_approach: "pytest with python-wrapper"

    specific_preconditions:
      - name: "LiveUpdateNADRef feature gate"
        requirement: "Enabled"
        validation: "Feature gate active in KubeVirt config"
      - name: "Two bridge-based NADs"
        requirement: "Source and target NADs with distinct subnets"
        validation: "NADs created in test namespace"

    test_data:
      resource_definitions:
        - name: "peer-vmi"
          type: "VirtualMachineInstance"
          yaml: |
            apiVersion: kubevirt.io/v1
            kind: VirtualMachineInstance
            metadata:
              name: static-vmi-target
            spec:
              domain:
                devices:
                  interfaces:
                    - name: net1
                      bridge: {}
              networks:
                - name: net1
                  multus:
                    networkName: nad-2

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Enable feature gate and configure cluster for live update"
          command: "config.EnableFeatureGate('LiveUpdateNADRef')"
          validation: "Cluster configured"
          pattern_id: "config-feature-gate"
        - step_id: "SETUP-02"
          action: "Create source and target NADs with distinct subnets"
          command: "libnet.NewBridgeNetAttachDef + libnet.CreateNetAttachDef"
          validation: "NADs created"
          pattern_id: "bridge-nad-setup"
        - step_id: "SETUP-03"
          action: "Create VM with source NAD and start it"
          command: "libvmifact.NewAlpineWithTestTooling + Create"
          validation: "VM running with agent connected"
          pattern_id: "vm-create-with-multus"

      test_execution:
        - step_id: "TEST-01"
          action: "Patch VM to change NAD reference to target"
          command: "patch.WithReplace networkName"
          validation: "Patch succeeds"
          pattern_id: "patch-nad-reference"
        - step_id: "TEST-02"
          action: "Wait for migration to complete"
          command: "Eventually MigrationRequired condition appears then clears"
          validation: "Migration completes"
          pattern_id: "wait-migration-condition"
        - step_id: "TEST-03"
          action: "Create peer VMI on target network and verify ping"
          command: "libnet.PingFromVMConsole(peerVMI, vmIP)"
          validation: "Ping succeeds with 0% packet loss"
          pattern_id: "verify-connectivity"
          code_template: |
            By("Creating peer VMI on target network")
            staticVMI2, err = kubevirt.Client().VirtualMachineInstance(testNamespace).
                Create(ctx, staticVMI2, metav1.CreateOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            By("Verifying connectivity")
            ExpectWithOffset(1, libnet.PingFromVMConsole(staticVMI2, ipAfterChange)).To(Succeed())

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM and NADs"
          code_template: |
            err = kubevirt.Client().VirtualMachine(testNamespace).Delete(ctx, vm.Name, metav1.DeleteOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Ping to peer VM on target network succeeds"
        condition: "ICMP ping from peer VMI to migrated VM returns 0% packet loss"
        failure_impact: "VM migrated but network connectivity broken on new network"

    dependencies:
      kubernetes_resources:
