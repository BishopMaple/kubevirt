          // Patch VM NAD reference
          // Verify VMIM object created
          // Verify migration completes successfully
        })
      }

    test_objective:
      title: "Verify migration triggered after NAD change"
      what: |
        This test validates that changing the NAD reference on a running VM automatically
        triggers a VirtualMachineInstanceMigration (VMIM). The migration is the mechanism
        by which the new network attachment takes effect on the target node.
      why: |
        Live migration is the core mechanism for applying NAD changes. Without migration,
        the NAD change would only be reflected in the spec but not in the actual network
        configuration of the running VMI.
      acceptance_criteria:
        - "VMIM object is created after NAD reference change"
        - "Migration completes successfully"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Ginkgo with kubevirt test framework"

    specific_preconditions: []
