      why: |
        Race conditions between concurrent NAD changes and migrations could leave the
        VM in an inconsistent state. The system must handle this edge case safely.
      acceptance_criteria:
        - "Second NAD change during migration is handled gracefully"
        - "VM is not left in an inconsistent state"

