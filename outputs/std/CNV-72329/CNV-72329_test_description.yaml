    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create NADs and running VM"
          validation: "VM running with secondary interface"
          code_template: |
            By("Setting up NADs and running VM")
      test_execution:
        - step_id: "TEST-01"
          action: "Patch VM NAD reference"
          validation: "Patch accepted"
          code_template: |
            By("Patching VM NAD reference to target NAD")
            patchData := fmt.Sprintf(`[{"op": "replace", "path": "/spec/template/spec/networks/1/multus/networkName", "value": "%s"}]`, targetNAD.Name)
            vm, err = kubevirt.Client().VirtualMachine(namespace).Patch(ctx, vm.Name, types.JSONPatchType, []byte(patchData), metav1.PatchOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
        - step_id: "TEST-02"
          action: "Verify migration object created"
          validation: "VMIM exists for the VM"
          code_template: |
            By("Verifying migration is triggered")
            Eventually(func() bool {
              migrations, err = kubevirt.Client().VirtualMachineInstanceMigration(namespace).List(ctx, metav1.ListOptions{})
              ExpectWithOffset(1, err).ToNot(HaveOccurred())
              for _, mig := range migrations.Items {
                if mig.Spec.VMIName == vm.Name {
                  return true
                }
              }
              return false
            }, 60*time.Second, 5*time.Second).Should(BeTrue())
        - step_id: "TEST-03"
          action: "Wait for migration to complete"
          validation: "Migration succeeded"
          code_template: |
            By("Waiting for migration to complete")
            Eventually(func() v1.VirtualMachineInstanceMigrationPhase {
              migration, err = getMigrationForVM(ctx, namespace, vm.Name)
              ExpectWithOffset(1, err).ToNot(HaveOccurred())
              return migration.Status.Phase
            }, MigrationWaitTime, 5*time.Second).Should(Equal(v1.MigrationSucceeded))
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM and NADs"
          code_template: |
            By("Cleaning up")

