      resource_definitions: []
      api_endpoints: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Ensure LiveUpdateNADRef FG is disabled"
          command: "Check/modify KubeVirt configuration"
          validation: "FG is not enabled"
          pattern_id: "fg-disable"

        - step_id: "SETUP-02"
          action: "Create NADs and VM with secondary interface"
          command: "Create resources"
          validation: "VM is Running"
          pattern_id: "vm-create-secondary-net"

      test_execution:
        - step_id: "TEST-01"
          action: "Change NAD reference on running VM"
          command: "Patch VM spec"
          validation: "Patch accepted"
          pattern_id: "vm-update-nad-ref"

        - step_id: "TEST-02"
          action: "Verify VM has RestartRequired condition"
          command: "Check VM conditions"
          validation: "RestartRequired condition is True"
          pattern_id: "vm-condition-check"
          code_template: |
            By("Verifying VM requires restart")
            Eventually(func() bool {
                vm, err = kubevirt.Client().VirtualMachine(namespace).Get(ctx, vm.Name, metav1.GetOptions{})
                ExpectWithOffset(1, err).ToNot(HaveOccurred())
                for _, cond := range vm.Status.Conditions {
                    if cond.Type == v1.VirtualMachineRestartRequired && cond.Status == k8sv1.ConditionTrue {
                        return true
                    }
                }
                return false
            }, 30*time.Second, 5*time.Second).Should(BeTrue())

        - step_id: "TEST-03"
          action: "Verify no automatic migration is triggered"
          command: "List migrations for VM"
          validation: "No migrations found"
          pattern_id: "no-migration-verify"
          code_template: |
            By("Verifying no automatic migration was triggered")
            Consistently(func() int {
                migrations, err := kubevirt.Client().VirtualMachineInstanceMigration(namespace).List(ctx, metav1.ListOptions{})
                ExpectWithOffset(1, err).ToNot(HaveOccurred())
                count := 0
                for _, m := range migrations.Items {
                    if m.Spec.VMIName == vm.Name {
                        count++
                    }
                }
                return count
            }, 30*time.Second, 5*time.Second).Should(Equal(0))

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM and NADs"
          command: "oc delete resources"

