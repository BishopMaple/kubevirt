          def test_complete_vlan_change_workflow(self):
              """
              Test complete user workflow: VLAN-A to VLAN-B migration with connectivity validation.

              Steps:
                  1. Verify VM has connectivity on VLAN-A
                  2. Update VM spec to change NAD reference from VLAN-A to VLAN-B
                  3. Wait for live migration to complete
                  4. Verify VM has connectivity on VLAN-B
                  5. Verify VM does NOT have connectivity on VLAN-A

              Expected:
                  - VM connects to VLAN-B and is isolated from VLAN-A after NAD swap
              """

    test_objective:
      title: "Verify complete user workflow: create VM on VLAN-A NAD, update to VLAN-B NAD, verify migration, verify connectivity on VLAN-B, verify no connectivity on VLAN-A"
      what: |
