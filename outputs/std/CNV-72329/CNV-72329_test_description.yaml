            ExpectWithOffset(1, err).ToNot(HaveOccurred())
        - step_id: "TEST-02"
          action: "Verify MigrationRequired condition appears on VMI"
          command: "Eventually matcher.ThisVMI should HaveConditionTrue(MigrationRequired)"
          validation: "MigrationRequired condition is True"
          pattern_id: "wait-migration-condition"
          code_template: |
            By("Verifying MigrationRequired condition appears")
            Eventually(matcher.ThisVMI(vmi), timeoutInterval, pollingInterval).
                Should(matcher.HaveConditionTrue(v1.VirtualMachineInstanceMigrationRequired))

