        requirement: "Source and target NADs must have IPAM configured to assign IPs"
        validation: "NAD config includes IPAM section"
      - name: "Peer VM on target network"
        requirement: "A second VM or pod on the target network to verify connectivity"
        validation: "Peer VM running on target network"

