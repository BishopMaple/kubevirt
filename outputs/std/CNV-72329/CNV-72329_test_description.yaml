---
scenarios:
  # ============================================================
  # Scenario 1: NAD reference update on running VM without restart
  # Tier 1, P0 — Core feature validation
  # ============================================================
  - scenario_id: "1"
    test_id: "TS-CNV-72329-001"
    tier: "Tier 1"
    priority: "P0"
    mvp: true
    requirement_id: "CNV-72329"

    patterns:
      primary: "nad-live-update"
      secondary:
        - "vm-creation-with-secondary-network"
        - "nad-patch-operation"
        - "condition-validation"
      helpers_required:
        - name: "libvmifact"
          functions: ["NewFedora"]
          purpose: "Create Fedora VMI with secondary network interface"
        - name: "libnet"
          functions: ["NewBridgeNetAttachDef", "InterfaceDeviceWithBridgeBinding"]
          purpose: "Create bridge-based NADs and configure bridge binding"
        - name: "libwait"
          functions: ["WaitUntilVMIReady"]
          purpose: "Wait for VMI to reach Ready state"
        - name: "libvmops"
          functions: ["StartVirtualMachine"]
          purpose: "Start VM and wait for running state"
      decorators:
        - "decorators.SigNetwork"
        - "Serial"

    variables:
      closure_scope:
        - name: "ctx"
          type: "context.Context"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It", "AfterEach"]
          comment: "Context for K8s API calls"
        - name: "namespace"
          type: "string"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It", "AfterEach"]
          comment: "Test namespace"
        - name: "err"
          type: "error"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It", "AfterEach"]
          comment: "Error variable for API calls"
        - name: "vm"
          type: "*v1.VirtualMachine"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It", "AfterEach"]
          comment: "Virtual machine with secondary network interface"
        - name: "sourceNAD"
          type: "*networkv1.NetworkAttachmentDefinition"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "AfterEach"]
          comment: "Source bridge-based NAD"
        - name: "targetNAD"
          type: "*networkv1.NetworkAttachmentDefinition"
          initialized_in: "BeforeAll"
          used_in: ["It", "AfterEach"]
          comment: "Target bridge-based NAD for swap"

    test_structure:
      type: "single"
      describe:
        wrapper: "SIG"
        description: "Live Update NAD Reference"
        decorators:
          - "decorators.SigNetwork"
          - "Serial"
      context:
        description: "NAD reference update on running VM without restart"
        decorators:
          - "Ordered"
          - "decorators.OncePerOrderedCleanup"
      it:
        description: "should update NAD reference without requiring VM restart"
        test_id_format: "[test_id:TS-CNV-72329-001]"

    code_structure: |
      SIG("Live Update NAD Reference", decorators.SigNetwork, Serial, func() {
        Context("NAD reference update on running VM without restart", Ordered, decorators.OncePerOrderedCleanup, func() {
          var ctx context.Context
          var namespace string
          var err error
          var vm *v1.VirtualMachine
          var sourceNAD, targetNAD *networkv1.NetworkAttachmentDefinition
          BeforeAll(func() {
            ctx = context.Background()
            namespace = testsuite.GetTestNamespace(nil)
            // Create source and target NADs
            // Create VM with secondary interface attached to source NAD
            // Start VM and wait for running
          })
          It("[test_id:TS-CNV-72329-001]should update NAD reference without requiring VM restart", func() {
            // Patch VM to change NAD reference from source to target
            // Verify VM remains running (not restarted)
            // Verify RestartRequired condition is NOT set
          })
        })
      })

    test_objective:
      title: "Verify NAD reference update on running VM without restart"
      what: |
        This test validates that the NAD reference on a running VM's secondary network
        interface can be changed without requiring a VM restart. A VM is created with a
        bridge-based secondary interface, started, and then the NAD reference is patched
        to point to a different NAD. The test verifies the VM remains running throughout
        and no RestartRequired condition is set.
      why: |
        This is the core P0 functionality of the LiveUpdateNADRef feature. Customers need
        to change network segments (e.g., VLAN reassignment) without VM downtime. If this
        fails, the entire feature is broken and VMs would require restart for network changes.
      acceptance_criteria:
        - "VM remains in Running phase after NAD reference is patched"
        - "RestartRequired condition is NOT set on the VM after NAD change"
        - "VM spec.template.spec.networks[].multus.networkName reflects the new NAD"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Ginkgo e2e with kubevirt test framework"

    specific_preconditions:
      - name: "Source bridge NAD"
        requirement: "Bridge-based NAD on bridge-a"
        validation: "oc get net-attach-def source-nad -n test-ns"
      - name: "Target bridge NAD"
        requirement: "Bridge-based NAD on bridge-b (different bridge)"
        validation: "oc get net-attach-def target-nad -n test-ns"
      - name: "VM rollout strategy"
        requirement: "VM spec.updateStrategy.type set to LiveUpdate"
        validation: "VM spec check"

    test_data:
      resource_definitions:
        - name: "source-nad"
          type: "NetworkAttachmentDefinition"
          yaml: |
            apiVersion: k8s.cni.cncf.io/v1
            kind: NetworkAttachmentDefinition
            metadata:
              name: source-nad
            spec:
              config: |
                {
                  "cniVersion": "0.3.1",
                  "name": "source-bridge",
                  "type": "bridge",
                  "bridge": "br-source",
                  "ipam": {}
                }
        - name: "target-nad"
          type: "NetworkAttachmentDefinition"
          yaml: |
            apiVersion: k8s.cni.cncf.io/v1
            kind: NetworkAttachmentDefinition
            metadata:
              name: target-nad
            spec:
              config: |
                {
                  "cniVersion": "0.3.1",
                  "name": "target-bridge",
                  "type": "bridge",
                  "bridge": "br-target",
                  "ipam": {}
                }

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create source bridge-based NAD"
          command: "libnet.NewBridgeNetAttachDef(namespace, 'source-nad', 'br-source')"
          validation: "NAD created successfully"
          pattern_id: "nad-bridge-create"
          code_template: |
            By("Creating source bridge NAD")
            sourceNAD, err = libnet.CreateBridgeNetworkAttachmentDefinition(ctx, namespace, "source-nad", "br-source")
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

        - step_id: "SETUP-02"
          action: "Create target bridge-based NAD"
          command: "libnet.NewBridgeNetAttachDef(namespace, 'target-nad', 'br-target')"
          validation: "NAD created successfully"
          pattern_id: "nad-bridge-create"
          code_template: |
            By("Creating target bridge NAD")
            targetNAD, err = libnet.CreateBridgeNetworkAttachmentDefinition(ctx, namespace, "target-nad", "br-target")
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

        - step_id: "SETUP-03"
          action: "Create VM with secondary interface attached to source NAD"
          command: "Create Fedora VM with bridge binding to source-nad"
          validation: "VM created with secondary network interface"
          pattern_id: "vm-with-secondary-network"
          code_template: |
            By("Creating VM with secondary interface on source NAD")
            vmi = libvmifact.NewFedora(
                libvmi.WithInterface(libvmi.InterfaceDeviceWithBridgeBinding("secondary")),
                libvmi.WithNetwork(libvmi.MultusNetwork("secondary", "source-nad")),
            )
            vm = libvmi.NewVirtualMachine(vmi, libvmi.WithRunning())
            vm, err = kubevirt.Client().VirtualMachine(namespace).Create(ctx, vm, metav1.CreateOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

        - step_id: "SETUP-04"
          action: "Wait for VM to be running"
          command: "libwait.WaitUntilVMIReady"
          validation: "VMI is in Running phase"
          pattern_id: "vm-wait-ready"
          code_template: |
            By("Waiting for VMI to be ready")
            vmi = libwait.WaitUntilVMIReady(vmi, console.LoginToFedora)

      test_execution:
        - step_id: "TEST-01"
          action: "Patch VM to change NAD reference from source-nad to target-nad"
          command: "kubectl patch vm --type=merge -p spec.template.spec.networks"
          validation: "Patch applied successfully"
          pattern_id: "vm-patch-nad-reference"
          code_template: |
            By("Patching VM to change NAD reference to target NAD")
            patchData := fmt.Sprintf(`{"spec":{"template":{"spec":{"networks":[{"name":"secondary","multus":{"networkName":"%s"}}]}}}}`, targetNAD.Name)
            vm, err = kubevirt.Client().VirtualMachine(namespace).Patch(ctx, vm.Name, types.MergePatchType, []byte(patchData), metav1.PatchOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

        - step_id: "TEST-02"
          action: "Verify VM remains running (not restarted)"
          command: "Check VM status phase"
          validation: "VM phase is Running"
          pattern_id: "vm-status-check"
          code_template: |
            By("Verifying VM remains running")
            Eventually(func() v1.VirtualMachinePrintableStatus {
                vm, err = kubevirt.Client().VirtualMachine(namespace).Get(ctx, vm.Name, metav1.GetOptions{})
                ExpectWithOffset(1, err).ToNot(HaveOccurred())
                return vm.Status.PrintableStatus
            }, 30*time.Second, time.Second).Should(Equal(v1.VirtualMachineStatusRunning))

        - step_id: "TEST-03"
          action: "Verify RestartRequired condition is NOT set"
          command: "Check VM conditions for RestartRequired"
          validation: "No RestartRequired condition present"
          pattern_id: "condition-absence-check"
          code_template: |
            By("Verifying RestartRequired condition is not set")
            vm, err = kubevirt.Client().VirtualMachine(namespace).Get(ctx, vm.Name, metav1.GetOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            for _, condition := range vm.Status.Conditions {
                ExpectWithOffset(1, condition.Type).ToNot(Equal(v1.VirtualMachineRestartRequired))
            }

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM"
          command: "kubevirt.Client().VirtualMachine(namespace).Delete(ctx, vm.Name, metav1.DeleteOptions{})"
          code_template: |
            By("Deleting VM")
            err = kubevirt.Client().VirtualMachine(namespace).Delete(ctx, vm.Name, metav1.DeleteOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
        - step_id: "CLEANUP-02"
          action: "Delete source and target NADs"
          command: "Delete NADs"
          code_template: |
            By("Deleting NADs")
            err = kubevirt.Client().NetworkClient().NetworkAttachmentDefinitions(namespace).Delete(ctx, sourceNAD.Name, metav1.DeleteOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            err = kubevirt.Client().NetworkClient().NetworkAttachmentDefinitions(namespace).Delete(ctx, targetNAD.Name, metav1.DeleteOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "VM remains in Running phase after NAD patch"
        condition: "vm.Status.PrintableStatus == VirtualMachineStatusRunning"
        failure_impact: "Core feature broken — NAD change causes VM disruption"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "RestartRequired condition is not present"
        condition: "No condition with type VirtualMachineRestartRequired exists"
        failure_impact: "Feature incorrectly requires restart instead of live migration"
      - assertion_id: "ASSERT-03"
        priority: "P1"
        description: "VM spec reflects updated NAD reference"
        condition: "vm.spec.template.spec.networks[].multus.networkName == target-nad"
        failure_impact: "NAD patch not persisted correctly"

    dependencies:
      kubernetes_resources:
        - "NetworkAttachmentDefinition: source-nad"
        - "NetworkAttachmentDefinition: target-nad"
        - "VirtualMachine: test VM with secondary interface"
      external_tools:
        - "virtctl 1.0+"
      scenario_specific_rbac:
        - "patch on virtualmachines in test namespace"

  # ============================================================
  # Scenario 2: Auto-migration triggered after NAD reference change
  # Tier 1, P0 — Migration trigger validation
  # ============================================================
  - scenario_id: "2"
    test_id: "TS-CNV-72329-002"
    tier: "Tier 1"
    priority: "P0"
    mvp: true
    requirement_id: "CNV-72329"

    patterns:
      primary: "nad-live-update-migration"
      secondary:
        - "vm-creation-with-secondary-network"
        - "nad-patch-operation"
        - "migration-trigger-validation"
      helpers_required:
        - name: "libvmifact"
          functions: ["NewFedora"]
          purpose: "Create Fedora VMI"
        - name: "libnet"
          functions: ["NewBridgeNetAttachDef"]
          purpose: "Create bridge NADs"
        - name: "libmigration"
          functions: ["ExpectMigrationToSucceedWithDefaultTimeout"]
          purpose: "Validate migration trigger and completion"
        - name: "libwait"
          functions: ["WaitUntilVMIReady"]
          purpose: "Wait for VMI readiness"
      decorators:
        - "decorators.SigNetwork"
        - "Serial"

    variables:
      closure_scope:
        - name: "ctx"
          type: "context.Context"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It", "AfterEach"]
          comment: "Context for K8s API calls"
        - name: "namespace"
          type: "string"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It", "AfterEach"]
          comment: "Test namespace"
        - name: "err"
          type: "error"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It", "AfterEach"]
          comment: "Error variable"
        - name: "vm"
          type: "*v1.VirtualMachine"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It", "AfterEach"]
          comment: "VM with secondary network"
        - name: "originalNode"
          type: "string"
          initialized_in: "BeforeAll"
          used_in: ["It"]
          comment: "Node where VMI runs before migration"

    test_structure:
      type: "single"
      describe:
        wrapper: "SIG"
        description: "Live Update NAD Reference"
        decorators:
          - "decorators.SigNetwork"
          - "Serial"
      context:
        description: "Auto-migration triggered after NAD reference change"
        decorators:
          - "Ordered"
          - "decorators.OncePerOrderedCleanup"
      it:
        description: "should trigger auto-migration after NAD reference change"
        test_id_format: "[test_id:TS-CNV-72329-002]"

    code_structure: |
      Context("Auto-migration triggered after NAD reference change", Ordered, decorators.OncePerOrderedCleanup, func() {
        It("[test_id:TS-CNV-72329-002]should trigger auto-migration and land on different node", func() {
          // Record original node
          // Patch NAD reference
          // Wait for migration to complete
          // Verify MigrationRequired condition appears and resolves
          // Verify VM lands on different node
        })
      })

    test_objective:
      title: "Verify auto-migration triggered after NAD reference change"
      what: |
        This test validates that changing the NAD reference on a running VM automatically
        triggers a live migration. After patching the VM's secondary network NAD reference,
        the test verifies the MigrationRequired condition appears, migration completes
        successfully, and the VM ends up on a different node.
      why: |
        Live migration is the mechanism that applies NAD changes without restart. If
        migration is not triggered, the new network attachment cannot take effect. This
        is essential for the zero-downtime network swap promise of the feature.
      acceptance_criteria:
        - "Migration is triggered automatically after NAD reference patch"
        - "MigrationRequired condition appears on the VM and resolves after migration"
        - "VM lands on a different node after migration completes"

    classification:
      test_type: "Functional"
      scope: "Multi-component"
      automation_approach: "Ginkgo e2e with kubevirt test framework"

    specific_preconditions:
      - name: "Multiple schedulable nodes"
        requirement: "At least 2 worker nodes available for migration"
        validation: "oc get nodes with worker role"

    test_data:
      resource_definitions:
        - name: "source-nad"
          type: "NetworkAttachmentDefinition"
          yaml: |
            apiVersion: k8s.cni.cncf.io/v1
            kind: NetworkAttachmentDefinition
            metadata:
              name: source-nad
            spec:
              config: '{"cniVersion":"0.3.1","name":"source-bridge","type":"bridge","bridge":"br-source","ipam":{}}'
        - name: "target-nad"
          type: "NetworkAttachmentDefinition"
          yaml: |
            apiVersion: k8s.cni.cncf.io/v1
            kind: NetworkAttachmentDefinition
            metadata:
              name: target-nad
            spec:
              config: '{"cniVersion":"0.3.1","name":"target-bridge","type":"bridge","bridge":"br-target","ipam":{}}'

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create source and target bridge NADs"
          command: "libnet.CreateBridgeNetworkAttachmentDefinition"
          validation: "Both NADs created"
          pattern_id: "nad-bridge-create"
          code_template: |
            By("Creating source and target bridge NADs")
            sourceNAD, err = libnet.CreateBridgeNetworkAttachmentDefinition(ctx, namespace, "source-nad", "br-source")
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            targetNAD, err = libnet.CreateBridgeNetworkAttachmentDefinition(ctx, namespace, "target-nad", "br-target")
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

        - step_id: "SETUP-02"
          action: "Create and start VM with secondary interface on source NAD"
          command: "Create VM, start, wait for running"
          validation: "VM is running with secondary network"
          pattern_id: "vm-with-secondary-network"
          code_template: |
            By("Creating and starting VM with secondary interface on source NAD")
            vmi = libvmifact.NewFedora(
                libvmi.WithInterface(libvmi.InterfaceDeviceWithBridgeBinding("secondary")),
                libvmi.WithNetwork(libvmi.MultusNetwork("secondary", "source-nad")),
            )
            vm = libvmi.NewVirtualMachine(vmi, libvmi.WithRunning())
            vm, err = kubevirt.Client().VirtualMachine(namespace).Create(ctx, vm, metav1.CreateOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            vmi = libwait.WaitUntilVMIReady(vmi, console.LoginToFedora)

        - step_id: "SETUP-03"
          action: "Record the original node where VMI is running"
          command: "Get VMI status.nodeName"
          validation: "Original node recorded"
          pattern_id: "vmi-node-record"
          code_template: |
            By("Recording original node")
            vmi, err = kubevirt.Client().VirtualMachineInstance(namespace).Get(ctx, vmi.Name, metav1.GetOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            originalNode = vmi.Status.NodeName

      test_execution:
        - step_id: "TEST-01"
          action: "Patch VM to change NAD reference to target NAD"
          command: "VM patch with merge type"
          validation: "Patch applied"
          pattern_id: "vm-patch-nad-reference"
          code_template: |
            By("Patching VM NAD reference to target NAD")
            patchData := fmt.Sprintf(`{"spec":{"template":{"spec":{"networks":[{"name":"secondary","multus":{"networkName":"%s"}}]}}}}`, targetNAD.Name)
            vm, err = kubevirt.Client().VirtualMachine(namespace).Patch(ctx, vm.Name, types.MergePatchType, []byte(patchData), metav1.PatchOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

        - step_id: "TEST-02"
          action: "Wait for migration to complete"
          command: "Watch for VMI migration state"
          validation: "Migration completes successfully"
          pattern_id: "migration-wait"
          code_template: |
            By("Waiting for auto-migration to complete")
            Eventually(func() bool {
                vmi, err = kubevirt.Client().VirtualMachineInstance(namespace).Get(ctx, vmi.Name, metav1.GetOptions{})
                ExpectWithOffset(1, err).ToNot(HaveOccurred())
                return vmi.Status.MigrationState != nil && vmi.Status.MigrationState.Completed
            }, MigrationWaitTime, time.Second).Should(BeTrue())

        - step_id: "TEST-03"
          action: "Verify VM landed on a different node"
          command: "Compare current node to original node"
          validation: "VMI is on a different node"
          pattern_id: "vmi-node-check"
          code_template: |
            By("Verifying VM landed on different node")
            vmi, err = kubevirt.Client().VirtualMachineInstance(namespace).Get(ctx, vmi.Name, metav1.GetOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            ExpectWithOffset(1, vmi.Status.NodeName).ToNot(Equal(originalNode))

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM and NADs"
          command: "Delete resources"
          code_template: |
            By("Cleaning up VM and NADs")
            err = kubevirt.Client().VirtualMachine(namespace).Delete(ctx, vm.Name, metav1.DeleteOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Auto-migration is triggered after NAD reference change"
        condition: "vmi.Status.MigrationState != nil && MigrationState.Completed == true"
        failure_impact: "Feature broken — NAD change does not trigger migration"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "VM lands on a different node after migration"
        condition: "vmi.Status.NodeName != originalNode"
        failure_impact: "Migration did not actually relocate the VM"

    dependencies:
      kubernetes_resources:
        - "NetworkAttachmentDefinition: source-nad"
        - "NetworkAttachmentDefinition: target-nad"
        - "VirtualMachine: test VM"
      external_tools: []
      scenario_specific_rbac:
        - "patch on virtualmachines"
        - "get on virtualmachineinstances"

