---
scenarios:
  - scenario_id: "1"
    test_id: "TS-CNV-72329-001"
    tier: "Tier 1"
    priority: "P0"
    mvp: true
    requirement_id: "CNV-72329"

    patterns:
      primary: "nad-reference-change"
      secondary:
        - "vm-create-with-secondary-network"
        - "wait-vm-running"
        - "update-vm-spec-network"
        - "wait-migration-complete"
      helpers_required:
        - name: "libvmifact"
          functions: ["NewFedora"]
          purpose: "Create Fedora VMI for testing"
        - name: "libnet"
          functions: ["NewBridgeNetAttachDef"]
          purpose: "Create bridge NAD"
        - name: "libwait"
          functions: ["WaitUntilVMIReady"]
          purpose: "Wait for VMI readiness"
        - name: "libmigration"
          functions: ["ExpectMigrationToSucceed"]
          purpose: "Validate migration completion"
      decorators:
        - "decorators.SigNetwork"
        - "Serial"

    variables:
      closure_scope:
        - name: "ctx"
          type: "context.Context"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It", "AfterEach"]
          comment: "Context for K8s API calls"
        - name: "namespace"
          type: "string"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It", "AfterEach"]
          comment: "Test namespace"
        - name: "err"
          type: "error"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It", "AfterEach"]
          comment: "Error variable for API calls"
        - name: "vm"
          type: "*v1.VirtualMachine"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It"]
          comment: "VM under test with secondary network"
        - name: "nadA"
          type: "*networkv1.NetworkAttachmentDefinition"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "AfterEach"]
          comment: "Initial NAD for secondary network"
        - name: "nadB"
          type: "*networkv1.NetworkAttachmentDefinition"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It", "AfterEach"]
          comment: "Target NAD for reference change"

    test_structure:
      type: "single"
      describe:
        wrapper: "SIG"
        description: "Live Update NAD Reference"
        decorators:
          - "decorators.SigNetwork"
          - "Serial"
      context:
        description: "NAD reference change on running VM triggers VMI sync and migration"
        decorators:
          - "Ordered"
          - "decorators.OncePerOrderedCleanup"
      it:
        description: "should trigger VMI spec sync and automatic live migration when NAD reference is changed"
        test_id_format: "[test_id:TS-CNV-72329-001]"

    code_structure: |
      Context("NAD reference change on running VM triggers VMI sync and migration", Ordered, decorators.OncePerOrderedCleanup) {
        BeforeAll(func() {
          // Create two NADs (nadA, nadB) with different VLANs
          // Create VM with secondary interface attached to nadA
          // Wait for VM to be Running
        })
        It("[test_id:TS-CNV-72329-001]should trigger VMI spec sync and automatic live migration when NAD reference is changed", func() {
          // Update VM spec to change network reference from nadA to nadB
          // Verify VMI spec is updated to reflect nadB
          // Verify migration is triggered and completes
        })
      }

    test_objective:
      title: "Verify NAD reference change on running VM triggers VMI sync and migration"

      what: |
        This test validates the core feature behavior: when a user changes the NAD
        reference on a running VM's secondary network interface, the system automatically
        synchronizes the change to the VMI spec and triggers a live migration to apply
        the new network configuration at the pod level.

      why: |
        This is the primary use case for the LiveUpdateNADRef feature. VM admins need
        to change network segments (e.g., VLAN swap) without VM downtime. If this fails,
        the entire feature is non-functional and VMs would require restart for network changes.

      acceptance_criteria:
        - "VM spec network reference update is accepted without error"
        - "VMI spec networks array is updated to reflect the new NAD reference"
        - "Live migration is automatically triggered after NAD reference change"
        - "Migration completes successfully"

    classification:
      test_type: "Functional"
      scope: "Multi-component"
      automation_approach: "Ginkgo with KubeVirt test framework"

    specific_preconditions:
      - name: "Two bridge NADs with different VLANs"
        requirement: "NAD-A (VLAN 100) and NAD-B (VLAN 200) created in test namespace"
        validation: "oc get net-attach-def -n {namespace}"
      - name: "Running VM with secondary interface"
        requirement: "VM with secondary network interface attached to NAD-A, in Running state"
        validation: "virtctl get vm {vm-name} -n {namespace}"

    test_data:
      resource_definitions:
        - name: "nadA"
          type: "NetworkAttachmentDefinition"
          yaml: |
            apiVersion: k8s.cni.cncf.io/v1
            kind: NetworkAttachmentDefinition
            metadata:
              name: nad-vlan100
              namespace: "{namespace}"
            spec:
              config: '{"cniVersion":"0.3.1","type":"bridge","bridge":"br-test","vlan":100}'

        - name: "nadB"
          type: "NetworkAttachmentDefinition"
          yaml: |
            apiVersion: k8s.cni.cncf.io/v1
            kind: NetworkAttachmentDefinition
            metadata:
              name: nad-vlan200
              namespace: "{namespace}"
            spec:
              config: '{"cniVersion":"0.3.1","type":"bridge","bridge":"br-test","vlan":200}'

      api_endpoints: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create NAD-A with VLAN 100"
          command: "oc apply -f nad-vlan100.yaml"
          validation: "NAD created in namespace"
          pattern_id: "nad-create"
          code_template: |
            nadA = libnet.NewBridgeNetAttachDef(namespace, "nad-vlan100")
            nadA, err = kubevirt.Client().NetworkClient().NetworkAttachmentDefinitions(namespace).Create(ctx, nadA, metav1.CreateOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

        - step_id: "SETUP-02"
          action: "Create NAD-B with VLAN 200"
          command: "oc apply -f nad-vlan200.yaml"
          validation: "NAD created in namespace"
          pattern_id: "nad-create"
          code_template: |
            nadB = libnet.NewBridgeNetAttachDef(namespace, "nad-vlan200")
            nadB, err = kubevirt.Client().NetworkClient().NetworkAttachmentDefinitions(namespace).Create(ctx, nadB, metav1.CreateOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

        - step_id: "SETUP-03"
          action: "Create VM with secondary interface attached to NAD-A"
          command: "Create VM spec with secondary network referencing NAD-A"
          validation: "VM created and Running"
          pattern_id: "vm-create-secondary-net"
          code_template: |
            vmi = libvmifact.NewFedora(
                libvmi.WithInterface(*v1.DefaultMasqueradeNetworkInterface()),
                libvmi.WithNetwork(v1.DefaultPodNetwork()),
                libvmi.WithInterface(libvmi.InterfaceDeviceWithBridgeBinding("secondary")),
                libvmi.WithNetwork(libvmi.MultusNetwork("secondary", nadA.Name)),
            )
            vm = libvmi.NewVirtualMachine(vmi)
            vm, err = kubevirt.Client().VirtualMachine(namespace).Create(ctx, vm, metav1.CreateOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            vm = libvmops.StartVirtualMachine(vm)

      test_execution:
        - step_id: "TEST-01"
          action: "Update VM spec to change secondary network NAD reference from NAD-A to NAD-B"
          command: "Patch VM spec networks to reference NAD-B"
          validation: "VM spec updated without error"
          pattern_id: "vm-update-nad-ref"
          code_template: |
            By("Updating VM network reference from NAD-A to NAD-B")
            patchData := fmt.Sprintf(`[{"op":"replace","path":"/spec/template/spec/networks/1/multus/networkName","value":"%s"}]`, nadB.Name)
            vm, err = kubevirt.Client().VirtualMachine(namespace).Patch(ctx, vm.Name, types.JSONPatchType, []byte(patchData), metav1.PatchOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

        - step_id: "TEST-02"
          action: "Verify VMI spec is updated to reflect NAD-B"
          command: "Get VMI and check networks array"
          validation: "VMI spec shows NAD-B reference"
          pattern_id: "vmi-spec-verify"
          code_template: |
            By("Verifying VMI spec reflects new NAD reference")
            Eventually(func() string {
                vmi, err = kubevirt.Client().VirtualMachineInstance(namespace).Get(ctx, vm.Name, metav1.GetOptions{})
                ExpectWithOffset(1, err).ToNot(HaveOccurred())
                return vmi.Spec.Networks[1].Multus.NetworkName
            }, 30*time.Second, 5*time.Second).Should(Equal(nadB.Name))

        - step_id: "TEST-03"
          action: "Verify live migration is triggered and completes"
          command: "Watch for migration object and completion"
          validation: "Migration completes successfully"
          pattern_id: "migration-verify"
          code_template: |
            By("Verifying migration is triggered and completes")
            Eventually(func() bool {
                migrations, err := kubevirt.Client().VirtualMachineInstanceMigration(namespace).List(ctx, metav1.ListOptions{})
                ExpectWithOffset(1, err).ToNot(HaveOccurred())
                for _, m := range migrations.Items {
                    if m.Spec.VMIName == vm.Name && m.Status.Phase == v1.MigrationSucceeded {
                        return true
                    }
                }
                return false
            }, MigrationWaitTime, 5*time.Second).Should(BeTrue())

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM"
          command: "oc delete vm {vm-name}"
          code_template: |
            By("Deleting VM")
            err = kubevirt.Client().VirtualMachine(namespace).Delete(ctx, vm.Name, metav1.DeleteOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

        - step_id: "CLEANUP-02"
          action: "Delete NADs"
          command: "oc delete net-attach-def nad-vlan100 nad-vlan200"
          code_template: |
            By("Deleting NADs")
            err = kubevirt.Client().NetworkClient().NetworkAttachmentDefinitions(namespace).Delete(ctx, nadA.Name, metav1.DeleteOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            err = kubevirt.Client().NetworkClient().NetworkAttachmentDefinitions(namespace).Delete(ctx, nadB.Name, metav1.DeleteOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "VMI spec networks updated to reflect new NAD reference"
        condition: "vmi.Spec.Networks[1].Multus.NetworkName == nadB.Name"
        failure_impact: "NAD reference sync is broken - feature non-functional"

      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Live migration triggered and completed successfully"
        condition: "migration.Status.Phase == MigrationSucceeded"
        failure_impact: "NAD change not applied at pod level - guest remains on old network"

    dependencies:
      kubernetes_resources:
        - "NetworkAttachmentDefinition: nad-vlan100"
        - "NetworkAttachmentDefinition: nad-vlan200"
        - "VirtualMachine: test VM"
      external_tools:
        - "virtctl 4.22+"
        - "oc 4.22+"
      scenario_specific_rbac:
        - "patch on virtualmachines"

  - scenario_id: "2"
