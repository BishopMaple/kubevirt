    test_objective:
      title: "Verify VM interface name and MAC address remain the same after NAD reference live update and migration"
      what: |
        This test validates that the VM's network interface identity (interface name and MAC address)
        is preserved after a NAD reference is updated and a live migration occurs. The VM should
        retain the same interface name and MAC address on the new network, ensuring no application
        disruption from identity changes.
      why: |
        Interface identity preservation is critical for applications that bind to specific MAC
        addresses or interface names. If these change during NAD swap, it could break network
        configurations, licensing tied to MAC addresses, or application-level network bindings.
      acceptance_criteria:
        - "Interface name is identical before and after NAD swap + migration"
        - "MAC address is identical before and after NAD swap + migration"

