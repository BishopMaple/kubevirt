          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It"]
          comment: "Test namespace"
        - name: "sourceNAD"
          type: "*networkv1.NetworkAttachmentDefinition"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll"]
          comment: "Source bridge NAD"
        - name: "targetNAD"
          type: "*networkv1.NetworkAttachmentDefinition"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It"]
          comment: "Target bridge NAD for swap"
        - name: "vmi"
          type: "*v1.VirtualMachineInstance"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It"]
          comment: "VM instance with secondary interface"
        - name: "err"
          type: "error"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It"]
          comment: "Error variable"

    test_structure:
      type: "single"
      describe:
        wrapper: "SIG"
        description: "NAD Reference Live Update"
        decorators:
          - "decorators.SigNetwork"
          - "Serial"
      context:
        description: "when NAD reference is changed on a running VM"
        decorators:
          - "Ordered"
      it:
        description: "should trigger live migration to apply new NAD"
        test_id_format: "[test_id:TS-CNV-72329-001]"

    code_structure: |
      SIG("NAD Reference Live Update", decorators.SigNetwork, Serial, func() {
        Context("when NAD reference is changed on a running VM", Ordered, func() {
          var ctx context.Context
          var namespace string
          var sourceNAD, targetNAD *networkv1.NetworkAttachmentDefinition
          var vmi *v1.VirtualMachineInstance
          var err error

          BeforeAll(func() {
            ctx = context.Background()
            namespace = testsuite.GetTestNamespace(nil)
            // Create source and target bridge NADs
            // Create VM with secondary interface attached to sourceNAD
            // Wait for VM to be Running
          })

          It("[test_id:TS-CNV-72329-001]should trigger live migration to apply new NAD", func() {
            // Patch VM spec to change NAD reference from sourceNAD to targetNAD
            // Verify migration is triggered
            // Wait for successful migration completion
          })
        })
      })

    test_objective:
      title: "Verify NAD reference change triggers live migration"
      what: |
        Validates that changing the NAD reference on a running VM's secondary bridge
        interface triggers an automatic live migration when the LiveUpdateNADRef feature
        gate is enabled. The VM spec is patched to point to a different NAD, and the
        system should detect the mismatch and initiate migration rather than setting
        RestartRequired.
      why: |
        This is the core functionality of the NAD live update feature. VM administrators
        need to seamlessly move VMs between network segments without downtime. If migration
        is not triggered, the user must manually restart the VM, defeating the purpose of
        the feature.
      acceptance_criteria:
        - "NAD reference patch on VM spec is accepted"
        - "Live migration is automatically triggered within 60 seconds"
        - "Migration completes successfully"
        - "RestartRequired condition is NOT set"

    classification:
      test_type: "Functional"
      scope: "Multi-component"
      automation_approach: "Ginkgo with kubevirt test framework"

    specific_preconditions:
      - name: "Source bridge NAD"
        requirement: "Bridge-based NAD (source-net) created in test namespace"
        validation: "oc get net-attach-def source-net -n {namespace}"
      - name: "Target bridge NAD"
        requirement: "Bridge-based NAD (target-net) with different bridge config"
        validation: "oc get net-attach-def target-net -n {namespace}"
      - name: "Running VM with secondary interface"
        requirement: "Fedora VM with secondary interface attached to source-net NAD"
        validation: "oc get vmi -n {namespace} -o jsonpath='{.items[0].status.phase}'"

    test_data:
      resource_definitions:
        - name: "source-nad"
          type: "NetworkAttachmentDefinition"
          yaml: |
            apiVersion: k8s.cni.cncf.io/v1
            kind: NetworkAttachmentDefinition
            metadata:
              name: source-net
            spec:
              config: |
                {
                  "cniVersion": "0.3.1",
                  "type": "bridge",
                  "bridge": "source-br",
                  "ipam": {}
                }
        - name: "target-nad"
          type: "NetworkAttachmentDefinition"
          yaml: |
            apiVersion: k8s.cni.cncf.io/v1
            kind: NetworkAttachmentDefinition
            metadata:
              name: target-net
            spec:
              config: |
                {
                  "cniVersion": "0.3.1",
                  "type": "bridge",
                  "bridge": "target-br",
                  "ipam": {}
                }

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create source bridge NAD in test namespace"
          command: "libnet.NewBridgeNetAttachDef(namespace, 'source-net', 'source-br')"
          validation: "NAD created successfully"
          pattern_id: "bridge_nad_setup"
          code_template: |
            sourceNAD, err = libnet.CreateNAD(namespace, "source-net")
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
        - step_id: "SETUP-02"
          action: "Create target bridge NAD in test namespace"
          command: "libnet.NewBridgeNetAttachDef(namespace, 'target-net', 'target-br')"
          validation: "NAD created successfully"
          pattern_id: "bridge_nad_setup"
          code_template: |
            targetNAD, err = libnet.CreateNAD(namespace, "target-net")
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
        - step_id: "SETUP-03"
          action: "Create Fedora VM with secondary interface on source NAD"
          command: "libvmifact.NewFedora with bridge interface on source-net"
          validation: "VM created and Running"
          pattern_id: "vm_creation_with_secondary_network"
          code_template: |
            vmi = libvmifact.NewFedora(
                libvmi.WithInterface(libvmi.InterfaceDeviceWithBridgeBinding("secondary")),
                libvmi.WithNetwork(libvmi.MultusNetwork("secondary", "source-net")),
            )
            vmi, err = kubevirt.Client().VirtualMachineInstance(namespace).Create(ctx, vmi, metav1.CreateOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            vmi = libwait.WaitUntilVMIReady(vmi, console.LoginToFedora)
      test_execution:
        - step_id: "TEST-01"
          action: "Patch VM spec to change NAD reference from source-net to target-net"
          command: "Patch VM networks[].multus.networkName to target-net"
          validation: "Patch accepted, no error"
          pattern_id: "nad_patch_operation"
          code_template: |
            patchData := fmt.Sprintf(`[{"op": "replace", "path": "/spec/template/spec/networks/1/multus/networkName", "value": "%s/%s"}]`, namespace, "target-net")
            _, err = kubevirt.Client().VirtualMachine(namespace).Patch(ctx, vm.Name, types.JSONPatchType, []byte(patchData), metav1.PatchOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
        - step_id: "TEST-02"
          action: "Verify live migration is triggered"
          command: "Wait for VirtualMachineInstanceMigration to appear"
          validation: "Migration object created"
          pattern_id: "migration_wait"
          code_template: |
            Eventually(func() bool {
                migrations, err := kubevirt.Client().VirtualMachineInstanceMigration(namespace).List(ctx, metav1.ListOptions{})
                ExpectWithOffset(1, err).ToNot(HaveOccurred())
                return len(migrations.Items) > 0
            }, 60*time.Second, 5*time.Second).Should(BeTrue(), "migration should be triggered")
        - step_id: "TEST-03"
          action: "Wait for migration to complete successfully"
          command: "libmigration.WaitForSuccessfulMigration"
          validation: "Migration succeeded"
          pattern_id: "migration_wait"
          code_template: |
            migration = libmigration.WaitForSuccessfulMigration(vmi, MigrationWaitTime)
            Expect(migration.Status.Phase).To(Equal(v1.MigrationSucceeded))
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM and NADs"
          command: "Delete created resources"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Live migration is triggered after NAD reference change"
        condition: "VirtualMachineInstanceMigration object exists"
        failure_impact: "Core feature broken - NAD swap does not trigger migration"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Migration completes successfully"
        condition: "migration.Status.Phase == MigrationSucceeded"
        failure_impact: "NAD swap migration fails, VM left in inconsistent state"

    dependencies:
      kubernetes_resources:
        - "NetworkAttachmentDefinition: source-net"
        - "NetworkAttachmentDefinition: target-net"
        - "VirtualMachine with secondary interface"
      external_tools:
        - "oc 4.22+"
        - "virtctl CNV 4.22+"

