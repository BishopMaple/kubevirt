          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It"]
          comment: "Test namespace"
        - name: "vm"
          type: "*v1.VirtualMachine"
          initialized_in: "BeforeAll"
          used_in: ["BeforeAll", "It"]
          comment: "VM under test"

    test_structure:
      type: "single"
      describe:
        wrapper: "SIG"
        description: "NAD Reference Live Update"
        decorators:
          - "decorators.SigNetwork"
          - "Serial"
      context:
        description: "Migration condition lifecycle after NAD ref update"
        decorators:
          - "Ordered"
      it:
        description: "should show MigrationRequired condition after NAD update and clear after migration"
        test_id_format: "[test_id:TS-CNV-72329-002]"

    code_structure: |
      Context("Migration condition lifecycle after NAD ref update", Ordered, func() {
        It("[test_id:TS-CNV-72329-002]should show MigrationRequired condition after NAD update and clear after migration", func() {
          // Update NAD reference on VM
          // Verify VirtualMachineInstanceMigrationRequired condition appears
          // Wait for migration to complete
          // Verify condition clears
        })
      })

    test_objective:
      title: "Verify VirtualMachineInstanceMigrationRequired condition appears after NAD reference update and clears after successful migration"
      what: |
        This test validates the condition lifecycle during a NAD reference live update. When the
        NAD reference is changed on a running VM, the VirtualMachineInstanceMigrationRequired
        condition should appear on the VMI, indicating a migration is needed. After the migration
        completes successfully, this condition should be cleared.
      why: |
        The MigrationRequired condition is the observable signal that the system has recognized
        the NAD change and scheduled a migration. Verifying condition lifecycle ensures proper
        signaling to operators and monitoring systems, and confirms no restart occurred.
      acceptance_criteria:
        - "VirtualMachineInstanceMigrationRequired condition appears after NAD ref update"
        - "Condition clears after successful migration completion"
        - "No VM restart occurs (only migration)"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Ginkgo with kubevirt test framework"

    specific_preconditions:
      - name: "Two bridge NADs"
        requirement: "Two distinct bridge-type NADs in the test namespace"
        validation: "oc get net-attach-def -n <namespace>"
      - name: "Running VM with secondary network"
        requirement: "VM running with one secondary network attached to nadA"
        validation: "oc get vmi -n <namespace>"

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create two bridge NADs and a VM with secondary network on nadA"
          command: "Standard NAD + VM setup"
          validation: "VM Running with secondary network"
          pattern_id: "bridge-nad-setup"
      test_execution:
        - step_id: "TEST-01"
          action: "Update NAD reference from nadA to nadB on running VM"
          command: "Patch VM spec"
          validation: "Patch applied"
          pattern_id: "nad-ref-update"
        - step_id: "TEST-02"
          action: "Verify VirtualMachineInstanceMigrationRequired condition appears"
          command: "Check VMI conditions"
          validation: "Condition is True"
          pattern_id: "condition-check"
          code_template: |
            Eventually(func() error {
              vmi, err = kubevirt.Client().VirtualMachineInstance(namespace).Get(ctx, vm.Name, metav1.GetOptions{})
              ExpectWithOffset(1, err).ToNot(HaveOccurred())
              return matcher.ThisVMI(vmi).Should(matcher.HaveConditionTrue(v1.VirtualMachineInstanceMigrationRequired))
            }, 30*time.Second, time.Second).Should(Succeed())
        - step_id: "TEST-03"
          action: "Wait for migration to complete"
          command: "Wait for migration state completed"
          validation: "Migration completed"
          pattern_id: "migration-wait"
        - step_id: "TEST-04"
          action: "Verify MigrationRequired condition clears after migration"
          command: "Check VMI conditions"
          validation: "Condition is False or missing"
          pattern_id: "condition-check"
          code_template: |
            Eventually(func() error {
              vmi, err = kubevirt.Client().VirtualMachineInstance(namespace).Get(ctx, vm.Name, metav1.GetOptions{})
              ExpectWithOffset(1, err).ToNot(HaveOccurred())
              return matcher.ThisVMI(vmi).Should(matcher.HaveConditionMissingOrFalse(v1.VirtualMachineInstanceMigrationRequired))
            }, 30*time.Second, time.Second).Should(Succeed())
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM and NADs"
          command: "Kubernetes garbage collection"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "MigrationRequired condition appears after NAD ref update"
        condition: "VMI has condition VirtualMachineInstanceMigrationRequired == True"
        failure_impact: "Migration signaling broken - system does not recognize NAD change"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "MigrationRequired condition clears after migration completion"
        condition: "VMI condition VirtualMachineInstanceMigrationRequired is missing or False"
        failure_impact: "Stale condition after migration - monitoring tools get incorrect signals"

    dependencies:
      kubernetes_resources:
        - "NetworkAttachmentDefinition: nadA, nadB"
        - "VirtualMachine: test VM"
      external_tools:
        - "oc 4.22+"

