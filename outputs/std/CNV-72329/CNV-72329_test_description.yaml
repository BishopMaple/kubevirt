          used_in: ["BeforeAll", "It", "AfterEach"]
          comment: "Test VM wrapping the VMI"

    test_structure:
      type: "single"
      describe:
        wrapper: "SIG"
        description: "NAD reference hotplug"
        decorators:
          - "decorators.SigNetwork"
          - "Serial"
      context:
        description: "Verify NAD reference change on running VM"
        decorators:
          - "Ordered"
          - "decorators.OncePerOrderedCleanup"
      it:
        description: "should successfully change the NAD reference on a running VM"
        test_id_format: "[test_id:TS-CNV72329-001]"

    code_structure: |
      SIG("NAD reference hotplug", decorators.SigNetwork, Serial) {
        Context("Verify NAD reference change on running VM", Ordered, decorators.OncePerOrderedCleanup) {
          BeforeAll(func() {
            // Create source and target bridge NADs
            // Create VM with secondary network interface pointing to source NAD
            // Start VM and wait for readiness
          })
          It("[test_id:TS-CNV72329-001]should successfully change the NAD reference on a running VM", func() {
            // Patch VM spec to change networkName from source NAD to target NAD
            // Verify patch accepted without error
            // Verify VM spec updated with new NAD reference
          })
        }
      }

    test_objective:
      title: "Verify NAD reference change on running VM"
      what: |
        This test validates that the networkName field in a running VM's spec can be
        successfully patched to point to a different NAD. The patch operation should be
        accepted by the API server and the VM spec should reflect the new NAD reference.
      why: |
        This is the fundamental operation of the NAD hotplug feature. If the VM spec cannot
        be patched to reference a different NAD, the entire feature is broken. This validates
        the API-level acceptance of the change.
      acceptance_criteria:
        - "VM spec patch to change networkName is accepted without error"
        - "VM spec reflects the new NAD reference after patch"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Ginkgo with kubevirt test framework"

    specific_preconditions:
      - name: "Two bridge NADs"
        requirement: "Two distinct bridge-type NADs deployed in test namespace"
        validation: "oc get net-attach-def -n $NAMESPACE"
      - name: "Running VM with secondary interface"
        requirement: "VM running with secondary network attached via source NAD"
        validation: "virtctl console $VM_NAME"

    test_data:
      resource_definitions:
        - name: "source-nad"
          type: "NetworkAttachmentDefinition"
          yaml: |
            apiVersion: k8s.cni.cncf.io/v1
            kind: NetworkAttachmentDefinition
            metadata:
              name: source-bridge-nad
            spec:
              config: |
                {
                  "cniVersion": "0.3.1",
                  "name": "source-bridge",
                  "type": "bridge",
                  "bridge": "source-br0",
                  "ipam": {}
                }
        - name: "target-nad"
          type: "NetworkAttachmentDefinition"
          yaml: |
            apiVersion: k8s.cni.cncf.io/v1
            kind: NetworkAttachmentDefinition
            metadata:
              name: target-bridge-nad
            spec:
              config: |
                {
                  "cniVersion": "0.3.1",
                  "name": "target-bridge",
                  "type": "bridge",
                  "bridge": "target-br0",
                  "ipam": {}
                }

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create source bridge NAD"
          command: "libnet.CreateNAD(ctx, namespace, sourceNADSpec)"
          validation: "NAD created successfully"
          pattern_id: "bridge_nad_setup"
          code_template: |
            By("Creating source bridge NAD")
            sourceNAD = libnet.NewBridgeNetAttachDef(namespace, "source-bridge-nad", "source-br0")
            sourceNAD, err = libnet.CreateNAD(ctx, namespace, sourceNAD)
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
        - step_id: "SETUP-02"
          action: "Create target bridge NAD"
          command: "libnet.CreateNAD(ctx, namespace, targetNADSpec)"
          validation: "NAD created successfully"
          pattern_id: "bridge_nad_setup"
          code_template: |
            By("Creating target bridge NAD")
            targetNAD = libnet.NewBridgeNetAttachDef(namespace, "target-bridge-nad", "target-br0")
            targetNAD, err = libnet.CreateNAD(ctx, namespace, targetNAD)
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
        - step_id: "SETUP-03"
          action: "Create and start VM with secondary interface on source NAD"
          command: "Create VM with secondary network, start, and wait for ready"
          validation: "VM is running with secondary interface on source NAD"
          pattern_id: "vmi_create_with_network"
          code_template: |
            By("Creating VM with secondary network interface on source NAD")
            vmi = libvmifact.NewFedora(
              libvmi.WithInterface(libvmi.InterfaceDeviceWithBridgeBinding("secondary")),
              libvmi.WithNetwork(libvmi.MultusNetwork("secondary", sourceNAD.Name)),
            )
            vm, err = kubevirt.Client().VirtualMachine(namespace).Create(ctx, renderVMWithVMI(vmi))
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            vmi = libwait.WaitUntilVMIReady(ctx, vmi, console.LoginToFedora)

      test_execution:
        - step_id: "TEST-01"
          action: "Patch VM to change NAD reference from source to target"
          command: "Patch VM spec.template.spec.networks[].multus.networkName"
          validation: "Patch accepted, VM spec updated"
          pattern_id: "patch_vm_network"
          code_template: |
            By("Patching VM to change NAD reference to target NAD")
            patchData := fmt.Sprintf(`[{"op": "replace", "path": "/spec/template/spec/networks/1/multus/networkName", "value": "%s"}]`, targetNAD.Name)
            vm, err = kubevirt.Client().VirtualMachine(namespace).Patch(ctx, vm.Name, types.JSONPatchType, []byte(patchData), metav1.PatchOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
        - step_id: "TEST-02"
          action: "Verify VM spec reflects new NAD reference"
          command: "Get VM and check networks[].multus.networkName"
          validation: "networkName equals target NAD name"
          code_template: |
            By("Verifying VM spec reflects new NAD reference")
            updatedVM, err = kubevirt.Client().VirtualMachine(namespace).Get(ctx, vm.Name, metav1.GetOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            ExpectWithOffset(1, updatedVM.Spec.Template.Spec.Networks[1].Multus.NetworkName).To(Equal(targetNAD.Name))

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM"
          code_template: |
            By("Deleting VM")
            err = kubevirt.Client().VirtualMachine(namespace).Delete(ctx, vm.Name, metav1.DeleteOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
        - step_id: "CLEANUP-02"
          action: "Delete NADs"
          code_template: |
            By("Deleting source NAD")
            err = kubevirt.Client().NetworkClient().NetworkAttachmentDefinitions(namespace).Delete(ctx, sourceNAD.Name, metav1.DeleteOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            By("Deleting target NAD")
            err = kubevirt.Client().NetworkClient().NetworkAttachmentDefinitions(namespace).Delete(ctx, targetNAD.Name, metav1.DeleteOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "VM spec patch is accepted without error"
        condition: "err is nil after patch operation"
        failure_impact: "Feature fundamentally broken - NAD change cannot be initiated"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "VM spec reflects new NAD reference"
        condition: "networks[1].multus.networkName equals target NAD name"
        failure_impact: "NAD change not persisted in VM spec"

    dependencies:
      kubernetes_resources:
        - "NetworkAttachmentDefinition: source-bridge-nad"
        - "NetworkAttachmentDefinition: target-bridge-nad"
        - "VirtualMachine: test-vm"
      external_tools:
        - "virtctl 1.0+"
      scenario_specific_rbac:
        - "patch on virtualmachines"

