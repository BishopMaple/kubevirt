          validation: "Hotplug initiated"
        - step_id: "TEST-02"
          action: "Immediately patch NAD reference on existing interface"
          command: "Patch NAD reference"
          validation: "Patch sent"
        - step_id: "TEST-03"
          action: "Wait for operations to complete"
          command: "Wait for stable state"
          validation: "VM stable"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete resources"
          command: "Fixtures"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P2"
        description: "Concurrent NAD swap and hotplug handled gracefully"
        condition: "VM is in a stable Running state"
        failure_impact: "Concurrent operations cause VM instability"

