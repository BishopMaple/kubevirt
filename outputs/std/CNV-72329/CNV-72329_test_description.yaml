        - "VMI spec shows 1 unchanged NAD reference"
        - "Migration completes successfully"

    classification:
      test_type: "E2E"
      scope: "Multi-component"
      automation_approach: "pytest with python-wrapper"

    specific_preconditions:
      - name: "5 bridge-based NADs"
        requirement: "3 source + 2 target NADs with distinct bridges"
        validation: "5 NADs created in test namespace"

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Enable FG, create 5 NADs, create VM with 3 interfaces"
          command: "Standard multi-interface setup"
          validation: "VM running with 3 secondary interfaces"
          pattern_id: "vm-create-multi-interface"

      test_execution:
        - step_id: "TEST-01"
          action: "Patch VM to change 2 of 3 NAD references"
          command: "patch.WithReplace on networks/0 and networks/1"
          validation: "Patch succeeds"
          pattern_id: "patch-multiple-nads"
          code_template: |
            patchData, err = patch.New(
                patch.WithReplace("/spec/template/spec/networks/0/multus/networkName", targetNad1),
                patch.WithReplace("/spec/template/spec/networks/1/multus/networkName", targetNad2),
            ).GeneratePayload()
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            _, err = kubevirt.Client().VirtualMachine(testNamespace).Patch(
                ctx, vmName, types.JSONPatchType, patchData, metav1.PatchOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
        - step_id: "TEST-02"
          action: "Wait for migration to complete"
          command: "Eventually MigrationRequired appears then clears"
          validation: "Migration complete"
          pattern_id: "wait-migration-condition"
        - step_id: "TEST-03"
          action: "Verify VMI spec has correct NAD references"
          command: "Get VMI, check networks[].multus.networkName"
          validation: "2 updated, 1 unchanged"
          pattern_id: "verify-vmi-spec"
          code_template: |
            updatedVMI, err = kubevirt.Client().VirtualMachineInstance(testNamespace).Get(
                ctx, vmName, metav1.GetOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())
            networksByName = map[string]v1.Network{}
            for _, net := range updatedVMI.Spec.Networks {
                networksByName[net.Name] = net
            }
            ExpectWithOffset(1, networksByName["net1"].Multus.NetworkName).To(Equal(targetNad1))
            ExpectWithOffset(1, networksByName["net2"].Multus.NetworkName).To(Equal(targetNad2))
            ExpectWithOffset(1, networksByName["net3"].Multus.NetworkName).To(Equal(nad3))

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Delete VM and all NADs"
          code_template: |
            err = kubevirt.Client().VirtualMachine(testNamespace).Delete(ctx, vmName, metav1.DeleteOptions{})
            ExpectWithOffset(1, err).ToNot(HaveOccurred())

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Two NAD references updated correctly"
        condition: "VMI networks[0] and networks[1] reference target NADs"
        failure_impact: "Multi-interface NAD swap broken — only single-interface supported"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Third NAD reference unchanged"
        condition: "VMI networks[2] still references original NAD"
        failure_impact: "Patch incorrectly modified unrelated interfaces"

    dependencies:
      kubernetes_resources:
        - "NetworkAttachmentDefinition: nad-1, nad-2, nad-3, target-nad-1, target-nad-2"
        - "VirtualMachine: multi-nad-vm"
      external_tools:
        - "Bridge CNI plugin"
      scenario_specific_rbac:
        - "patch on virtualmachines"

