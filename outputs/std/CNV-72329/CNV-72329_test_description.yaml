  infrastructure:
    - name: "OpenShift cluster"
      requirement: "OCP 4.22+ with OVN-Kubernetes CNI"
      validation: "oc version"

    - name: "OpenShift Virtualization"
      requirement: "CNV 4.22+"
      validation: "oc get csv -n openshift-cnv | grep kubevirt-hyperconverged"

    - name: "Multi-node cluster"
      requirement: "At least 2 schedulable worker nodes for live migration"
      validation: "oc get nodes --selector=node-role.kubernetes.io/worker= --no-headers | wc -l"

    - name: "Multus CNI with bridge plugin"
      requirement: "Multus CNI available with bridge plugin for secondary networks"
      validation: "oc get pods -n openshift-multus --no-headers | grep -c Running"

    - name: "LiveUpdateNADRef feature gate"
      requirement: "Feature gate enabled in KubeVirt configuration (Beta - enabled by default)"
      validation: "oc get kubevirt -n openshift-cnv kubevirt -o jsonpath='{.spec.configuration.developerConfiguration.featureGates}'"

    - name: "Bridge-based NADs"
      requirement: "Minimum 2 bridge-based NetworkAttachmentDefinitions on separate bridges"
      validation: "oc get net-attach-def -A --no-headers | wc -l"

  operators:
