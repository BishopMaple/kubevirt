      validation: "oc get nodes --selector='node-role.kubernetes.io/worker' --no-headers | wc -l"

    - name: "Bridge CNI plugin"
      requirement: "Bridge CNI plugin available on all worker nodes"
      validation: "oc get pods -n openshift-cnv -l app=bridge-marker --no-headers"

    - name: "CPU virtualization"
      requirement: "VT-x (Intel) or AMD-V (AMD) enabled"
