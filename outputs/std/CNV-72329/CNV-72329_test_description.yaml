        test_id_format: "[test_id:TS-CNV72329-003]"

    code_structure: |
      Context("[NEGATIVE] Verify error for NAD change to non-existent NAD", Ordered, decorators.OncePerOrderedCleanup) {
        It("[test_id:TS-CNV72329-003]should reject NAD change to non-existent NAD", func() {
          // Patch VM NAD reference to non-existent NAD
          // Verify error or condition indicates invalid NAD
        })
      }

    test_objective:
      title: "[NEGATIVE] Verify error for NAD change to non-existent NAD"
      what: |
        This negative test validates that changing the NAD reference to a NAD that
        does not exist in the namespace is handled gracefully. The system should report
        an error condition rather than leaving the VM in an undefined state.
      why: |
        Users may accidentally specify a wrong NAD name. The system must provide clear
        error feedback rather than silently failing or leaving the VM in a broken state.
      acceptance_criteria:
        - "NAD change to non-existent NAD produces an error condition"
        - "VM is not left in an undefined or crashed state"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Ginkgo with kubevirt test framework"

    specific_preconditions: []
    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create running VM with secondary interface on source NAD"
          validation: "VM running with secondary interface"
          code_template: |
            By("Creating running VM with secondary interface")
            // Setup VM with source NAD

      test_execution:
        - step_id: "TEST-01"
          action: "Patch VM NAD reference to non-existent NAD"
          validation: "Error condition reported"
          code_template: |
            By("Patching VM NAD reference to non-existent NAD")
            patchData := `[{"op": "replace", "path": "/spec/template/spec/networks/1/multus/networkName", "value": "non-existent-nad"}]`
            vm, err = kubevirt.Client().VirtualMachine(namespace).Patch(ctx, vm.Name, types.JSONPatchType, []byte(patchData), metav1.PatchOptions{})
            // NAD change may be accepted at API level but fail at controller level
        - step_id: "TEST-02"
          action: "Verify error condition on VMI"
          validation: "VMI shows condition indicating invalid NAD"
          code_template: |
            By("Verifying VMI shows error condition for invalid NAD")
            Eventually(func() bool {
              vmi, err = kubevirt.Client().VirtualMachineInstance(namespace).Get(ctx, vm.Name, metav1.GetOptions{})
              ExpectWithOffset(1, err).ToNot(HaveOccurred())
              for _, cond := range vmi.Status.Conditions {
