    code_structure: |
      Context("Verify VM remains running during NAD change", Ordered, decorators.OncePerOrderedCleanup) {
        It("[test_id:TS-CNV72329-002]should keep VM in Running phase during NAD reference change", func() {
          // Patch VM NAD reference
          // Continuously check VM status — must stay Running (not paused/stopped)
        })
      }

    test_objective:
      title: "Verify VM remains running during NAD change"
      what: |
        This test validates that the VM continues running (does not stop or crash)
        when the NAD reference is changed. The VM phase should remain "Running" throughout
        the NAD change and subsequent migration process.
      why: |
        A key requirement of this feature is zero-downtime network changes. If the VM
        stops or enters an error state during NAD change, the feature's value proposition
        of transparent network switching is broken.
      acceptance_criteria:
        - "VM phase remains Running throughout NAD change operation"
        - "VM is not stopped, paused, or restarted during NAD change"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Ginkgo with kubevirt test framework"

    specific_preconditions: []

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create NADs and running VM with secondary interface (shared with scenario 1)"
          validation: "VM running with secondary interface"
          code_template: |
            By("Setting up NADs and running VM")
