          - "decorators.SigNetwork"
          - "Serial"
      context:
        description: "with LiveUpdateNADRef feature gate enabled"
        decorators:
          - "Ordered"
      it:
        description: "should NOT set RestartRequired when NAD reference changes"
        test_id_format: "[test_id:TS-CNV-72329-006]"

    code_structure: |
      It("[test_id:TS-CNV-72329-006]should NOT set RestartRequired when NAD reference changes", func() {
        // Patch NAD reference
        // Verify RestartRequired condition is NOT set
      })

    test_objective:
      title: "Verify RestartRequired NOT set when feature gate enabled"
      what: |
        With LiveUpdateNADRef feature gate enabled, changing a NAD reference should
        trigger a live migration rather than setting the RestartRequired condition.
        This test verifies the RestartRequired condition is absent after a NAD change.
      why: |
        The core value proposition of this feature is avoiding VM restarts for network
        changes. If RestartRequired is set despite the feature gate being enabled,
        the feature is not working correctly.
      acceptance_criteria:
        - "NAD reference change does not set RestartRequired condition"
        - "VM conditions show no RestartRequired=True"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Ginkgo with kubevirt test framework"

