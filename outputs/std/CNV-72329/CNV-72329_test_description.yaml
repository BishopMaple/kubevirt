  - scenario_id: "1"
    test_id: "TS-CNV72329-001"
    tier: "Tier 1"
    priority: "P0"
    mvp: true
    requirement_id: "CNV-72329"

    patterns:
      primary: "migration_connectivity"
      secondary:
        - "bridge_nad_setup"
        - "vmi_create_with_network"
        - "patch_vm_network"
      helpers_required:
        - name: "libnet"
          functions: ["NewBridgeNetAttachDef", "CreateNAD"]
          purpose: "Create bridge-type NADs for secondary networking"
        - name: "libvmifact"
          functions: ["NewFedora"]
          purpose: "Create Fedora VMI with secondary network interface"
        - name: "libwait"
          functions: ["WaitUntilVMIReady"]
          purpose: "Wait for VMI readiness after creation"
        - name: "libvmops"
          functions: ["RunVMIAndExpectLaunch"]
          purpose: "Launch VMI and verify running state"
      decorators:
        - "decorators.SigNetwork"
        - "Serial"

    variables:
      closure_scope:
        - name: "ctx"
          type: "context.Context"
          initialized_in: "BeforeAll"
