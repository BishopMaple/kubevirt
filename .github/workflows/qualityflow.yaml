# Standalone QualityFlow workflow — multi-agent QE pipeline for a PR.
# Triggered by commenting /qf on a PR (optionally with Jira ticket: /qf CNV-12345).
# Uses FullSend infrastructure (WIF auth, sandboxed agent execution).
#
# Pipeline: stp-builder → std-builder → go-test-generator → python-test-generator → clean test PR
# Each agent runs in its own FullSend sandbox, passing outputs via the PR repo.
# After all agents complete, a clean test PR is created with only implemented test files.
name: qualityflow

permissions:
  actions: write
  id-token: write
  contents: write
  issues: write
  packages: read
  pull-requests: write

on:
  issue_comment:
    types: [created]

jobs:
  qualityflow:
    name: QualityFlow
    runs-on: ubuntu-latest
    if: >-
      github.event.issue.pull_request
      && github.event.comment.user.type != 'Bot'
      && startsWith(github.event.comment.body, '/qf')
      && (
        github.event.comment.author_association == 'OWNER'
        || github.event.comment.author_association == 'MEMBER'
        || github.event.comment.author_association == 'COLLABORATOR'
        || github.event.comment.author_association == 'CONTRIBUTOR'
      )

    steps:
      - name: Checkout config repository
        uses: actions/checkout@v6

      - name: Checkout upstream defaults
        uses: actions/checkout@v6
        with:
          repository: fullsend-ai/fullsend
          ref: v0
          path: .defaults
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/
            .github/scripts/
            internal/scaffold/fullsend-repo/
            action.yml

      - name: Prepare workspace (upstream defaults + repo overrides)
        run: |
          set -euo pipefail
          SRC=".defaults/internal/scaffold/fullsend-repo"
          LAYERED_DIRS="agents skills schemas harness plugins policies scripts env docs"
          for dir in ${LAYERED_DIRS}; do
            if [[ -d "${SRC}/${dir}" ]]; then
              mkdir -p "${dir}"
              cp -r "${SRC}/${dir}/." "${dir}/"
            fi
          done
          CUSTOM_BASE=".fullsend/customized"
          for dir in ${LAYERED_DIRS} config; do
            if [[ -d "${CUSTOM_BASE}/${dir}" ]]; then
              find "${CUSTOM_BASE}/${dir}" -type f ! -name '.gitkeep' -print0 \
                | while IFS= read -r -d '' f; do
                    rel="${f#"${CUSTOM_BASE}"/}"
                    mkdir -p "$(dirname "${rel}")"
                    cp "${f}" "${rel}"
                  done
            fi
          done
          mkdir -p .github/scripts
          cp "${SRC}/.github/scripts/setup-agent-env.sh" .github/scripts/setup-agent-env.sh 2>/dev/null || true

      - name: Validate enrollment and extract repo metadata
        id: repo-parts
        uses: ./.defaults/.github/actions/validate-enrollment
        with:
          source_repo: ${{ github.repository }}
          install_mode: per-repo

      - name: Mint qualityflow token
        id: app-token
        uses: ./.defaults/.github/actions/mint-token
        with:
          role: coder
          repos: ${{ steps.repo-parts.outputs.name }}
          mint_url: ${{ vars.FULLSEND_MINT_URL }}

      - name: Extract PR info
        id: pr-info
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          HEAD_REF=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.head.ref')
          BASE_REF=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.base.ref')
          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "head_ref=${HEAD_REF}" >> "${GITHUB_OUTPUT}"
          echo "base_ref=${BASE_REF}" >> "${GITHUB_OUTPUT}"
          echo "::notice::PR #${PR_NUMBER}: ${HEAD_REF} -> ${BASE_REF}"

      - name: Extract Jira ticket
        id: jira
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          JIRA_TICKET=""

          # Try /qf comment body first (e.g. "/qf CNV-72329").
          if [[ -n "${COMMENT_BODY}" ]]; then
            JIRA_TICKET=$(printf '%s\n' "${COMMENT_BODY}" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -1 || true)
          fi

          # Fallback: PR title.
          if [[ -z "${JIRA_TICKET}" ]]; then
            PR_TITLE=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.title' 2>/dev/null || true)
            if [[ -n "${PR_TITLE}" ]]; then
              JIRA_TICKET=$(printf '%s\n' "${PR_TITLE}" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -1 || true)
            fi
          fi

          # Fallback: PR body.
          if [[ -z "${JIRA_TICKET}" ]]; then
            PR_BODY=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.body' 2>/dev/null || true)
            if [[ -n "${PR_BODY}" ]]; then
              JIRA_TICKET=$(printf '%s\n' "${PR_BODY}" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -1 || true)
            fi
          fi

          if [[ -z "${JIRA_TICKET}" ]]; then
            echo "::error::No Jira ticket found in /qf command, PR title, or PR body"
            exit 1
          fi

          echo "jira_ticket=${JIRA_TICKET}" >> "${GITHUB_OUTPUT}"
          echo "::notice::Jira ticket: ${JIRA_TICKET}"

      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.pr-info.outputs.head_ref }}
          path: pr-repo
          fetch-depth: 1
          persist-credentials: true

      - name: Record PRE_AGENT_HEAD
        id: pre-head
        run: |
          PRE_AGENT_HEAD=$(git -C pr-repo rev-parse HEAD)
          echo "sha=${PRE_AGENT_HEAD}" >> "${GITHUB_OUTPUT}"
          echo "::notice::PRE_AGENT_HEAD=${PRE_AGENT_HEAD}"

      - name: Setup GCP and prepare credentials
        uses: ./.defaults/.github/actions/setup-gcp
        with:
          gcp_wif_provider: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
          gcp_project_id: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}

      - name: Setup agent environment
        env:
          AGENT_PREFIX: QF_
          QF_GH_TOKEN: ${{ steps.app-token.outputs.token }}
          QF_ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
          QF_CLOUD_ML_REGION: ${{ vars.FULLSEND_GCP_REGION }}
          QF_JIRA_BASE_URL: ${{ secrets.JIRA_URL }}
          QF_JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          QF_JIRA_USER_EMAIL: ${{ secrets.JIRA_EMAIL }}
        run: bash .github/scripts/setup-agent-env.sh

      - name: Patch GCP credentials for URL-based OIDC refresh
        run: |
          set -euo pipefail
          cat > /tmp/patch-gcp-creds.sh << 'PATCH_EOF'
          #!/bin/bash
          set -euo pipefail
          CRED_FILE="${GOOGLE_APPLICATION_CREDENTIALS}"
          if [[ ! -f "${CRED_FILE}" ]]; then
            echo "::warning::No credential file at ${CRED_FILE}, skipping patch"
            exit 0
          fi
          OIDC_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$(python3 -c "
          import json, urllib.parse
          with open('${CRED_FILE}') as f:
              c = json.load(f)
          print(urllib.parse.quote(c.get('audience', ''), safe=''))
          ")"
          OIDC_TOKEN="${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
          python3 -c "
          import json, sys
          cred_file = sys.argv[1]
          oidc_url = sys.argv[2]
          oidc_token = sys.argv[3]
          with open(cred_file) as f:
              cred = json.load(f)
          cred['credential_source'] = {
              'url': oidc_url,
              'headers': {'Authorization': 'bearer ' + oidc_token},
              'format': {'type': 'json', 'subject_token_field_name': 'value'}
          }
          with open(cred_file, 'w') as f:
              json.dump(cred, f, indent=2)
          " "${CRED_FILE}" "${OIDC_URL}" "${OIDC_TOKEN}"
          echo "::notice::Patched ${CRED_FILE} to use URL-based OIDC source"
          PATCH_EOF
          chmod +x /tmp/patch-gcp-creds.sh
          bash /tmp/patch-gcp-creds.sh

      # --- QualityFlow pipeline: each agent runs in its own sandbox ---

      - name: Inject agent push instructions
        env:
          JIRA_TICKET: ${{ steps.jira.outputs.jira_ticket }}
        run: |
          cat > "${{ github.workspace }}/pr-repo/CLAUDE.md" << 'AGENT_EOF'
          # QualityFlow Agent — Output Preservation

          CRITICAL REQUIREMENT: Before finishing your task, you MUST push all
          generated output files to the PR branch. The sandbox file extraction
          channel is unreliable and output will be lost if you skip this step.

          After writing all output files to $FULLSEND_OUTPUT_DIR, run these
          commands to push them to the PR branch:

          ```bash
          # Copy output to target repo
          DEST="$FULLSEND_TARGET_REPO_DIR/outputs"
          cd "$FULLSEND_TARGET_REPO_DIR"
          git config user.email "qualityflow[bot]@users.noreply.github.com"
          git config user.name "QualityFlow"

          # Derive repo and branch from git state
          REMOTE_URL=$(git remote get-url origin)
          REPO_NAME=$(echo "$REMOTE_URL" | sed -n 's|.*github\.com[:/]\(.*\)\.git|\1|p')
          BRANCH=$(git rev-parse --abbrev-ref HEAD)

          # Authenticate and push
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO_NAME}.git"
          git add outputs/
          git commit -m "Add QualityFlow output for $JIRA_TICKET [skip ci]" || true
          git push origin "HEAD:$BRANCH" || echo "Push failed — output available in sandbox artifacts"
          ```

          This is MANDATORY. Do not consider your task complete until you have
          attempted the git push.
          AGENT_EOF
          echo "::notice::Injected CLAUDE.md push instructions into PR repo"

      - name: "QF Stage 1: STP Builder"
        id: stage1
        uses: ./.defaults/
        env:
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          REPO_FULL_NAME: ${{ github.repository }}
          TARGET_BRANCH: ${{ steps.pr-info.outputs.head_ref }}
          TRIGGER_SOURCE: slash-command
          JIRA_TICKET: ${{ steps.jira.outputs.jira_ticket }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          PRE_AGENT_HEAD: ${{ steps.pre-head.outputs.sha }}
          PR_CHECKOUT_PATH: ${{ github.workspace }}/pr-repo
          SOURCE_REPO_PATH: ${{ github.workspace }}/pr-repo
          GCP_OIDC_TOKEN_FILE: ""
          FULLSEND_GCP_OIDC_URL: ""
          FULLSEND_GCP_OIDC_AUTH_FILE: ""
        with:
          agent: stp-builder
          version: latest
          target-repo: ${{ github.workspace }}/pr-repo

      - name: Stage handoff — copy STP output into PR repo
        env:
          JIRA_TICKET: ${{ steps.jira.outputs.jira_ticket }}
        run: |
          set -euo pipefail
          STP_FILE=$(find "${GITHUB_WORKSPACE}/output" -name "${JIRA_TICKET}_test_plan.md" -type f | head -1)
          if [[ -z "${STP_FILE}" ]]; then
            echo "::error::STP output not found after Stage 1"
            exit 1
          fi
          DEST="${GITHUB_WORKSPACE}/pr-repo/outputs/stp/${JIRA_TICKET}"
          mkdir -p "${DEST}"
          cp "${STP_FILE}" "${DEST}/"
          echo "::notice::Copied STP to ${DEST}/${JIRA_TICKET}_test_plan.md"

      - name: Refresh GCP credentials (Stage 2)
        uses: ./.defaults/.github/actions/setup-gcp
        with:
          gcp_wif_provider: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
          gcp_project_id: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}

      - name: Patch GCP credentials (Stage 2)
        run: bash /tmp/patch-gcp-creds.sh

      - name: "QF Stage 2: STD Builder"
        id: stage2
        continue-on-error: true
        uses: ./.defaults/
        env:
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          REPO_FULL_NAME: ${{ github.repository }}
          TARGET_BRANCH: ${{ steps.pr-info.outputs.head_ref }}
          TRIGGER_SOURCE: slash-command
          JIRA_TICKET: ${{ steps.jira.outputs.jira_ticket }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          PRE_AGENT_HEAD: ${{ steps.pre-head.outputs.sha }}
          PR_CHECKOUT_PATH: ${{ github.workspace }}/pr-repo
          SOURCE_REPO_PATH: ${{ github.workspace }}/pr-repo
          GCP_OIDC_TOKEN_FILE: ""
          FULLSEND_GCP_OIDC_URL: ""
          FULLSEND_GCP_OIDC_AUTH_FILE: ""
        with:
          agent: std-builder
          version: latest
          target-repo: ${{ github.workspace }}/pr-repo

      - name: Restore PR checkout (post-Stage 2)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          PR_REPO="${GITHUB_WORKSPACE}/pr-repo"
          HEAD_REF="${{ steps.pr-info.outputs.head_ref }}"
          if [[ ! -d "${PR_REPO}/.git" ]]; then
            echo "::notice::PR repo was cleaned up by FullSend, re-cloning..."
            rm -rf "${PR_REPO}"
            git clone --depth 1 --branch "${HEAD_REF}" \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
              "${PR_REPO}"
          else
            git -C "${PR_REPO}" remote set-url origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            git -C "${PR_REPO}" fetch origin "${HEAD_REF}"
            git -C "${PR_REPO}" reset --hard "origin/${HEAD_REF}"
          fi
          echo "::notice::PR repo HEAD: $(git -C "${PR_REPO}" log --oneline -1)"

      - name: Stage handoff — sync STD output
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          JIRA_TICKET: ${{ steps.jira.outputs.jira_ticket }}
        run: |
          set -euo pipefail
          PR_REPO="${GITHUB_WORKSPACE}/pr-repo"
          DEST="${PR_REPO}/outputs/std/${JIRA_TICKET}"

          # Source 1: FullSend extraction (works if sandbox gRPC was alive)
          STD_FILE=$(find "${GITHUB_WORKSPACE}/output" -name "${JIRA_TICKET}_test_description.yaml" -type f 2>/dev/null | head -1)
          if [[ -n "${STD_FILE}" ]]; then
            mkdir -p "${DEST}" "${DEST}/go-tests" "${DEST}/python-tests"
            cp "${STD_FILE}" "${DEST}/"
            for stub in $(find "${GITHUB_WORKSPACE}/output" -name "*_stubs_test.go" -o -name "test_*_stubs.py" 2>/dev/null); do
              if [[ "${stub}" == *_test.go ]]; then
                cp "${stub}" "${DEST}/go-tests/"
              else
                cp "${stub}" "${DEST}/python-tests/"
              fi
            done
            echo "::notice::STD recovered from FullSend extraction"
          fi

          # Source 2: Agent pushed to PR branch (already in restored pr-repo)
          if [[ -f "${DEST}/${JIRA_TICKET}_test_description.yaml" ]]; then
            echo "::notice::STD output available at ${DEST}/"
          else
            echo "::error::No STD output found from any source"
            echo "::notice::FullSend output dir contents:"
            find "${GITHUB_WORKSPACE}/output" -type f 2>/dev/null || echo "(empty)"
            echo "::notice::PR repo outputs dir:"
            find "${PR_REPO}/outputs" -type f 2>/dev/null || echo "(empty)"
            exit 1
          fi

      - name: Refresh GCP credentials (Stage 3)
        uses: ./.defaults/.github/actions/setup-gcp
        with:
          gcp_wif_provider: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
          gcp_project_id: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}

      - name: Patch GCP credentials (Stage 3)
        run: bash /tmp/patch-gcp-creds.sh

      - name: Re-inject CLAUDE.md for Stage 3
        env:
          JIRA_TICKET: ${{ steps.jira.outputs.jira_ticket }}
        run: |
          cat > "${{ github.workspace }}/pr-repo/CLAUDE.md" << 'AGENT_EOF'
          # QualityFlow Agent — Output Preservation

          CRITICAL REQUIREMENT: Before finishing your task, you MUST push all
          generated output files to the PR branch. The sandbox file extraction
          channel is unreliable and output will be lost if you skip this step.

          After writing all output files to $FULLSEND_OUTPUT_DIR, run these
          commands to push them to the PR branch:

          ```bash
          # Copy output to target repo
          DEST="$FULLSEND_TARGET_REPO_DIR/outputs"
          cd "$FULLSEND_TARGET_REPO_DIR"
          git config user.email "qualityflow[bot]@users.noreply.github.com"
          git config user.name "QualityFlow"

          # Derive repo and branch from git state
          REMOTE_URL=$(git remote get-url origin)
          REPO_NAME=$(echo "$REMOTE_URL" | sed -n 's|.*github\.com[:/]\(.*\)\.git|\1|p')
          BRANCH=$(git rev-parse --abbrev-ref HEAD)

          # Authenticate and push
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO_NAME}.git"
          git add outputs/
          git commit -m "Add QualityFlow output for $JIRA_TICKET [skip ci]" || true
          git push origin "HEAD:$BRANCH" || echo "Push failed — output available in sandbox artifacts"
          ```

          This is MANDATORY. Do not consider your task complete until you have
          attempted the git push.
          AGENT_EOF
          echo "::notice::Re-injected CLAUDE.md for Stage 3"

      - name: "QF Stage 3: Go Test Generator"
        id: stage3
        continue-on-error: true
        uses: ./.defaults/
        env:
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          REPO_FULL_NAME: ${{ github.repository }}
          TARGET_BRANCH: ${{ steps.pr-info.outputs.head_ref }}
          TRIGGER_SOURCE: slash-command
          JIRA_TICKET: ${{ steps.jira.outputs.jira_ticket }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          PRE_AGENT_HEAD: ${{ steps.pre-head.outputs.sha }}
          PR_CHECKOUT_PATH: ${{ github.workspace }}/pr-repo
          SOURCE_REPO_PATH: ${{ github.workspace }}/pr-repo
          GCP_OIDC_TOKEN_FILE: ""
          FULLSEND_GCP_OIDC_URL: ""
          FULLSEND_GCP_OIDC_AUTH_FILE: ""
        with:
          agent: go-test-generator
          version: latest
          target-repo: ${{ github.workspace }}/pr-repo

      - name: Restore PR checkout (post-Stage 3)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          PR_REPO="${GITHUB_WORKSPACE}/pr-repo"
          HEAD_REF="${{ steps.pr-info.outputs.head_ref }}"
          if [[ ! -d "${PR_REPO}/.git" ]]; then
            echo "::notice::PR repo was cleaned up by FullSend, re-cloning..."
            rm -rf "${PR_REPO}"
            git clone --depth 1 --branch "${HEAD_REF}" \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
              "${PR_REPO}"
          else
            git -C "${PR_REPO}" remote set-url origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            git -C "${PR_REPO}" fetch origin "${HEAD_REF}"
            git -C "${PR_REPO}" reset --hard "origin/${HEAD_REF}"
          fi
          echo "::notice::PR repo HEAD: $(git -C "${PR_REPO}" log --oneline -1)"

      - name: Refresh GCP credentials (Stage 4)
        uses: ./.defaults/.github/actions/setup-gcp
        with:
          gcp_wif_provider: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
          gcp_project_id: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}

      - name: Patch GCP credentials (Stage 4)
        run: bash /tmp/patch-gcp-creds.sh

      - name: Re-inject CLAUDE.md for Stage 4
        env:
          JIRA_TICKET: ${{ steps.jira.outputs.jira_ticket }}
        run: |
          cat > "${{ github.workspace }}/pr-repo/CLAUDE.md" << 'AGENT_EOF'
          # QualityFlow Agent — Output Preservation

          CRITICAL REQUIREMENT: Before finishing your task, you MUST push all
          generated output files to the PR branch. The sandbox file extraction
          channel is unreliable and output will be lost if you skip this step.

          After writing all output files to $FULLSEND_OUTPUT_DIR, run these
          commands to push them to the PR branch:

          ```bash
          # Copy output to target repo
          DEST="$FULLSEND_TARGET_REPO_DIR/outputs"
          cd "$FULLSEND_TARGET_REPO_DIR"
          git config user.email "qualityflow[bot]@users.noreply.github.com"
          git config user.name "QualityFlow"

          # Derive repo and branch from git state
          REMOTE_URL=$(git remote get-url origin)
          REPO_NAME=$(echo "$REMOTE_URL" | sed -n 's|.*github\.com[:/]\(.*\)\.git|\1|p')
          BRANCH=$(git rev-parse --abbrev-ref HEAD)

          # Authenticate and push
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO_NAME}.git"
          git add outputs/
          git commit -m "Add QualityFlow output for $JIRA_TICKET [skip ci]" || true
          git push origin "HEAD:$BRANCH" || echo "Push failed — output available in sandbox artifacts"
          ```

          This is MANDATORY. Do not consider your task complete until you have
          attempted the git push.
          AGENT_EOF
          echo "::notice::Re-injected CLAUDE.md for Stage 4"

      - name: "QF Stage 4: Python Test Generator"
        id: stage4
        continue-on-error: true
        uses: ./.defaults/
        env:
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          REPO_FULL_NAME: ${{ github.repository }}
          TARGET_BRANCH: ${{ steps.pr-info.outputs.head_ref }}
          TRIGGER_SOURCE: slash-command
          JIRA_TICKET: ${{ steps.jira.outputs.jira_ticket }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          PRE_AGENT_HEAD: ${{ steps.pre-head.outputs.sha }}
          PR_CHECKOUT_PATH: ${{ github.workspace }}/pr-repo
          SOURCE_REPO_PATH: ${{ github.workspace }}/pr-repo
          GCP_OIDC_TOKEN_FILE: ""
          FULLSEND_GCP_OIDC_URL: ""
          FULLSEND_GCP_OIDC_AUTH_FILE: ""
        with:
          agent: python-test-generator
          version: latest
          target-repo: ${{ github.workspace }}/pr-repo

      # --- Post-pipeline: create clean test PR ---

      - name: Restore PR checkout (post-Stage 4)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          PR_REPO="${GITHUB_WORKSPACE}/pr-repo"
          HEAD_REF="${{ steps.pr-info.outputs.head_ref }}"
          if [[ ! -d "${PR_REPO}/.git" ]]; then
            echo "::notice::PR repo was cleaned up by FullSend, re-cloning..."
            rm -rf "${PR_REPO}"
            git clone --depth 1 --branch "${HEAD_REF}" \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
              "${PR_REPO}"
          else
            git -C "${PR_REPO}" remote set-url origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            git -C "${PR_REPO}" fetch origin "${HEAD_REF}"
            git -C "${PR_REPO}" reset --hard "origin/${HEAD_REF}"
          fi
          echo "::notice::PR repo HEAD: $(git -C "${PR_REPO}" log --oneline -1)"

      - name: Create clean test PR
        id: test-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          JIRA_TICKET: ${{ steps.jira.outputs.jira_ticket }}
        run: |
          set -euo pipefail
          PR_REPO="${GITHUB_WORKSPACE}/pr-repo"
          HEAD_REF="${{ steps.pr-info.outputs.head_ref }}"
          TEST_BRANCH="qf/${JIRA_TICKET}/tests"

          cd "${PR_REPO}"
          git config user.email "guyoron1@users.noreply.github.com"
          git config user.name "QualityFlow"

          # Create test branch from code PR HEAD
          git checkout -B "${TEST_BRANCH}" "origin/${HEAD_REF}"

          # --- Place Go test files ---
          GO_SRC="outputs/go-tests/${JIRA_TICKET}"
          GO_COUNT=0
          if [[ -d "${GO_SRC}" ]]; then
            for testfile in "${GO_SRC}"/*_test.go; do
              [[ -f "${testfile}" ]] || continue
              # Extract package name from file
              PKG_NAME=$(head -20 "${testfile}" | grep -m1 '^package ' | awk '{print $2}')
              if [[ -z "${PKG_NAME}" ]]; then
                PKG_NAME="network"  # fallback to default
              fi
              DEST_DIR="tests/${PKG_NAME}"
              mkdir -p "${DEST_DIR}"
              cp "${testfile}" "${DEST_DIR}/"
              GO_COUNT=$((GO_COUNT + 1))
              echo "::notice::Go test: $(basename "${testfile}") → ${DEST_DIR}/"
            done
          fi

          # --- Place Python test files ---
          PY_SRC="outputs/python-tests/${JIRA_TICKET}"
          PY_COUNT=0
          if [[ -d "${PY_SRC}" ]]; then
            PY_DEST="qf-python-tests/${JIRA_TICKET}"
            mkdir -p "${PY_DEST}"
            for pyfile in "${PY_SRC}"/test_*.py "${PY_SRC}"/conftest.py; do
              [[ -f "${pyfile}" ]] || continue
              cp "${pyfile}" "${PY_DEST}/"
              PY_COUNT=$((PY_COUNT + 1))
              echo "::notice::Python test: $(basename "${pyfile}") → ${PY_DEST}/"
            done
            cat > "${PY_DEST}/README.md" << PYREADME_EOF
          # QualityFlow Python Tests — ${JIRA_TICKET}

          These tier 2 (E2E) pytest tests were generated by the QualityFlow pipeline.

          **Canonical destination:** \`RedHatQE/openshift-virtualization-tests\`

          These files are staged here because they belong in a separate repository.
          Copy them to the appropriate test directory in the target repo.
          PYREADME_EOF
          fi

          # --- Remove intermediate artifacts ---
          git rm -rf outputs/ 2>/dev/null || true
          git rm -f CLAUDE.md 2>/dev/null || true

          # --- Add test files ---
          git add tests/ 2>/dev/null || true
          git add qf-python-tests/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "::warning::No test files found to create test PR"
            echo "test_pr_created=false" >> "${GITHUB_OUTPUT}"
            echo "go_count=0" >> "${GITHUB_OUTPUT}"
            echo "py_count=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git commit -m "Add QualityFlow tests for ${JIRA_TICKET}

          Go tier 1 tests: ${GO_COUNT} files
          Python tier 2 tests: ${PY_COUNT} files
          Jira: ${JIRA_TICKET}"

          # Push test branch (force-with-lease for idempotent re-runs)
          git push --force-with-lease origin "HEAD:${TEST_BRANCH}"

          # Create PR targeting the code PR branch (stacked PR)
          EXISTING_PR=$(gh pr list --repo "${{ github.repository }}" --head "${TEST_BRANCH}" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [[ -n "${EXISTING_PR}" ]]; then
            echo "::notice::Test PR already exists: #${EXISTING_PR}"
            echo "test_pr_number=${EXISTING_PR}" >> "${GITHUB_OUTPUT}"
          else
            PR_URL=$(gh pr create \
              --repo "${{ github.repository }}" \
              --head "${TEST_BRANCH}" \
              --base "${HEAD_REF}" \
              --title "tests(${JIRA_TICKET}): QualityFlow generated tests" \
              --body "$(cat <<PR_BODY_EOF
          ## QualityFlow Test PR

          Generated test implementations for **${JIRA_TICKET}**.

          | Type | Count | Location |
          |------|-------|----------|
          | Go/Ginkgo tier 1 | ${GO_COUNT} | \`tests/{package}/\` |
          | Python/pytest tier 2 | ${PY_COUNT} | \`qf-python-tests/${JIRA_TICKET}/\` |

          > Python tests are staged — they belong in \`RedHatQE/openshift-virtualization-tests\`.

          ---
          *Generated by QualityFlow pipeline*
          PR_BODY_EOF
          )")
            PR_NUM=$(echo "${PR_URL}" | grep -oE '[0-9]+$')
            echo "::notice::Created test PR: ${PR_URL}"
            echo "test_pr_number=${PR_NUM}" >> "${GITHUB_OUTPUT}"
          fi

          echo "test_pr_created=true" >> "${GITHUB_OUTPUT}"
          echo "go_count=${GO_COUNT}" >> "${GITHUB_OUTPUT}"
          echo "py_count=${PY_COUNT}" >> "${GITHUB_OUTPUT}"

      - name: Clean artifacts from code PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          JIRA_TICKET: ${{ steps.jira.outputs.jira_ticket }}
        run: |
          set -euo pipefail
          PR_REPO="${GITHUB_WORKSPACE}/pr-repo"
          HEAD_REF="${{ steps.pr-info.outputs.head_ref }}"

          cd "${PR_REPO}"
          git checkout "${HEAD_REF}" 2>/dev/null || git checkout -B "${HEAD_REF}" "origin/${HEAD_REF}"
          git config user.email "guyoron1@users.noreply.github.com"
          git config user.name "QualityFlow"

          git rm -rf outputs/ 2>/dev/null || true
          git rm -f CLAUDE.md 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Clean QualityFlow intermediate artifacts [skip ci]"
            git push origin "HEAD:${HEAD_REF}"
            echo "::notice::Cleaned outputs/ and CLAUDE.md from code PR branch"
          else
            echo "::notice::No artifacts to clean from code PR branch"
          fi

      - name: Post pipeline summary
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          JIRA_TICKET: ${{ steps.jira.outputs.jira_ticket }}
          S1_OUTCOME: ${{ steps.stage1.conclusion || 'skipped' }}
          S2_OUTCOME: ${{ steps.stage2.conclusion || 'skipped' }}
          S3_OUTCOME: ${{ steps.stage3.conclusion || 'skipped' }}
          S4_OUTCOME: ${{ steps.stage4.conclusion || 'skipped' }}
          TEST_PR_NUM: ${{ steps.test-pr.outputs.test_pr_number }}
          TEST_GO_COUNT: ${{ steps.test-pr.outputs.go_count }}
          TEST_PY_COUNT: ${{ steps.test-pr.outputs.py_count }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.pr-info.outputs.pr_number }}"
          GO_COUNT="${TEST_GO_COUNT:-0}"
          PY_COUNT="${TEST_PY_COUNT:-0}"

          icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              *) echo "⏭️" ;;
            esac
          }

          if [[ -n "${TEST_PR_NUM}" ]]; then
            TEST_PR_LINK="**[Test PR #${TEST_PR_NUM}](https://github.com/${{ github.repository }}/pull/${TEST_PR_NUM})**"
          else
            TEST_PR_LINK="_No test PR created_"
          fi

          BODY="<!-- qf-summary -->
          ## QualityFlow Pipeline Summary

          | Stage | Agent | Status |
          |-------|-------|--------|
          | 1 | STP Builder | $(icon "${S1_OUTCOME}") |
          | 2 | STD Builder | $(icon "${S2_OUTCOME}") |
          | 3 | Go Test Generator | $(icon "${S3_OUTCOME}") |
          | 4 | Python Test Generator | $(icon "${S4_OUTCOME}") |

          ### Test Output
          - Go/Ginkgo tier 1: **${GO_COUNT}** files
          - Python/pytest tier 2: **${PY_COUNT}** files
          - ${TEST_PR_LINK}

          **Jira:** [${JIRA_TICKET}](https://issues.redhat.com/browse/${JIRA_TICKET})

          ---
          *Generated by [QualityFlow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*"

          # Strip leading whitespace from heredoc indentation
          BODY=$(echo "${BODY}" | sed 's/^          //')

          EXISTING_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- qf-summary -->")) | .id' 2>/dev/null | head -1 || true)

          if [[ -n "${EXISTING_ID}" ]]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${EXISTING_ID}" \
              -f body="${BODY}"
            echo "::notice::Updated existing summary comment #${EXISTING_ID}"
          else
            gh api --method POST "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -f body="${BODY}"
            echo "::notice::Posted new summary comment on PR #${PR_NUMBER}"
          fi
